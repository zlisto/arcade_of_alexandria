<html lang="en">
<head>

<title>Legend of Valence Bible</title>

<style>
:root{
  --ink:#ece7dc; --ink-soft:#c2bcae; --muted:#8a8476; --line:#2e2a33; --paper:#0f0d14; --panel:#17141d; --wash:#201b29;
  --cyan:#43d6e8; --violet:#a06bff; --crimson:#c0394b; --gold:#e8c46a; --radius:12px;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.4);
  --display:"Cinzel",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:var(--body);line-height:1.55;
  background:radial-gradient(1000px 500px at 5% -10%,rgba(67,214,232,.12),transparent 55%),
             radial-gradient(900px 480px at 100% 0%,rgba(160,107,255,.12),transparent 50%),var(--paper)}
.shell{max-width:1080px;margin:0 auto;padding:1.5rem 16px 4rem}
.cover{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#08070b}
.cover img{display:block;width:100%;height:auto;max-height:560px;object-fit:cover}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin:1.2rem 0 .3rem}
h1{font-family:var(--display);font-size:clamp(1.9rem,5vw,3rem);margin:0 0 .3rem;letter-spacing:.02em}
.tagline{color:var(--gold);margin:0 0 .6rem;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 1rem}
.stats span{font-size:.8rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.2rem .65rem;color:var(--ink-soft)}
nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:.3rem;overflow-x:auto;padding:.6rem 0;background:linear-gradient(var(--paper) 75%,transparent);margin-bottom:.6rem}
nav.tabs button{flex:0 0 auto;font:inherit;font-size:.88rem;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.38rem .9rem;cursor:pointer}
nav.tabs button.on{color:#0b0a10;background:var(--cyan);border-color:var(--cyan);font-weight:600}
section.tab{display:none} section.tab.on{display:block}
h2{font-family:var(--display);font-size:1.5rem;margin:.6rem 0 .8rem}
h3{font-family:var(--display);font-size:1.1rem;margin:0 0 .35rem}
.prose p{margin:.4rem 0 .8rem;color:var(--ink-soft)} .prose strong{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card .img{background:#0b0a10;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.card .img.sq{aspect-ratio:1/1} .card .img.wide{aspect-ratio:16/9}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .img .ph{color:var(--muted);font-size:.8rem;padding:1rem;text-align:center}
.card .body{padding:.8rem .9rem 1rem;font-size:.9rem}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-bottom:.25rem;font-weight:600}
.card p{margin:.3rem 0;color:var(--ink-soft)}
.secs{font-size:.78rem;color:var(--muted);margin-top:.5rem}
.secs b{color:var(--cyan);font-weight:500}
.world{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow)}
.world > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;padding:12px}
.world > summary::-webkit-details-marker{display:none}
.world > summary img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:#0b0a10}
.world .num{font-family:var(--display);color:var(--gold);font-size:.85rem}
.world .inner{padding:0 16px 16px}
.world .key{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:.6rem 0}
.box{background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;font-size:.88rem}
.box .lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}
.claim{border-left:3px solid var(--crimson);background:rgba(192,57,75,.08)}
.chamber{border-top:1px solid var(--line);padding:.6rem 0;font-size:.9rem}
.chamber .t{font-weight:600} .chamber .p{color:var(--ink-soft);margin:.2rem 0}
.sec{font-size:.8rem;color:var(--muted)} .sec b{color:var(--cyan);font-weight:500}
.figs{display:flex;gap:10px;overflow-x:auto;padding:.4rem 0}
.fig{flex:0 0 220px;background:#fff;border-radius:8px;overflow:hidden;color:#222;font-size:.75rem}
.fig img{width:100%;height:130px;object-fit:contain;background:#fff;display:block}
.fig div{padding:.4rem .5rem;background:#f3f1ea}
.bigart{width:100%;border-radius:10px;display:block;margin:.4rem 0 .8rem;aspect-ratio:16/9;object-fit:cover;background:#0b0a10}
svg.map{width:100%;height:auto;background:#141019;border:1px solid var(--line);border-radius:var(--radius)}
.map text{font-family:var(--body);font-size:15px;fill:var(--ink)}
.chap{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:.2rem .9rem}
.chap summary{cursor:pointer;padding:.6rem 0;font-weight:600}
.small{font-size:.8rem;color:var(--muted)}
footer{margin-top:3rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:1rem}
@media (max-width:640px){ .world > summary{grid-template-columns:1fr} }
</style>
</head>

const DATA = {"concept": {"source": {"contents": "games/organic_chemistry/book_contents/contents.json", "book_title": "Organic Chemistry: A Tenth Edition (Chapters 1–12)", "book_author": "John McMurry", "publisher": "OpenStax, Rice University", "license": "CC BY-NC-SA 4.0", "url": "https://openstax.org/details/books/organic-chemistry", "pdf": "books/OrganicChemistry-SAMPLE_9ADraVJ.pdf", "page_note": "Page numbers are printed book pages; pdf page = book page + 12. Section ids match book_contents/contents.json."}, "meta": {"stage": "concept", "created": "2026-10-22", "structure": "Open-world 3D action-adventure in the browser: one streamed overworld (the Kingdom of Valence) and 12 dungeons, one per chapter. Each dungeon is its own scene and code bundle, loaded only when entered.", "level_beats": "Every chamber runs teach → practice → twist → master. The sage teaches, the room drills it, an enemy or trap twists it, and the dungeon boss demands it.", "faithfulness": "Every mechanic, enemy rule and puzzle answer comes from the cited book sections. Anything stylized (names, story, art) is fiction around real chemistry; chemistry claims are never invented."}, "cover": {"image_path": "assets/cover.png", "alt": "The Legend of Valence cover — Kai facing Malradix above the Kingdom of Valence", "reference_images": ["games/organic_chemistry/assets/characters/kai.png", "games/organic_chemistry/assets/characters/malradix.png"], "prompt": "Wide cinematic key art: Kai, the young graphite-armored knight with four glowing cyan bond-orbs arranged as a tetrahedron on his armor, stands on a cliff facing Malradix, a towering crimson-robed sorcerer whose single unpaired electron burns as a lone violet star above his staff. Between them spreads the Kingdom of Valence: Carbon Castle at the center, glowing hexagonal benzene-ring lakes, chair-shaped fortress hills, a mirror palace on a crystal lake, a triple-spired tower, a volcanic keep in the distance. Bonds of light are being torn apart in the sky as violet radicals scatter. Painterly stylized 3D fantasy, epic and hopeful.", "image_exists": true}, "story": {"title": "The Legend of Valence", "tagline": "Four bonds. One kingdom. Every reaction has a mechanism.", "logline": "When the sorcerer Malradix shatters the Crown of Tetravalence and sets his radicals loose on the Kingdom of Valence, a lone young carbon knight must master the laws of bonding in twelve ancient dungeons to rebuild the crown and restore the kingdom's molecules.", "premise": "In the Kingdom of Valence everything is made of molecules — houses, rivers, beasts and people. The kingdom holds together because of the Law of the Octet, kept by the Crown of Tetravalence in Carbon Castle. Malradix, a sorcerer who carries a single unpaired electron he refuses to share, has shattered the crown into twelve Bond Shards and hidden them in the kingdom's dungeons, each guarded by a corrupted creature. Without the crown, bonds break by themselves: radicals multiply in the fields, carbocations flicker in the ruins, and molecules come apart. Kai, a young carbon from Hydrogen Village with four open bond sockets, is the only one who can carry all four bonds at once. Guided by Pi, a glowing electron cloud, he sets out across the kingdom.", "tone": "Classic heroic fantasy adventure — lone hero, evil wizard, ancient sages and dungeons — with warm humor and real wonder at how molecules behave. Enemies are menacing but always fair: every one obeys a real rule of chemistry and can be beaten by understanding it.", "setting": "The Kingdom of Valence is one large open overworld around Carbon Castle and its market town. Twelve regions ring the castle, each shaped by one law of chemistry: the Orbital Caverns under the starting village, the acid-and-base Tide Coast, the deep Chain Forest, the ringed Chair Hills, the Mirror Lake, the Activation Peaks, the Plains of Addition, the Reagent Orchards, the Thunder Cliffs of the Triple Spire, the Halogen Marsh, the volcanic Arena of Five, and the mountaintop Observatory of Light. Malradix's Keep rises on the far side of the volcano.", "teaching_spine": "Twelve dungeons follow McMurry's twelve chapters in book order. Each dungeon's sage teaches the chapter, its chambers drill the chapter's sections, its item turns the chapter's key idea into a tool the player keeps using across the open world, and its boss can only be beaten with that idea. Items stack: by the end the player is drawing full curved-arrow mechanisms, choosing reagents, and reading spectra to win fights.", "characters": [{"id": "kai", "arc": "Village carbon → Knight of Valence. Kai starts out bonding by instinct, grabbing whatever is nearest. Each sage teaches him a rule, and he learns that strength comes from understanding where electrons want to go, not from force."}, {"id": "malradix", "arc": "Malradix believes sharing is weakness. A radical with one unpaired electron, he tears other bonds apart to feel complete. In the end Kai pairs Malradix's electron — the only way a radical chain ever really ends."}, {"id": "pi", "arc": "Pi is a π-electron cloud who can drift above and below Kai like a π bond. She gives hints, shows where electron density is, and in the finale lends her electrons to complete the crown."}, {"id": "octavia", "arc": "Princess Octavia keeps the Law of the Octet. Captured early, she sends Kai visions in each dungeon and leads the final restoration of the crown."}], "world_arcs": [{"world": 1, "title": "The Orbital Caverns — What is an atom, and why does it bond?", "beat": "Kai wakes as the first bonds break, learns to shape his own orbitals, and earns the Hybrid Crystal."}, {"world": 2, "title": "Tide Temple — Where do the electrons sit?", "beat": "Kai learns polarity, resonance and the pKa ladder, and takes the Curved-Arrow Hookshot from the Proton Ferrymen."}, {"world": 3, "title": "Chain Labyrinth — Naming and turning", "beat": "Kai learns to read chains, name them, and turn bonds to staggered safety with the Newman Lantern."}, {"world": 4, "title": "Chair Fortress — Rings and seats", "beat": "Kai learns ring strain and the chair, and wins the Ring-Flip Gauntlet."}, {"world": 5, "title": "Mirror Palace — Left and right", "beat": "Kai meets his own mirror image and learns that some locks fit only one hand."}, {"world": 6, "title": "Activation Peaks — How reactions happen", "beat": "Kai climbs energy diagrams, learns nucleophiles from electrophiles, and receives the Activation Boots."}, {"world": 7, "title": "Tower of Addition — Markovnikov's harvest", "beat": "Kai learns why protons land where they do, and how carbocations rearrange."}, {"world": 8, "title": "Reagent Orchards — The alchemist's spellbook", "beat": "Kai gathers a satchel of alkene reagents, each with its own regiochemistry and face."}, {"world": 9, "title": "Triple Spire — The art of synthesis", "beat": "Kai learns to plan backward from a goal and builds his way up the spire."}, {"world": 10, "title": "Halogen Marsh — Radicals and metals", "beat": "Kai hunts the weakest bonds and learns to turn a carbon from target into attacker."}, {"world": 11, "title": "Arena of Five — Substitution and elimination", "beat": "Kai faces Malradix's champion, who fights in five mechanistic stances."}, {"world": 12, "title": "Observatory of Light — The true structure", "beat": "With the Mass Prism and IR Lens, Kai unmasks Malradix's disguise and storms his keep."}], "ending": "With the twelve Bond Shards reunited, the Crown of Tetravalence glows again. In the Keep, Kai does not destroy Malradix; he pairs the sorcerer's lone electron with Pi's, ending the radical chain at last. Bonds re-form across the kingdom, the radicals in the fields pair off and settle, and Octavia names Kai the Knight of Valence.", "themes": ["Understanding beats force: every enemy is defeated by knowing the rule it obeys.", "Sharing makes things stable: bonds, octets and paired electrons.", "Plan backward from the goal: synthesis as a hero's journey."]}, "characters": [{"id": "kai", "name": "Kai", "role": "hero", "element": "carbon", "description": "A quiet, determined young carbon knight from Hydrogen Village. His graphite-black armor carries four glowing bond sockets set at tetrahedral angles; whatever he bonds to clicks into one of them. He can reshape his stance between sp³ (tetrahedral, balanced), sp² (flat, fast) and sp (linear dash).", "book_section_ids": ["1.4", "1.6", "1.8", "1.9"], "image_prompt": "Game-ready full-body hero portrait of Kai, a determined young knight (teen, androgynous-leaning boyish features) in sleek graphite-black layered armor; four glowing cyan bond-orb sockets set on his chest, shoulders and back in a tetrahedral pattern, faint cyan lines linking them; short dark hair, steady gaze, a short sword whose blade is a bar of light; a small glowing blue-white electron cloud fairy floating by his shoulder. Heroic adventurous pose. Painterly high-end stylized 3D fantasy, readable silhouette, deep navy simple background, soft rim light. No text, letters, interface or watermark.", "image_path": "assets/characters/kai.png", "image_exists": true}, {"id": "pi", "name": "Pi", "role": "companion", "element": "π electrons", "description": "Kai's fairy guide, a pair of glowing π-electron lobes that float above and below him. She shows electron density (red rich, blue poor, like an electrostatic potential map), points out lone pairs and empty orbitals, and gives hints.", "book_section_ids": ["1.8", "1.11", "2.1"], "image_prompt": "Game character portrait of Pi, a tiny fairy made of two soft glowing lobes of light, one above and one below a small bright core, like a p orbital, glowing pale blue with a warm red rim on one side, sparkling particles, playful helpful expression suggested by two bright eye points. Painterly stylized 3D fantasy, deep navy simple background, soft glow. No text, letters, interface or watermark.", "image_path": "assets/characters/pi.png", "image_exists": true}, {"id": "m st Iupaca, a precise elderly scholar with half-moon spectacles and an ink-stained green robe, holding a long scroll unrolling into a zigzag carbon chain diagram drawn in glowing lines, a lantern hanging from her belt. Painterly stylized 3D fantasy, forest-green simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/sage-iupaca.png", "image_exists": true}, {"id": "sage_sachse", "name": "Lady Sachse of the Chair", "role": "sage", "dungeon": "world-4", "description": "Lady of the Chair Fortress, who sits only on strain-free thrones. She teaches ring strain, cis/trans on rings, the chair conformation, axial and equatorial seats, and ring-flips.", "book_section_ids": ["4.2", "4.3", "4.5", "4.6", "4.7"], "image_prompt": "Game character portrait of Lady Sachse, a regal noblewoman in violet-gray armor-dress seated on a throne shaped like a cyclohexane chair (zigzag six-carbon ring with alternating up and down points), six glowing seat posts around her, poised and composed. Painterly stylized 3D fantasy, stone-gray simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/sage-sachse.png", "image_exists": true}, {"id": "sister_tartara", "name": "Sister Tartara", "role": "sage", "dungeon": "world-5", "description": "A patient crystal-sorter of the Mirror Palace who, like Pasteur, separates left-handed from right-handed crystals with tweezers. Teaches chirality, R/S, diastereomers, meso compounds and resolution.", "book_section_ids": ["5.1", "5.4", "5.5", "5.7", "5.8"], "image_prompt": "Game character portrait of Sister Tartara, a serene young scholar-nun in silver and pale blue robes, holding fine silver tweezers over two small piles of mirror-image crystals, one glowing gold and one glowing silver, a large mirror behind her. Painterly stylized 3D fantasy, crystal-blue simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/sister-tartara.png", "image_exists": true}, {"id": "warden_hammond", "name": "Pass-Warden Hammond", "role": "sage", "dungeon": "world-6", "description": "The mountain guide of the Activation Peaks, who knows every pass and valley. Teaches reaction types, polar and radical mechanisms, curved arrows, equilibrium, bond energies, energy diagrams, transition states and intermediates.", "book_section_ids": ["6.1", "6.5", "6.7", "6.9", "6.10"], "image_prompt": "Game character portrait of Pass-Warden Hammond, a weathered mountain guide in a heavy orange coat and fur hood, carrying a coil of rope and a staff carved with a curving mountain profile (an energy diagram with two peaks and a valley), snowy peaks behind. Painterly stylized 3D fantasy, cold blue simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/warden-hammond.png", "image_exists": true}, {"id": "farmer_markov", "name": "Farmer Markov", "role": "sage", "dungeon": "world-7", "description": "A wheat farmer of the Plains of Addition with a saying for everything: 'the rich get richer' — the proton goes to the carbon that already has more hydrogens, because that makes the more stable carbocation. Teaches alkene naming, E/Z, stability, electrophilic addition, Markovnikov's rule, carbocations and the Hammond postulate.", "book_section_ids": ["7.2", "7.5", "7.6", "7.8", "7.9", "7.10"], "image_prompt": "Game character portrait of Farmer Markov, a broad-shouldered cheerful farmer with a big mustache in a straw hat and overalls, holding a sheaf of golden wheat whose heads glow like small protons, a sling at his belt, golden fields behind. Painterly stylized 3D fantasy, warm simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/farmer-markov.png", "image_exists": true}, {"id": "alchemist_borana", "name": "Alchemist Borana", "role": "sage", "dungeon": "world-8", "description": "Master of the Reagent Orchards' tower, whose satchel holds a reagent for every alkene transformation. Teaches halogenation, halohydrins, oxymercuration, hydroboration, hydrogenation, epoxidation, OsO4, ozonolysis, carbenes and polymerization — and exactly which carbon and which face each one picks.", "book_section_ids": ["8.2", "8.4", "8.5", "8.6", "8.7", "8.8", "8.9", "8.10"], "image_prompt": "Game character portrait of Alchemist Borana, an energetic middle-aged alchemist with wild silver-streaked hair and goggles, a leather coat with many vials of colored liquids (red-brown, clear, deep violet, pale blue), holding a claw-like brass tool, fruit trees heavy with glowing flasks behind. Painterly stylized 3D fantasy, warm amber simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/alchemist-borana.png", "image_exists": true}, {"id": "sage_lindlar", "name": "Lindlar the Gentle", "role": "sage", "dungeon": "world-9", "description": "A soft-spoken climber who lives atop the Triple Spire and never overdoes anything — his poisoned touch stops a reduction at the cis alkene. Teaches alkynes, acetylide acidity and alkylation, and above all how to plan a synthesis backward from the goal.", "book_section_ids": ["9.4", "9.5", "9.7", "9.8", "9.9"], "image_prompt": "Game character portrait of Lindlar the Gentle, a slender calm hermit-climber in pale gray and lead-gray robes with a long straight walking pole (a single straight line of light), holding an unrolled map that branches backward like a tree, thunderclouds and a tall triple spire behind him. Painterly stylized 3D fantasy, stormy simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/sage-lindlar.png", "image_exists": true}, {"id": "old_magnus", "name": "Old Magnus of the Marsh", "role": "sage", "dungeon": "world-10", "description": "A swamp hermit wearing a magnesium ring that can turn any halogen-marked carbon from target into attacker. Teaches naming alkyl halides, radical halogenation, allylic bromination and resonance, alcohols to halides, Grignard and Gilman reagents, coupling, and organic oxidation levels.", "book_section_ids": ["10.2", "10.3", "10.4", "10.6", "10.7", "10.8"], "image_prompt": "Game character portrait of Old Magnus, a gnarled swamp hermit with a long green-gray beard in a mossy cloak, a bright silvery-white ring on his hand glowing intensely, a lantern of greenish chlorine light, misty marsh with green and brown fog behind. Painterly stylized 3D fantasy, swampy simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/old-magnus.png", "image_exists": true}, {"id": "sage_walden", "name": "Sage Walden", "role": "sage", "dungeon": "world-11", "description": "The old arena-master who discovered that a backside strike turns a molecule inside out like an umbrella in the wind. Teaches SN2, SN1, leaving groups, solvents, Zaitsev's rule, E2, E1 and E1cB, and how to tell which will happen.", "book_section_ids": ["11.1", "11.2", "11.4", "11.7", "11.8", "11.12"], "image_prompt": "Game character portrait of Sage Walden, a lean old gladiator-master in battered bronze armor and a dark red cloak, holding a large umbrella blown inside out by the wind as if it were a shield, volcanic arena with five banners behind. Painterly stylized 3D fantasy, ember-red simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/sage-walden.png", "image_exists": true}, {"id": "astronomer_spectra", "name": "Astronomer Spectra", "role": "sage", "dungeon": "world-12", "description": "Keeper of the Observatory of Light, who reads molecules by how they break apart and how their bonds ring. Teaches mass spectrometry and infrared spectroscopy, and gives Kai the tools to see Malradix's true structure.", "book_section_ids": ["12.1", "12.2", "12.3", "12.7", "12.8"], "image_prompt": "Game character portrait of Astronomer Spectra, a graceful star-gazer in deep indigo robes embroidered with spectral lines, holding a glowing prism that splits light into a rainbow band and a brass spyglass, an observatory dome open to the stars behind. Painterly stylized 3D fantasy, starry simple background. No text, letters, interface or watermark.", "image_path": "assets/characters/astronomer-spectra.png", "image_exists": true}], "bestiary": [{"id": "radical_wolf", "name": "Radical Wolf", "chemistry": "free radical (odd electron)", "region": "overworld fields at night; Halogen Marsh", "mechanic": "Each wolf has one unpaired electron. When it bites a molecule it abstracts an atom and leaves a new radical behind, so packs grow by chain reaction. Hitting a wolf with force only makes more. Lure two wolves together and their electrons pair: termination, and both vanish.", "book_section_ids": ["6.6", "10.2", "8.10"], "image_prompt": "Game enemy concept art of a Radical Wolf, a lean shadowy wolf made of dark violet smoke with a single burning violet spark in its chest and crackling sparks splitting off its fur, menacing crouch. Painterly stylized 3D fantasy creature, deep navy simple background, readable silhouette. No text, letters, interface or watermark.", "image_path": "assets/enemies/radical-wolf.png", "image_exists": true}, {"id": "carbocation_wisp", "name": "Carbocation Wisp", "chemistry": "carbocation (empty p orbital)", "region": "Tower of Addition; Arena of Five", "mechanic": "A flat, flickering ghost with an empty orbital. Primary wisps are weak and short-lived; tertiary ones are strong and stable. A wisp next to a more stable spot teleports there with a hydride or methyl shift. Defeat it by firing a nucleophile into its empty orbital before it shifts.", "book_section_ids": ["7.9", "7.10", "7.11", "11.4"], "image_prompt": "Game enemy concept art of a Carbocation Wisp, a flat triangular ghost of pale blue light with three wispy arms and a hollow glowing empty ring passing through its center top and bottom, flickering unstable outline. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/carbocation-wisp.png", "image_exists": true}, {"id": "bromonium_wraith", "name": "Bromonium Wraith", "chemistry": "bromonium ion (cyclic halonium)", "region": "Reagent Orchards", "mechanic": "A wraith that wraps one side of a corridor like a bridge, shielding that face completely. Attacks from the shielded side bounce off; only a strike from the opposite face (anti) breaks it open, leaving its two halves on opposite sides.", "book_section_ids": ["8.2", "8.3"], "image_prompt": "Game enemy concept art of a Bromonium Wraith, a hunched reddish-brown wraith whose body forms an arch bridging two pillars, a glowing three-membered ring at its heart, a ghostly shield covering its front side. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/bromonium-wraith.png", "image_exists": true}, {"id": "grignard_golem", "name": "Grignard Golem", "chemistry": "Grignard reagent (RMgX)", "region": "Halogen Marsh", "mechanic": "A heavy golem whose carbon is electron-rich and strongly basic. It smashes anything acidic. Splash it with water and it is instantly protonated and crumbles to a harmless alkane — but Kai can also forge his own golem to attack electrophiles.", "book_section_ids": ["10.6"], "image_prompt": "Game enemy concept art of a Grignard Golem, a massive stone-and-metal golem with silvery-white magnesium plates, a red glowing carbon heart, green and brown halogen crystals on its shoulders, steaming hostile stance. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/grignard-golem.png", "image_exists": true}, {"id": "lone_pair_imp", "name": "Lone-Pair Imp", "chemistry": "nucleophile / Lewis base", "region": "Tide Coast; everywhere after", "mechanic": "Small red imps that carry an electron pair and leap at anything electron-poor (blue). Harmless alone, they become dangerous near electrophilic traps. Kai's Hookshot can redirect their pairs into empty orbitals.", "book_section_ids": ["2.11", "6.3"], "image_prompt": "Game enemy concept art of a Lone-Pair Imp, a small mischievous red imp clutching two glowing dots of light like a pair of marbles, big ears, leaping pose. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/lone-pair-imp.png", "image_exists": true}, {"id": "hydronium_crab", "name": "Hydronium Crab", "chemistry": "strong acid (H3O+)", "region": "Tide Coast", "mechanic": "Blue crabs that fling protons. A proton only moves downhill on the pKa ladder: lure a crab next to a weaker acid's conjugate base and its proton is stolen; next to a stronger acid it is safe.", "book_section_ids": ["2.7", "2.8", "2.9"], "image_prompt": "Game enemy concept art of a Hydronium Crab, a glossy blue crab with three glowing white orbs on its shell and one bright proton held up in a claw ready to fling, coastal rocks. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/hydronium-crab.png", "image_exists": true}, {"id": "eclipsed_bat", "name": "Eclipsed Bat", "chemistry": "torsional strain", "region": "Chain Labyrinth", "mechanic": "Bats that hang in pairs face-to-face along a bond. Eclipsed pairs are strained and frantic; rotating the corridor with the Newman Lantern to staggered calms them, and anti is safest of all.", "book_section_ids": ["3.6", "3.7"], "image_prompt": "Game enemy concept art of Eclipsed Bats, two bat-like creatures hanging nose to nose from a single rod, wings overlapping, tense jittery sparks between them. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/eclipsed-bat.png", "image_exists": true}, {"id": "axial_ogre", "name": "Axial Ogre", "chemistry": "1,3-diaxial interactions", "region": "Chair Fortress", "mechanic": "Bulky ogres forced into axial seats bump the creatures three seats away and take strain damage. Flip the ring to move them equatorial and they calm down; the biggest (the tert-Butyl Ogre) practically refuses to sit axial.", "book_section_ids": ["4.6", "4.7", "4.8"], "image_prompt": "Game enemy concept art of an Axial Ogre, a huge grumpy ogre squeezed upright into a narrow vertical stone seat, elbows jammed against two smaller creatures, strained expression. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/axial-ogre.png", "image_exists": true}, {"id": "enantiomer_shade", "name": "Enantiomer Shade", "chemistry": "enantiomer", "region": "Mirror Palace", "mechanic": "Each shade is a perfect mirror image of Kai. It cannot be superimposed on him and copies his moves in reverse. Only a chiral key — a door or weapon of one handedness — tells the two apart.", "book_section_ids": ["5.1", "5.2", "5.12"], "image_prompt": "Game enemy concept art of an Enantiomer Shade, a translucent silver mirror-image knight matching a hero's silhouette but reversed, its four glowing sockets in a mirrored pattern, standing in a mirror frame. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/enantiomer-shade.png", "image_exists": true}, {"id": "transition_wyrm", "name": "Transition Wyrm", "chemistry": "transition state", "region": "Activation Peaks", "mechanic": "A dragon that exists only on mountain summits: it is the highest-energy point of each pass and can't be caught, only crossed. The higher its pass, the slower anything gets over it.", "book_section_ids": ["6.9", "6.10"], "image_prompt": "Game enemy concept art of a Transition Wyrm, a translucent serpentine dragon coiled around a sharp mountain summit, half-formed and half-broken bonds glowing as dotted lines along its body. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/transition-wyrm.png", "image_exists": true}, {"id": "polymer_centipede", "name": "Polymer Centipede", "chemistry": "chain-growth polymer", "region": "Reagent Orchards", "mechanic": "Grows one monomer segment at a time from a radical head, always adding so the new radical lands on the more substituted carbon. It only stops growing when two radical heads meet and combine.", "book_section_ids": ["8.10"], "image_prompt": "Game enemy concept art of a Polymer Centipede, an enormous centipede made of hundreds of identical repeating segments, a glowing violet radical spark on its head, segments still forming at the front. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/polymer-centipede.png", "image_exists": true}, {"id": "acetylide_viper", "name": "Acetylide Viper", "chemistry": "acetylide anion", "region": "Triple Spire", "mechanic": "Straight-bodied linear serpents (sp, 180°). A strong enough base (pKa above 25 on the ladder) strips the viper's terminal hydrogen and turns it into a nucleophile that strikes primary alkyl halides — but bounces off secondary and tertiary ones and causes elimination instead.", "book_section_ids": ["9.7", "9.8"], "image_prompt": "Game enemy concept art of an Acetylide Viper, a fierce armored serpent with a clearly visible cobra-like head, fangs and glowing eyes, its body held unnaturally rigid and perfectly straight like a spear, three parallel glowing cyan bands wrapped along its whole length, a crackling glowing orb of negative charge at its open mouth, lunging forward in a straight line over stormy cliff rocks. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/acetylide-viper.png", "image_exists": true}, {"id": "tosylate_ghoul", "name": "Tosylate Ghoul", "chemistry": "leaving group", "region": "Arena of Five", "mechanic": "Ghouls clinging to carbons. Good leaving groups (weak bases: tosylate, iodide, bromide) drop off at the slightest push; poor ones (hydroxide, amide) cling forever until converted.", "book_section_ids": ["11.3", "11.5"], "image_prompt": "Game enemy concept art of a Tosylate Ghoul, a gaunt pale ghoul clinging to a stone pillar with one hand, ready to let go, an aromatic ring emblem on its chest, a sulfur-yellow glow. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/tosylate-ghoul.png", "image_exists": true}, {"id": "fragment_phantom", "name": "Fragment Phantom", "chemistry": "mass spectrum fragments", "region": "Observatory of Light", "mechanic": "Phantoms that shatter into charged fragments when struck by the Mass Prism. Reading which pieces broke off (loss of 15, 29, 18...) reveals what they really were.", "book_section_ids": ["12.1", "12.2", "12.3"], "image_prompt": "Game enemy concept art of a Fragment Phantom, a ghostly figure breaking apart into glowing shards of different sizes flying outward in a curved arc, as if through a magnetic field. Painterly stylized 3D fantasy creature, deep navy simple background. No text, letters, interface or watermark.", "image_path": "assets/enemies/fragment-phantom.png", "image_exists": true}], "assets": [{"id": "hybrid_crystal", "name": "Hybrid Crystal", "kind": "dungeon item", "from": "world-1", "description": "Lets Kai switch hybridization: sp³ (tetrahedral, four bonds, strong stance), sp² (flat, can slip through slots and form π bonds) and sp (linear dash). Shape determines which gaps he fits and which bonds he can make.", "book_section_ids": ["1.6", "1.8", "1.9"], "image_prompt": "Isolated game item icon of a faceted crystal that is tetrahedral on one end, flat triangular in the middle and a straight spike at the other, glowing cyan, held in a graphite setting. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/hybrid-crystal.png", "image_exists": true}, {"id": "curved_arrow_hookshot", "name": "Curved-Arrow Hookshot", "kind": "dungeon item", "from": "world-2", "description": "Fires a curved arrow from an electron source (lone pair or π bond) to an electron sink (empty orbital or δ+ atom), moving the pair and pulling Kai along. Refuses arrows that start at nothing or overfill an octet.", "book_section_ids": ["2.6", "2.11", "6.5"], "image_prompt": "Isolated game item icon of a brass hookshot launcher that fires a glowing curved arrow of light with a full double-barbed head, two small orbs of light riding along the arrow. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/curved-arrow-hookshot.png", "image_exists": true}, {"id": "newman_lantern", "name": "Newman Lantern", "kind": "dungeon item", "from": "world-3", "description": "Shows any bond end-on as a Newman projection and lets Kai rotate it. Staggered positions open passages; eclipsed ones jam them; strain is shown as a live energy dial.", "book_section_ids": ["3.6", "3.7"], "image_prompt": "Isolated game item icon of a round brass lantern whose glass shows a circle with three spokes in front and three spokes behind offset like a Newman projection, warm light, a rotating dial on its base. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/newman-lantern.png", "image_exists": true}, {"id": "ringflip_gauntlet", "name": "Ring-Flip Gauntlet", "kind": "dungeon item", "from": "world-4", "description": "Flips any chair ring: every axial seat becomes equatorial and vice versa. Used to seat bulky groups equatorially and to line up trans-diaxial pairs for eliminations later.", "book_section_ids": ["4.5", "4.6", "4.7", "11.9"], "image_prompt": "Isolated game item icon of an armored gauntlet with a hexagonal zigzag chair-shaped ring set into the knuckles, arrows of light showing it flipping, violet-gray steel. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/ringflip-gauntlet.png", "image_exists": true}, {"id": "mirror_shield", "name": "Mirror Shield", "kind": "dungeon item", "from": "world-5", "description": "Shows Kai's mirror image and the R/S steering wheel of any chirality center: rank the four groups, push the lowest back, and read the turn. Chiral doors open only for the right configuration.", "book_section_ids": ["5.2", "5.5"], "image_prompt": "Isolated game item icon of a polished silver round shield with a mirror surface, its rim engraved like a steering wheel with four colored gems of different sizes, one gem dark at the back. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/mirror-shield.png", "image_exists": true}, {"id": "activation_boots", "name": "Activation Boots", "kind": "dungeon item", "from": "world-6", "description": "Let Kai store energy and spend it to climb over transition-state passes. Each pass shows its ΔG‡ height and each valley its ΔG°; the boots also reveal the energy diagram of any reaction Kai triggers.", "book_section_ids": ["6.7", "6.9", "6.10"], "image_prompt": "Isolated game item icon of sturdy orange mountain boots with glowing spring coils in the soles and a stitched line along the side shaped like an energy diagram with a peak and a valley. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/activation-boots.png", "image_exists": true}, {"id": "proton_sling", "name": "Proton Sling", "kind": "dungeon item", "from": "world-7", "description": "Throws a proton at a double bond. It lands where it makes the more stable carbocation (Markovnikov), and a nucleophile follows. Wrong-side throws fizzle with the less stable cation shown.", "book_section_ids": ["7.7", "7.8", "7.9"], "image_prompt": "Isolated game item icon of a farmer's leather sling holding a single bright glowing white orb, golden wheat stalk wrapped around the handle. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/proton-sling.png", "image_exists": true}, {"id": "reagent_satchel", "name": "Reagent Satchel", "kind": "dungeon item", "from": "world-8", "description": "A satchel of alkene reagents, each a different tool: Br2 (anti dihalide), NBS/water (halohydrin), Hg(OAc)2 then NaBH4 (Markovnikov alcohol), BH3 then H2O2 (non-Markovnikov syn alcohol), H2/Pd (syn alkane), peroxyacid (epoxide), OsO4 (syn diol), O3 then Zn (cleavage), CH2I2/Zn(Cu) (cyclopropane).", "book_section_ids": ["8.2", "8.3", "8.4", "8.5", "8.6", "8.7", "8.8", "8.9"], "image_prompt": "Isolated game item icon of a worn leather alchemist's satchel overflowing with small labeled-looking vials (no readable text) of reddish-brown, clear, violet and pale blue liquids, a brass claw tool and tiny shears clipped to the strap. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/reagent-satchel.png", "image_exists": true}, {"id": "retro_map", "name": "Retrosynthesis Map", "kind": "dungeon item", "from": "world-9", "description": "A map that is read backward: mark a target and it shows the immediate precursors the player knows how to make it from, one step at a time, back to the starting materials in the shop.", "book_section_ids": ["9.9"], "image_prompt": "Isolated game item icon of an old parchment map whose paths branch backward like the roots of a tree from a single glowing gem at the top down to several small glowing gems at the bottom, edges curled, a compass rose. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/retro-map.png", "image_exists": true}, {"id": "magnesium_ring", "name": "Magnesium Ring", "kind": "dungeon item", "from": "world-10", "description": "Inserts magnesium into a carbon–halogen bond, flipping that carbon from electron-poor target to electron-rich attacker (a Grignard). Must be kept away from water.", "book_section_ids": ["10.6", "10.7"], "image_prompt": "Isolated game item icon of a bright silvery-white metal ring glowing intensely white, with a green crystal set on one side and a red glowing ember on the other. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/magnesium-ring.png", "image_exists": true}, {"id": "inversion_umbrella", "name": "Umbrella of Inversion", "kind": "dungeon item", "from": "world-11", "description": "A backside strike: Kai attacks from 180° opposite a leaving group and the target turns inside out (SN2 inversion). Blocked by bulky substrates; the umbrella shows whether SN1, SN2, E1, E2 or E1cB will happen under the current conditions.", "book_section_ids": ["11.2", "11.3", "11.12"], "image_prompt": "Isolated game item icon of a dark red battle umbrella blown inside out, its ribs glowing bronze, a sharp point at the tip, gusts of wind lines around it. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/inversion-umbrella.png", "image_exists": true}, {"id": "spectra_lens", "name": "Mass Prism and IR Lens", "kind": "dungeon item", "from": "world-12", "description": "Two seeing tools: the Mass Prism weighs a target and shatters it into fragments to read its formula; the IR Lens makes its bonds ring so the player sees which functional groups are present. Together they reveal true structures and disguises.", "book_section_ids": ["12.2", "12.3", "12.7", "12.8"], "image_prompt": "Isolated game item icon of a glowing triangular crystal prism splitting light into a rainbow band, paired with a brass monocle lens with a ruby glass, faint wave lines in the lens. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/spectra-lens.png", "image_exists": true}, {"id": "bond_shard", "name": "Bond Shard", "kind": "quest item", "description": "One of the twelve pieces of the Crown of Tetravalence, held by each dungeon boss.", "book_section_ids": ["1.4"], "image_prompt": "Isolated game item icon of a glowing shard of golden crystal shaped like a single bond line with a soft cyan glow at each end, floating. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/bond-shard.png", "image_exists": true}, {"id": "crown_of_tetravalence", "name": "Crown of Tetravalence", "kind": "quest item", "description": "The crown that keeps the Law of the Octet: four arms of light at 109.5° around a carbon heart.", "book_section_ids": ["1.4", "1.6"], "image_prompt": "Isolated game item icon of a radiant golden crown built as a tetrahedron, four arms of light pointing to the corners of a tetrahedron from a glowing black carbon gem at its center, cracked in places. Stylized painterly 3D, readable silhouette, dark navy background. No text, letters, interface or watermark.", "image_path": "assets/items/crown-of-tetravalence.png", "image_exists": true}], "locations": [{"id": "overworld", "name": "The Kingdom of Valence", "kind": "overworld", "description": "The open-world map: Carbon Castle at the center, twelve regions around it, Malradix's Keep beyond the volcano. Streamed in chunks; dungeons are separate scenes entered through their doors.", "image_prompt": "Full-bleed aerial fantasy world map view of a large kingdom: a central castle with tetrahedral spires, a starting village, dark caverns, a teal coast, deep forest, ringed hills with a zigzag fortress, a crystal lake with a mirror palace, snowy twin peaks, golden plains with a tower, orchards with a glass tower, storm cliffs with a triple spire, a green misty marsh, a volcanic arena, a mountaintop observatory, and a dark keep beyond the volcano.", "image_path": "assets/locations/overworld.png", "image_exists": true}, {"id": "hydrogen_village", "name": "Hydrogen Village", "kind": "town", "description": "Kai's quiet starting village of small one-bond cottages, where the first bonds break.", "image_prompt": "Full-bleed scene of a small peaceful fantasy village of round white cottages each with a single tall chimney, gentle hills, morning light, a dark cave entrance glowing faintly in a hillside nearby, a few strange violet sparks in the sky.", "image_path": "assets/locations/hydrogen-village.png", "image_exists": true}, {"id": "carbon_castle", "name": "Carbon Castle and Market Town", "kind": "hub", "description": "The hub town with shops (starting materials and reagents), the sages' guild, and the empty throne of the Crown of Tetravalence.", "image_prompt": "Full-bleed scene of a grand dark-stone fantasy castle with four tall spires arranged as a tetrahedron around a glowing central keep, a lively market town around it with stalls of colored flasks, banners, warm evening light, a faint crack of violet in the sky above.", "image_path": "assets/locations/carbon-castle.png", "image_exists": true}, {"id": "malradix_keep", "name": "Malradix's Keep", "kind": "finale", "description": "The sorcerer's fortress beyond the volcano, built from broken bonds. The final ascent uses every item.", "image_prompt": "Full-bleed scene of a jagged black fortress on a volcanic plain, its towers made of broken shattered beams of light, a single violet star burning at its peak, swarms of violet sparks around it, red lava rivers.", "image_path": "assets/locations/malradix-keep.png", "image_exists": true}], "worlds": [{"id": "world-1", "number": 1, "chapter_id": "1", "title": "The Orbital Caverns", "chapter_title": "Structure and Bonding", "book_pages": "pp. 7–36", "region": "Under Hydrogen Village", "sage": "sage_aufbau", "item": "hybrid_crystal", "theme": "Glowing caves whose chambers are shells: a small spherical 1s grotto, dumbbell-shaped p tunnels on three axes, and deeper halls. Lamps must be filled from the bottom up.", "malradix_claim": {"claim": "Carbon could bond any way it likes — four bonds, two kinds, any angle.", "refuted_by": "Hybridization: four equivalent sp³ bonds at 109.5° (1.6)."}, "chambers": [{"id": "1-1", "title": "The Nucleus Grotto", "section_ids": ["1.1"], "puzzle": "Build atoms from protons, neutrons and electrons; heavier isotopes open the same door because the element (Z) is unchanged."}, {"id": "1-2", "title": "Hall of Shells", "section_ids": ["1.2", "1.3"], "puzzle": "Fill electron lamps by Aufbau, Pauli and Hund; wrong fillings short-circuit the lights."}, {"id": "1-3", "title": "The Socket Bridge", "section_ids": ["1.4", "1.5"], "puzzle": "Each atom has as many sockets as it needs for an octet (H 1, C 4, N 3, O 2); bridges only hold when every atom is full. Bond length is the bottom of the energy well."}, {"id": "1-4", "title": "Forge of Hybrids", "section_ids": ["1.6", "1.7", "1.8", "1.9", "1.10"], "puzzle": "Mix s and p into sp³, sp² or sp to fit tetrahedral, flat or linear passages; π bonds need parallel p orbitals."}, {"id": "1-5", "title": "The Skeleton Gallery", "section_ids": ["1.11", "1.12"], "puzzle": "Read skeletal drawings by counting hidden hydrogens at each vertex; bonding vs antibonding orbitals open in-phase doors."}], "boss": {"id": "boss-1", "name": "The Unbonded Colossus", "fight": "A giant of loose atoms with empty sockets. Kai must fill each part's valence with the right hybrid shape: when every atom has a full octet at the right angles, the colossus locks into a stable molecule and the Bond Shard drops.", "section_ids": ["1.4", "1.6", "1.8", "1.9"]}, "art": {"image_path": "assets/locations/world-1-orbital-caverns.png", "prompt": "Full-bleed scene of a vast glowing cavern of crystal grottoes: a spherical chamber, three dumbbell-shaped glowing tunnels crossing at right angles, stacked rows of lamps on the walls, cyan and pale blue light, a small armored knight walking in.", "image_exists": true}}, {"id": "world-2", "number": 2, "chapter_id": "2", "title": "The Tide Temple", "chapter_title": "Polar Covalent Bonds; Acids and Bases", "book_pages": "pp. 37–70", "region": "The Tide Coast", "sage": "ferrymen", "item": "curved_arrow_hookshot", "theme": "A sea temple where water is pulled toward red (electron-rich) stones and away from blue ones; tides follow the pKa ladder.", "malradix_claim": {"claim": "A molecule's electrons sit still, exactly where you draw them.", "refuted_by": "Polarity and resonance: real structures are hybrids, electrons spread over atoms (2.1, 2.4–2.6)."}, "chambers": [{"id": "2-1", "title": "Tug-of-War Hall", "section_ids": ["2.1", "2.2"], "puzzle": "Electronegativity tugs shared pairs; add bond dipoles as vectors to find which statues have a net dipole and turn in the field."}, {"id": "2-2", "title": "Hall of Accounts", "section_ids": ["2.3"], "puzzle": "Count owned electrons to assign formal charges; glowing + and − runes must match before doors open."}, {"id": "2-3", "title": "Resonance Tidepools", "section_ids": ["2.4", "2.5", "2.6"], "puzzle": "Push π and lone-pair electrons along three-atom groupings with curved arrows; atoms never move. The real pool is the hybrid."}, {"id": "2-4", "title": "The pKa Ladder", "section_ids": ["2.7", "2.8", "2.9", "2.10"], "puzzle": "Protons only flow from stronger acid to stronger base; chain proton transfers downhill to reach the top floor."}, {"id": "2-5", "title": "Lewis Docks", "section_ids": ["2.11", "2.12"], "puzzle": "Hook lone pairs into empty orbitals (BF3, Mg2+); hydrogen-bond bridges hold only between O–H/N–H and lone pairs."}], "boss": {"id": "boss-2", "name": "The Resonance Hydra", "fight": "A hydra whose heads are resonance forms of one creature. Striking a single head does nothing because no single form is real; Kai must use the Hookshot to delocalize the charge across all heads until the true hybrid appears, then strike it.", "section_ids": ["2.4", "2.5", "2.6"]}, "art": {"image_path": "assets/locations/world-2-tide-temple.png", "prompt": "Full-bleed scene of a half-submerged sea temple on a teal coast, pillars of red and blue stone, water visibly flowing toward the red stones, a tall stepped ladder-like tower rising from the waves, two ferrymen's boats passing a glowing orb.", "image_exists": true}}, {"id": "world-3", "number": 3, "chapter_id": "3", "title": "The Chain Labyrinth", "chapter_title": "Organic Compounds: Alkanes and Their Stereochemistry", "book_pages": "pp. 71–104", "region": "The Chain Forest", "sage": "sage_iupaca", "item": "newman_lantern", "theme": "A forest labyrinth of zigzag branching root-corridors; the true path is always the longest continuous chain.", "malradix_claim": {"claim": "Every molecule is its own strange beast; there are too many to ever know.", "refuted_by": "Functional groups make families with predictable behavior; IUPAC names every compound (3.1, 3.4)."}, "chambers": [{"id": "3-1", "title": "Hall of Families", "section_ids": ["3.1"], "puzzle": "Sort creatures by functional group; same group, same behavior, whatever their size."}, {"id": "3-2", "title": "Isomer Garden", "section_ids": ["3.2", "3.3"], "puzzle": "Build every distinct isomer of a formula; redrawn duplicates don't count. Classify carbons 1°–4°."}, {"id": "3-3", "title": "The Naming Maze", "section_ids": ["3.4", "3.5"], "puzzle": "Trace the longest chain (turning corners), number from the nearest branch, alphabetize substituents to speak the door's true name."}, {"id": "3-4", "title": "The Turning Halls", "section_ids": ["3.6", "3.7"], "puzzle": "Rotate corridors with the Newman Lantern; eclipsed costs strain points, staggered is safe, anti is safest."}], "boss": {"id": "boss-3", "name": "The Gauche Serpent", "fight": "A long butane-like serpent that coils in strained gauche and eclipsed positions to attack. Kai uses the Lantern to rotate its body; each eclipsed CH3↔CH3 contact costs it energy until it is forced into the anti zigzag and stills.", "section_ids": ["3.6", "3.7"]}, "art": {"image_path": "assets/locations/world-3-chain-labyrinth.png", "prompt": "Full-bleed scene of a deep ancient forest whose giant roots form zigzag branching corridors like carbon chains, a library tower among the trees, warm lantern light, green mist.", "image_exists": true}}, {"id": "world-4", "number": 4, "chapter_id": "4", "title": "The Chair Fortress", "chapter_title": "Organic Compounds: Cycloalkanes and Their Stereochemistry", "book_pages": "pp. 105–134", "region": "The Chair Hills", "sage": "sage_sachse", "item": "ringflip_gauntlet", "theme": "A fortress of rings: a cramped triangular tower, a square keep, a puckered pentagon, and the strain-free six-sided chair palace.", "malradix_claim": {"claim": "Rings are flat, so small rings and big rings must all be strained.", "refuted_by": "Rings pucker; cyclohexane's chair is strain-free (4.3–4.5)."}, "chambers": [{"id": "4-1", "title": "Gate of Two Faces", "section_ids": ["4.1", "4.2"], "puzzle": "Name ring compounds; place banners cis (same face) or trans (opposite faces) to match the gate."}, {"id": "4-2", "title": "The Strain Towers", "section_ids": ["4.3", "4.4"], "puzzle": "Empty the angle, torsional and steric strain meters by choosing ring size and puckering."}, {"id": "4-3", "title": "The Chair Throne Room", "section_ids": ["4.5", "4.6"], "puzzle": "Seat guards axial or equatorial; flip the ring and every seat swaps."}, {"id": "4-4", "title": "The Crowded Banquet", "section_ids": ["4.7", "4.8"], "puzzle": "Seat substituents to minimize 1,3-diaxial bumps using the strain table; trans-1,2 prefers both equatorial."}, {"id": "4-5", "title": "The Fused Keep", "section_ids": ["4.9"], "puzzle": "Fuse ring tiles cis or trans (decalin, steroids); trans-fused pieces can no longer flip."}], "boss": {"id": "boss-4", "name": "The tert-Butyl Titan", "fight": "A giant who stomps on any axial seat. Kai uses the Ring-Flip Gauntlet to force the titan into an axial seat where 1,3-diaxial strain staggers it, while keeping his own allies equatorial.", "section_ids": ["4.6", "4.7", "4.8"]}, "art": {"image_path": "assets/locations/world-4-chair-fortress.png", "prompt": "Full-bleed scene of rolling hills crowned with a fortress shaped like a giant cyclohexane chair, zigzag walls rising and falling, smaller triangular and square towers nearby, violet-gray stone, dramatic clouds.", "image_exists": true}}, {"id": "world-5", "number": 5, "chapter_id": "5", "title": "The Mirror Palace", "chapter_title": "Stereochemistry at Tetrahedral Centers", "book_pages": "pp. 135–170", "region": "The Mirror Lake", "sage": "sister_tartara", "item": "mirror_shield", "theme": "A crystal palace that reflects perfectly in its lake; the reflection is a second, mirror-image palace that can be entered.", "malradix_claim": {"claim": "A thing and its reflection are the same thing.", "refuted_by": "Enantiomers are non-superimposable mirror images, and chiral receptors tell them apart (5.1, 5.2, 5.12)."}, "chambers": [{"id": "5-1", "title": "Hall of Hands", "section_ids": ["5.1", "5.2"], "puzzle": "Try to overlay statues on their reflections; with four different groups they never match. Slice with mirror planes to find achiral ones."}, {"id": "5-2", "title": "The Polarized Window", "section_ids": ["5.3", "5.4"], "puzzle": "Turn the analyzer to measure rotation; longer tubes and stronger solutions rotate more. Sort Pasteur's crystals."}, {"id": "5-3", "title": "The Steering-Wheel Locks", "section_ids": ["5.5"], "puzzle": "Rank the four groups by CIP rules, push the lowest to the back, and turn: clockwise R, counterclockwise S."}, {"id": "5-4", "title": "Halls of Many Centers", "section_ids": ["5.6", "5.7", "5.9"], "puzzle": "Flip R/S switches: all flipped is the enantiomer, some flipped a diastereomer; mirror-linked switches reveal a meso door."}, {"id": "5-5", "title": "The Resolution Hall", "section_ids": ["5.8", "5.10", "5.11", "5.12"], "puzzle": "Separate a mixed crowd with a chiral glove; attack flat carbonyls from the Re or Si face; an enzyme-shaped lock accepts only one enantiomer."}], "boss": {"id": "boss-5", "name": "The Racemic King", "fight": "A king made of two mirror-image halves who cancels every attack with its reflection. Kai pairs each half with a single-handed chiral glove so the halves become diastereomers with different properties, separates them, and strikes each.", "section_ids": ["5.8", "5.12"]}, "art": {"image_path": "assets/locations/world-5-mirror-palace.png", "prompt": "Full-bleed scene of an elegant silver crystal palace on a perfectly still lake reflecting it exactly as a mirror image, twin spiral towers one twisting left and one twisting right, moonlight, pale blue and silver.", "image_exists": true}}, {"id": "world-6", "number": 6, "chapter_id": "6", "title": "The Activation Peaks", "chapter_title": "An Overview of Organic Reactions", "book_pages": "pp. 171–206", "region": "The Activation Peaks", "sage": "warden_hammond", "item": "activation_boots", "theme": "A mountain range whose profile is an energy diagram: passes are transition states, valleys are intermediates.", "malradix_claim": {"claim": "If a reaction gives off energy, it must happen instantly.", "refuted_by": "Rates depend on ΔG‡, not ΔG° (6.7, 6.9)."}, "chambers": [{"id": "6-1", "title": "The Four Trails", "section_ids": ["6.1", "6.2"], "puzzle": "Classify reactions as addition, elimination, substitution or rearrangement; cut bonds heterolytically or homolytically."}, {"id": "6-2", "title": "Electron Radar Gorge", "section_ids": ["6.3", "6.4", "6.5"], "puzzle": "Find red nucleophiles and blue electrophiles; draw arrows that conserve charge and obey the octet."}, {"id": "6-3", "title": "The Chain Cave", "section_ids": ["6.6"], "puzzle": "Follow a radical chain reaction through initiation, propagation and termination."}, {"id": "6-4", "title": "The Ledger of Bonds", "section_ids": ["6.7", "6.8"], "puzzle": "Balance bonds broken against bonds formed; downhill valleys are favorable, but that says nothing about speed."}, {"id": "6-5", "title": "The Twin Passes", "section_ids": ["6.9", "6.10", "6.11"], "puzzle": "Cross a two-step reaction; the tallest pass sets the rate; enzymes split one big climb into small steps."}], "boss": {"id": "boss-6", "name": "The Transition Wyrm", "fight": "The wyrm coils on the highest summit of a two-step path. Kai can't hit it; he must read the energy diagram, choose the step with the lower barrier, and pass over its summit with the Activation Boots before it closes the pass.", "section_ids": ["6.9", "6.10"]}, "art": {"image_path": "assets/locations/world-6-activation-peaks.png", "prompt": "Full-bleed scene of a snowy mountain range whose skyline forms two sharp peaks with a deep valley between them and lower ground on the far side, a winding trail climbing over the passes, a translucent dragon coiled on the highest summit.", "image_exists": true}}, {"id": "world-7", "number": 7, "chapter_id": "7", "title": "The Tower of Addition", "chapter_title": "Alkenes: Structure and Reactivity", "book_pages": "pp. 207–242", "region": "The Plains of Addition", "sage": "farmer_markov", "item": "proton_sling", "theme": "Golden wheat plains with a tall tower whose floors are double bonds waiting for additions.", "malradix_claim": {"claim": "HX adds to a double bond any which way.", "refuted_by": "Markovnikov's rule: the more stable carbocation forms (7.8–7.10)."}, "chambers": [{"id": "7-1", "title": "Counting Fields" s the same alcohol.", "refuted_by": "Oxymercuration gives Markovnikov alcohols; hydroboration gives non-Markovnikov syn alcohols (8.4, 8.5)."}, "chambers": [{"id": "8-1", "title": "Grove of Halogens", "section_ids": ["8.1", "8.2", "8.3"], "puzzle": "Break bromonium wraiths from the back (anti); flood with water to make halohydrins."}, {"id": "8-2", "title": "The Two Waters", "section_ids": ["8.4", "8.5"], "puzzle": "Choose oxymercuration or hydroboration to put OH on the carbon the door asks for."}, {"id": "8-3", "title": "Garden of Faces", "section_ids": ["8.6", "8.7"], "puzzle": "Hydrogenate, epoxidize, or clamp with OsO4 on the same face (syn); open epoxides from the back (anti)."}, {"id": "8-4", "title": "The Ozone Shears", "section_ids": ["8.8", "8.9"], "puzzle": "Snip double bonds into carbonyls and reassemble alkenes from fragments; clamp carbenes into cyclopropanes."}, {"id": "8-5", "title": "The Chain Barn", "section_ids": ["8.10", "8.11", "8.12", "8.13"], "puzzle": "Stop a growing polymer; predict racemic vs unequal products when a new chirality center forms."}], "boss": {"id": "boss-8", "name": "The Polymer Leviathan", "fight": "A centipede-leviathan that grows a segment every few seconds by radical addition. Kai must lure a second radical head into it for termination while choosing reagents to break exposed double bonds.", "section_ids": ["8.10"]}, "art": {"image_path": "assets/locations/world-8-reagent-orchards.png", "prompt": "Full-bleed scene of lush orchards whose trees bear glowing glass flasks of red-brown, clear, violet and pale blue liquids instead of fruit, a slender glass alchemist's tower at the center, warm amber light.", "image_exists": true}}, {"id": "world-9", "number": 9, "chapter_id": "9", "title": "The Triple Spire", "chapter_title": "Alkynes: An Introduction to Organic Synthesis", "book_pages": "pp. 287–316", "region": "The Thunder Cliffs", "sage": "sage_lindlar", "item": "retro_map", "theme": "Three straight towers bound by a triple bridge, climbed by planning the route backward from the summit.", "malradix_claim": {"claim": "To make something, just start somewhere and hope.", "refuted_by": "Retrosynthesis: work backward from the target one step at a time (9.9)."}, "chambers": [{"id": "9-1", "title": "The Linear Halls", "section_ids": ["9.1", "9.2", "9.3"], "puzzle": "Name alkynes; strip HX twice to raise a triple bridge; add HX or X2 once or twice."}, {"id": "9-2", "title": "The Shifting Wells", "section_ids": ["9.4"], "puzzle": "Water adds to give a shape-shifting enol that tautomerizes to a ketone or aldehyde depending on the route."}, {"id": "9-3", "title": "Three Reductions", "section_ids": ["9.5", "9.6"], "puzzle": "Choose Pd (alkane), Lindlar (cis) or Li/NH3 (trans) to shape the bridge the door wants."}, {"id": "9-4", "title": "The Acetylide Stair", "section_ids": ["9.7", "9.8"], "puzzle": "Pick a base strong enough on the pKa ladder, then alkylate only with primary halides to extend the stair."}, {"id": "9-5", "title": "The Planner's Summit", "section_ids": ["9.9"], "puzzle": "Use the Retrosynthesis Map to plan a three-to-four-step route to a target from acetylene."}], "boss": {"id": "boss-9", "name": "Malradix's Mimic", "fight": "A shapeshifter that becomes a target molecule and dares Kai to make it. Kai must plan the synthesis backward with the Map and then execute each step in order; every correct step strips a layer of the disguise.", "section_ids": ["9.8", "9.9"]}, "art": {"image_path": "assets/locations/world-9-triple-spire.png", "prompt": "Full-bleed scene of three perfectly straight slender stone spires on stormy sea cliffs, bound together by three glowing parallel bridges, lightning in dark clouds, a small figure climbing.", "image_exists": true}}, {"id": "world-10", "number": 10, "chapter_id": "10", "title": "The Halogen Marsh", "chapter_title": "Organohalides", "book_pages": "pp. 317–340", "region": "The Halogen Marsh", "sage": "old_magnus", "item": "magnesium_ring", "theme": "A misty marsh of green chlorine fog and brown bromine pools, haunted by radical packs.", "malradix_claim": {"claim": "My radicals strike at random.", "refuted_by": "Radicals pick the weakest C–H bonds: allylic > 3° > 2° > 1° (10.2, 10.3)."}, "chambers": [{"id": "10-1", "title": "The Naming Bog", "section_ids": ["10.1"], "puzzle": "Name haloalkanes; longer, weaker C–X bonds sink in the bog."}, {"id": "10-2", "title": "The Hunt", "section_ids": ["10.2"], "puzzle": "Predict which hydrogens radicals take and the product percentages from counts times reactivities."}, {"id": "10-3", "title": "The Allyl Crossing", "section_ids": ["10.3", "10.4"], "puzzle": "Bromine radicals hit allylic positions; the radical's electron hops between both ends, so bromine can land on either."}, {"id": "10-4", "title": "The Alcohol Spring", "section_ids": ["10.5"], "puzzle": "Turn alcohols into halides with the right tool: HX for tertiary, SOCl2 or PBr3 for primary/secondary."}, {"id": "10-5", "title": "The Metal Forge", "section_ids": ["10.6", "10.7", "10.8"], "puzzle": "Insert magnesium to flip a carbon's polarity; couple fragments with copper or palladium; climb the oxidation-level ladder."}], "boss": {"id": "boss-10", "name": "The Allylic Hydra", "fight": "A two-headed marsh beast whose radical heart hops between its two ends by resonance. Kai must hit both ends in turn while dodging the radical pack, then use the Magnesium Ring to turn its own halogenated body into a weapon.", "section_ids": ["10.3", "10.4", "10.6"]}, "art": {"image_path": "assets/locations/world-10-halogen-marsh.png", "prompt": "Full-bleed scene of a dark misty marsh with drifting pale green fog and reddish-brown pools, gnarled dead trees, a hermit's hut with a bright white glowing ring hung over the door, glowing violet eyes of wolves in the reeds.", "image_exists": true}}, {"id": "world-11", "number": 11, "chapter_id": "11", "title": "The Arena of Five", "chapter_title": "Reactions of Alkyl Halides: Nucleophilic Substitutions and Eliminations", "book_pages": "pp. 341–384", "region": "The Volcanic Wastes", "sage": "sage_walden", "item": "inversion_umbrella", "theme": "A volcanic coliseum with five gates, one for each mechanism, guarding the road to Malradix's Keep.", "malradix_claim": {"claim": "Substitution and elimination are random luck.", "refuted_by": "Substrate, nucleophile/base, leaving group and solvent decide SN1, SN2, E1, E2 or E1cB (11.12)."}, "chambers": [{"id": "11-1", "title": "The Walden Gate", "section_ids": ["11.1", "11.2"], "puzzle": "Strike from behind to invert configuration; follow a Walden cycle to find the inverting step."}, {"id": "11-2", "title": "Four Dials", "section_ids": ["11.3"], "puzzle": "Tune substrate bulk, nucleophile, leaving group and solvent to make SN2 fast."}, {"id": "11-3", "title": "The Cation Pit", "section_ids": ["11.4", "11.5", "11.6"], "puzzle": "Let the leaving group go first; polar protic solvent shelters the cation; the product comes out mostly racemic."}, {"id": "11-4", "title": "The Elimination Ring", "section_ids": ["11.7", "11.8", "11.9"], "puzzle": "Pick the Zaitsev alkene; line H and leaving group up anti-periplanar (trans-diaxial in rings) before the base pulls."}, {"id": "11-5", "title": "The Champion's Trial", "section_ids": ["11.10", "11.11", "11.12"], "puzzle": "Predict which of the five mechanisms each challenger will use from its conditions."}], "boss": {"id": "boss-11", "name": "The Five-Stanced Champion", "fight": "Malradix's champion fights in five stances (SN2, SN1, E2, E1, E1cB) and changes stance when the conditions change. Kai must read the arena's conditions each round and counter with the right move: backside strike, cation capture, anti-periplanar pull, or carbanion bait.", "section_ids": ["11.12"]}, "art": {"image_path": "assets/locations/world-11-arena-of-five.png", "prompt": "Full-bleed scene of a vast volcanic coliseum of dark basalt with five tall gates, each with a different colored banner, lava glowing between stones, a dark keep visible far beyond under a violet star.", "image_exists": true}}, {"id": "world-12", "number": 12, "chapter_id": "12", "title": "The Observatory of Light", "chapter_title": "Structure Determination: Mass Spectrometry and Infrared Spectroscopy", "book_pages": "pp. 385–418", "region": "The Summit of Light", "sage": "astronomer_spectra", "item": "spectra_lens", "theme": "A mountaintop observatory where light is split and molecules are weighed; the last shard reveals the path to the Keep.", "malradix_claim": {"claim": "No one can ever know what I truly am.", "refuted_by": "Mass spectrometry and IR together reveal molecular weight, formula and functional groups (12.2, 12.7)."}, "chambers": [{"id": "12-1", "title": "The Weighing Hall", "section_ids": ["12.1", "12.2"], "puzzle": "Send phantoms through the magnetic arc; read M+ and the base peak, and subtract fragments to rebuild them."}, {"id": "12-2", "title": "The Isotope Gallery", "section_ids": ["12.3", "12.4"], "puzzle": "Spot chlorine (3:1) and bromine (1:1) twins at M and M+2; odd M+ means odd nitrogens."}, {"id": "12-3", "title": "The Spectrum Dome", "section_ids": ["12.5", "12.6"], "puzzle": "Turn the light dial from radio to gamma; only matching energies are absorbed."}, {"id": "12-4", "title": "The Ringing Bonds", "section_ids": ["12.7", "12.8"], "puzzle": "Shine the IR Lens: broad O–H, sharp ≡C–H, and the C=O tower whose position tells aldehyde from ketone from ester."}], "boss": {"id": "boss-12", "name": "The Disguised Sorcerer", "fight": "Malradix appears in a false form. Kai must combine Mass Prism fragments and IR bands into a structure that fits all the evidence; naming his true structure breaks the disguise and opens the road to the Keep.", "section_ids": ["12.2", "12.3", "12.8"]}, "art": {"image_path": "assets/locations/world-12-observatory.png", "prompt": "Full-bleed scene of a white stone observatory on a high snowy peak above the clouds at night, its dome open to a sky full of stars, a beam of light split by a great prism into a rainbow band across the sky.", "image_exists": true}}], "finale": {"id": "finale", "title": "Malradix's Keep", "location_id": "malradix_keep", "summary": "Every item is needed in the ascent: hybrid shapes to fit the gates, curved arrows to move electrons, chairs to flip, mirror locks to open, energy passes to cross, reagent and synthesis puzzles, radical packs to terminate, a five-stance rematch, and spectra to see through illusions.", "final_battle": "Malradix splits into a radical chain of copies. Kai terminates them in pairs until only Malradix remains, then pairs his unpaired electron with Pi's to end the chain for good, restoring the Crown of Tetravalence.", "section_ids": ["6.6", "10.2", "8.10"]}, "map": {"note": "Overworld layout for the bible map; coordinates are on a 1000×700 canvas.", "size": [1000, 700], "sites": [{"id": "carbon_castle", "label": "Carbon Castle", "x": 500, "y": 350, "kind": "hub"}, {"id": "hydrogen_village", "label": "Hydrogen Village", "x": 200, "y": 590, "kind": "town"}, {"id": "world-1", "label": "1 Orbital Caverns", "x": 150, "y": 520}, {"id": "world-2", "label": "2 Tide Temple", "x": 300, "y": 470}, {"id": "world-3", "label": "3 Chain Labyrinth", "x": 170, "y": 340}, {"id": "world-4", "label": "4 Chair Fortress", "x": 330, "y": 230}, {"id": "world-5", "label": "5 Mirror Palace", "x": 230, "y": 120}, {"id": "world-6", "label": "6 Activation Peaks", "x": 610, "y": 470}, {"id": "world-7", "label": "7 Tower of Addition", "x": 780, "y": 350}, {"id": "world-8", "label": "8 Reagent Orchards", "x": 690, "y": 230}, {"id": "world-9", "label": "9 Triple Spire", "x": 780, "y": 110}, {"id": "world-10", "label": "10 Halogen Marsh", "x": 820, "y": 530}, {"id": "world-11", "label": "11 Arena of Five", "x": 520, "y": 620}, {"id": "world-12", "label": "12 Observatory", "x": 500, "y": 70}, {"id": "malradix_keep", "label": "Malradix's Keep", "x": 700, "y": 660, "kind": "finale"}], "paths": [["hydrogen_village", "world-1"], ["world-1", "world-2"], ["world-2", "carbon_castle"], ["carbon_castle", "world-3"], ["world-3", "world-4"], ["world-4", "world-5"], ["carbon_castle", "world-6"], ["world-6", "world-7"], ["world-7", "world-8"], ["world-8", "world-9"], ["carbon_castle", "world-12"], ["world-6", "world-10"], ["world-10", "world-11"], ["world-11", "malradix_keep"], ["carbon_castle", "world-11"]]}}, "book": {"source": {"title": "Organic Chemistry", "subtitle": "A Tenth Edition", "edition": "10th edition (preliminary release: Chapters 1–12)", "author": "John McMurry", "authors": ["John E. McMurry"], "author_affiliation": "Professor Emeritus, Department of Chemistry and Chemical Biology, Cornell University", "publisher": "OpenStax, Rice University", "year": 2023, "url": "https://openstax.org/details/books/organic-chemistry", "license": "CC BY-NC-SA 4.0", "license_note": "Text is CC BY-NC-SA 4.0 with attribution to OpenStax. Illustrations: 'Copyright Rice University, OpenStax, under CC BY-NC-SA 4.0 license.' Photos carry their own credit and license in their captions. Non-commercial use only; reuse must keep attribution and the same license.", "scope_note": "This PDF is a preliminary sample with Chapters 1–12 of 31; Chapters 13–31 and the Glossary are not included.", "dedication_note": "The author is not paid for this edition; it is dedicated to his son Peter McMurry, and supporters donated to the Cystic Fibrosis Foundation.", "pdf": "books/OrganicChemistry-SAMPLE_9ADraVJ.pdf", "pdf_path_note": "Path is relative to the repository root.", "pdf_page_count": 467, "page_offset": 12, "page_offset_note": "pdf_page = page + 12 (page = printed book page)."}, "chapters": [{"id": "1", "title": "Structure and Bonding", "pages": [7, 36], "summary": "Reviews atoms, orbitals, and covalent bonding as the foundation for all of organic chemistry. Carbon is special because it forms four strong covalent bonds and bonds to itself in chains and rings; hybridization (sp3, sp2, sp) explains the tetrahedral, trigonal planar, and linear geometries of carbon, and skeletal structures are introduced as the working language for drawing molecules.", "learner_can_do": "Given a small molecule, draw its Lewis, line-bond, and skeletal structures, assign the hybridization of each carbon (and N, O, P, S), and predict bond angles and overall shape.", "game_hook": "Players build molecules atom by atom, snapping bonds onto hybrid orbitals whose geometry (109.5°, 120°, 180°) constrains where the next atom can attach; a molecule only 'locks' when every atom has a full valence shell.", "figure_count": 89, "figures": [{"file": "book_contents/figures/ch01/fig-1.2.png", "label": "Figure 1.2", "caption": "FIGURE 1.2 Carbon, hydrogen, and other elements commonly found in organic compounds are shown in the colors typically used to represent them.", "desc": "A partial periodic table highlights elements commonly found in organic compounds with their typical molecular-model colors, including hydrogen, carbon, nitrogen, oxygen, sulfur, phosphorus, and several halogens. Other elements appear in uncolored boxes, with group numbers marked above the columns.", "section": "1.why"}, {"file": "book_contents/figures/ch01/fig-1.3.png", "label": "Figure 1.3", "caption": "FIGURE 1.3 A schematic view of an atom. The dense, positively charged nucleus contains most of the atom’s mass and is surrounded by negatively charged electrons. The three-dimensional view on the right shows calculated e", "desc": "The left schematic shows a small nucleus within a diffuse blue region labeled as the volume occupied by orbiting electrons. The right view shows a dark blue electron-density surface inside a larger gray mesh surface, illustrating that electron density increases toward the nucleus.", "section": "1.1"}, {"file": "book_contents/figures/ch01/fig-1.4.png", "label": "Figure 1.4", "caption": "FIGURE 1.4 Representations of s, p, and d orbitals. An s orbital is spherical, a p orbital is dumbbell-shaped, and four of the five d orbitals are cloverleaf-shaped. Different lobes of p orbitals are often drawn for conv", "desc": "Three side-by-side orbital models show a spherical s orbital, a two-lobed p orbital, and a four-lobed d orbital, each centered on a small green dot. The p and d lobes are colored pink and blue.", "section": "1.2"}, {"file": "book_contents/figures/ch01/fig-1.5.png", "label": "Figure 1.5", "caption": "FIGURE 1.5 Energy levels of electrons in an atom. The first shell holds a maximum of 2 electrons in one 1s orbital; the second shell holds a maximum of 8 electrons in one 2s and three 2p orbitals; the third shell holds a", "desc": "An upward arrow marks increasing energy beside three electron shells with capacities of 2, 8, and 18 electrons. Horizontal orbital levels labeled 1s, 2s, 2p, 3s, 3p, and 3d show paired up-and-down arrows for the electrons each orbital can hold.", "section": "1.2"}, {"file": "book_contents/figures/ch01/fig-1.6.png", "label": "Figure 1.6", "caption": "FIGURE 1.6 Shapes of the 2p orbitals. Each of the three mutually perpendicular, dumbbell-shaped orbitals has two lobes separated by a node. The two lobes have different algebraic signs in the corresponding wave function,", "desc": "Three diagrams show mutually perpendicular 2p orbitals aligned along the x, y, and z axes. Each has two dumbbell-shaped lobes colored blue and pink to indicate opposite signs of the wave function, separated by a node at the center.", "section": "1.2"}, {"file": "book_contents/figures/ch01/fig-1.7.png", "label": "Figure 1.7", "caption": "FIGURE 1.7 A representation of van’t Hoff’s tetrahedral carbon atom. The solid lines represent bonds in the plane of the paper, the heavy wedged line represents a bond coming out of the plane of the page toward the viewe", "desc": "Two pink tetrahedron sketches are compared with a carbon bonded to four hydrogens, shown both as a wedge-and-dash drawing and a ball-and-stick model. Arrows identify bonds in the plane
