identifying dominant intermolecular forces.", "learner_can_do": null}, "3.why": {"title": "Why This Chapter?", "pages": [71, 72], "summary": "Alkanes are simple and unreactive but are the vehicle for introducing naming and the three-dimensional aspects of molecules. Organic compounds fall into families with similar behavior, starting with alkanes.", "learner_can_do": null}, "3.1": {"title": "Functional Groups", "pages": [72, 77], "summary": "A functional group is a group of atoms with characteristic chemical behavior that is nearly the same in every molecule containing it; e.g., ethylene and menthene both add Br2 across their C=C. Table 3.1 lists families: C–C multiple bonds (alkenes, alkynes, arenes); carbon singly bonded to an electronegative atom (alkyl halides, alcohols, ethers, phosphates, amines, thiols, sulfides, disulfides), all with δ+ carbon; and carbonyl groups (aldehydes, ketones, carboxylic acids, esters, thioesters, amides, acid chlorides, anhydrides), all with δ+ carbonyl carbon and δ− oxygen.", "learner_can_do": "Locate and name every functional group in a given molecule (e.g., arecoline, statins) and propose simple structures containing a specified functional group."}, "3.2": {"title": "Alkanes and Alkane Isomers", "pages": [78, 81], "summary": "Alkanes are saturated hydrocarbons, CnH2n+2, built from sp3 carbons joined by single bonds. From C4 on, carbons can be arranged in different ways: straight-chain (normal) vs. branched alkanes. Isomers share a formula but differ in structure; constitutional isomers differ in connectivity (butane vs. isobutane, ethanol vs. dimethyl ether, propylamine vs. isopropylamine). Isomer counts explode with size (C30H62 has over 4 billion). The first ten straight-chain alkane names should be memorized.", "learner_can_do": "Draw all constitutional isomers for a formula (e.g., the five C6H14 isomers, two C2H7N isomers) and recognize when two drawings are the same compound."}, "3.3": {"title": "Alkyl Groups", "pages": [81, 84], "summary": "Removing an H from an alkane gives an alkyl group (methyl, ethyl, propyl, butyl...; -ane becomes -yl). Removing an internal H gives branched groups: isopropyl, sec-butyl, isobutyl, tert-butyl. Carbons are primary, secondary, tertiary, or quaternary by how many other carbons they bond to, and hydrogens are classified by their carbon. R stands for the rest of the molecule.", "learner_can_do": "Classify each carbon and hydrogen in a molecule as 1°, 2°, 3°, or 4°, and draw the alkyl groups of a given size."}, "3.4": {"title": "Naming Alkanes", "pages": [84, 89], "summary": "IUPAC names have a parent, prefixes, locants, and a suffix. Steps: (1) find the longest continuous chain (turning corners; with ties, the more branched one); (2) number from the end nearer the first branch (ties go to the second branch); (3) number each substituent; (4) write one word with alphabetized substituents, di-/tri- multipliers ignored for alphabetizing; (5) name complex branched substituents as their own units in parentheses. Common names isopropyl, isobutyl, sec-butyl, and tert-butyl are allowed.", "learner_can_do": "Give the IUPAC name of a branched alkane from its structure, draw a structure from its name, and explain why a given name is incorrect."}, "3.5": {"title": "Properties of Alkanes", "pages": [89, 90], "summary": "Alkanes (paraffins) are chemically inert to most reagents but burn in O2 to CO2 and water with heat release, and react with Cl2 under UV light to give mixtures of chlorinated products. Melting and boiling points rise with chain length because of dispersion forces, while branching lowers boiling point by making the molecule more spherical with less surface area (pentane 36.1 °C vs. neopentane 9.5 °C).", "learner_can_do": "Predict which of two alkanes has the higher boiling point from chain length and branching."}, "3.6": {"title": "Conformations of Ethane", "pages": [90, 92], "summary": "Stereochemistry is the study of 3D molecular shape. Cylindrical σ bonds allow rotation, producing conformations (conformers) that interconvert too fast to isolate. Sawhorse and Newman projections show them. Ethane's staggered conformation is 12 kJ/mol more stable than eclipsed; this torsional strain comes from three H↔H eclipsing interactions of about 4.0 kJ/mol each, giving an energy curve with minima every 120°.", "learner_can_do": "Draw sawhorse and Newman projections of ethane, identify staggered and eclipsed conformations, and sketch energy versus dihedral angle."}, "3.7": {"title": "Conformations of Other Alkanes", "pages": [92, 96], "summary": "Propane's barrier is 14 kJ/mol, assigning 6.0 kJ/mol to an H↔CH3 eclipsing interaction. In butane the anti conformation (methyls 180° apart) is lowest; gauche (60°) is 3.8 kJ/mol higher from steric strain; the CH3↔CH3 eclipsed conformation (19 kJ/mol) is highest, giving 11 kJ/mol per CH3↔CH3 eclipse. Table 3.5 summarizes these interaction costs. All conformers are in rapid equilibrium, but more molecules sit in the most stable, all-staggered, anti form.", "learner_can_do": "Draw Newman projections of the most and least stable conformations of a substituted alkane and calculate total strain using Table 3.5 values."}, "3.chemistry-matters": {"title": "Chemistry Matters—Gasoline", "pages": [97, 98], "summary": "Natural gas and petroleum are the main alkane sources. Crude oil is fractionally distilled into gasoline, kerosene, and heating oil. Straight-chain hydrocarbons cause engine knock; octane number rates fuels from heptane (0) to isooctane (100). Catalytic cracking makes branched molecules and reforming makes aromatics to raise octane.", "learner_can_do": null}, "3.key-terms": {"title": "Key Terms", "pages": [98, 98], "summary": "Glossary list of the 40 key terms introduced in Chapter 3.", "learner_can_do": null}, "3.summary": {"title": "Summary", "pages": [98, 99], "summary": "Chapter recap: functional groups determine reactivity; alkanes are CnH2n+2 saturated hydrocarbons named by IUPAC rules; constitutional isomers differ in connectivity; σ-bond rotation gives conformations, and staggered/anti arrangements are most stable.", "learner_can_do": null}, "3.problems": {"title": "Additional Problems", "pages": [99, 104], "summary": "Practice identifying functional groups, drawing isomers (C7H16, C4H10O), naming alkanes and finding naming errors, classifying carbons and hydrogens, and building quantitative energy-versus-rotation plots for substituted ethanes and butanes.", "learner_can_do": null}, "4.why": {"title": "Why This Chapter?", "pages": [105, 106], "summary": "Rings appear in most pharmaceuticals and all biomolecule classes, and ring structure changes how functional groups behave; examples include chrysanthemic acid (cyclopropane), prostaglandins (cyclopentane), and steroids (fused six- and five-membered rings).", "learner_can_do": null}, "4.1": {"title": "Naming Cycloalkanes", "pages": [106, 108], "summary": "Cycloalkanes (alicyclic compounds) have formula CnH2n and are drawn as polygons. Naming: if the ring has at least as many carbons as the largest substituent, name as an alkyl-substituted cycloalkane, otherwise as a cycloalkyl-substituted alkane. Number from a substituent so the next one gets the lowest possible number; break ties alphabetically; treat halogens like alkyl groups.", "learner_can_do": "Give the IUPAC name of a substituted cycloalkane and draw a cycloalkane from its name."}, "4.2": {"title": "Cis–Trans Isomerism in Cycloalkanes", "pages": [108, 110], "summary": "Rings are much less flexible than chains (cyclopropane is rigid and planar), so a ring has a top and a bottom face. Two substituents on the same face are cis, on opposite faces trans; cis- and trans-1,2-dimethylcyclopropane are distinct, non-interconverting stereoisomers—same connectivity, different 3D arrangement—unlike constitutional isomers.", "learner_can_do": "Decide whether two ring substituents shown with wedges and dashes are cis or trans, and include the prefix in the name."}, "4.3": {"title": "Stability of Cycloalkanes: Ring Strain", "pages": [110, 111], "summary": "Baeyer proposed angle strain from flat-ring geometry. Measuring heats of combustion per CH2 shows cyclopropane and cyclobutane are strained, cyclopentane is more strained than predicted, cyclohexane is strain-free, and rings of 14+ are strain-free. Baeyer was wrong because rings pucker. Total strain combines angle strain, torsional strain (eclipsing), and steric strain (atoms too close).", "learner_can_do": "Rank cycloalkanes by ring strain and attribute strain to angle, torsional, and steric sources."}, "4.4": {"title": "Conformations of Cycloalkanes", "pages": [112, 113], "summary": "Cyclopropane (115 kJ/mol strain) has 60° angles and eclipsed C–H bonds; its bent bonds are weaker (255 vs. 370 kJ/mol). Cyclobutane (110 kJ/mol) puckers about 25° to trade a little angle strain for less torsional strain. Cyclopentane (26 kJ/mol) puckers with one carbon out of plane so most hydrogens are nearly staggered.", "learner_can_do": "Explain how puckering balances angle strain against torsional strain in cyclobutane and cyclopentane."}, "4.5": {"title": "Conformations of Cyclohexane", "pages": [113, 115], "summary": "Cyclohexane adopts a strain-free chair conformation with C–C–C angles of 111.5° and all neighboring C–H bonds staggered. The chair is drawn in three steps (two offset parallel lines, a top carbon up-right, a bottom carbon down-left). The twist-boat is about 23 kJ/mol higher because of steric and torsional strain, so it is rare.", "learner_can_do": "Draw a correct chair cyclohexane and explain why it has no angle or torsional strain."}, "4.6": {"title": "Axial and Equatorial Bonds in Cyclohexane", "pages": [115, 118], "summary": "Each chair carbon has one axial position (parallel to the ring axis) and one equatorial position (around the ring's equator), alternating up and down around the ring. Cis/trans depends only on which face a group is on, not on axial/equatorial. A ring-flip (barrier about 45 kJ/mol, fast at room temperature) converts every axial position to equatorial and vice versa, so monosubstituted cyclohexanes exist as one compound.", "learner_can_do": "Label positions on a chair as axial or equatorial and predict where each group goes after a ring-flip."}, "4.7": {"title": "Conformations of Monosubstituted Cyclohexanes", "pages": [118, 120], "summary": "Equatorial substituents are more stable: equatorial methylcyclohexane is favored by 7.6 kJ/mol (about 95:5), from ΔE = −RT ln K. The cost comes from 1,3-diaxial interactions between an axial group and axial hydrogens on C3 and C5, each equivalent to a gauche butane interaction (3.8 kJ/mol). Strain grows with substituent size (Table 4.1: CH3 < ethyl < isopropyl << tert-butyl).", "learner_can_do": "Use Table 4.1 values to compute the axial–equatorial energy difference for a monosubstituted cyclohexane and estimate the equilibrium percentages."}, "4.8": {"title": "Conformations of Disubstituted Cyclohexanes", "pages": [120, 123], "summary": "For disubstituted cyclohexanes, evaluate all steric interactions in both chairs. cis-1,2-Dimethylcyclohexane's chairs are equal (one axial, one equatorial each, 11.4 kJ/mol). trans-1,2-Dimethylcyclohexane strongly prefers diequatorial (by 11.4 kJ/mol). Table 4.2 gives the axial/equatorial patterns for cis/trans 1,2-, 1,3-, and 1,4-substitution. Larger groups take equatorial (e.g., tert-butyl equatorial, Cl axial in cis-1-tert-butyl-4-chlorocyclohexane); glucose has all substituents equatorial.", "learner_can_do": "Draw the more stable chair of a disubstituted cyclohexane and estimate by how much it is favored."}, "4.9": {"title": "Conformations of Polycyclic Molecules", "pages": [123, 125], "summary": "Polycyclic molecules fuse rings along shared bonds. Decalin exists as cis- and trans-fused isomers (bridgehead hydrogens on the same or opposite faces) that cannot interconvert. Steroids fuse three six-membered rings and one five-membered ring. Norbornane (bicyclo[2.2.1]heptane) has a locked boat cyclohexane bridged by a CH2; camphor is a natural example. Bicyclo names count bridge lengths between bridgehead atoms.", "learner_can_do": "Identify cis or trans ring fusions in decalin and steroids (e.g., estrone) and read a bicyclo[x.y.z] name."}, "4.chemistry-matters": {"title": "Chemistry Matters—Molecular Mechanics", "pages": [126, 127], "summary": "Molecular mechanics programs find the lowest-energy geometry by repeatedly adjusting a structure to reduce total strain from bond angles, bond lengths, torsional eclipsing, and steric contacts. They are used in drug design to fit molecules to receptors (e.g., Tamiflu).", "learner_can_do": null}, "4.key-terms": {"title": "Key Terms", "pages": [127, 127], "summary": "Glossary list of the 17 key terms introduced in Chapter 4.", "learner_can_do": null}, "4.summary": {"title": "Summary", "pages": [127, 127], "summary": "Chapter recap: cycloalkanes CnH2n, cis–trans stereoisomers, the three kinds of ring strain, puckered small rings, the strain-free chair, axial/equatorial positions and ring-flips, and the equatorial preference driven by 1,3-diaxial interactions.", "learner_can_do": null}, "4.problems": {"title": "Additional Problems", "pages": [128, 134], "summary": "Practice naming cycloalkanes, judging identical/constitutional/stereoisomer relationships, assigning axial/equatorial and cis/trans in glucose, menthol, hydrocortisone, and steroids, calculating chair strain energies and equilibrium percentages, and analyzing decalin, Bredt's rule, and ketal formation.", "learner_can_do": null}, "5.why": {"title": "Why This Chapter?", "pages": [135, 136], "summary": "Handedness arises from the tetrahedral geometry of sp3 carbon and is central to biology: most biomolecules and many drugs are handed, and enzyme–substrate fits depend on it.", "learner_can_do": null}, "5.1": {"title": "Enantiomers and the Tetrahedral Carbon", "pages": [136, 137], "summary": "CH3X and CH2XY are identical to their mirror images, but CHXYZ (four different groups) is not, just as left and right hands aren't superimposable. Non-superimposable mirror-image stereoisomers are enantiomers; lactic acid (−H, −OH, −CH3, −CO2H on one carbon) exists as (+) and (−) forms, and no orientation makes them coincide.", "learner_can_do": "Decide whether a tetrahedral carbon bears four different groups and draw the two enantiomers with wedges and dashes (e.g., lactic acid, alanine)."}, "5.2": {"title": "The Reason for Handedness in Molecules: Chirality", "pages": [137, 140], "summary": "A molecule not identical to its mirror image is chiral; a molecule with a plane of symmetry in any conformation is achiral (propanoic acid vs. lactic acid). The usual cause is a chirality center: a tetrahedral carbon with four different groups, where the difference may be several atoms away (5-bromodecane). Ring examples: methylcyclohexane is achiral, 2-methylcyclohexanone is chiral. CH2, CH3, and sp2/sp carbons can't be chirality centers.", "learner_can_do": "Identify all chirality centers in a molecule and decide whether the whole molecule is chiral by looking for a symmetry plane."}, "5.3": {"title": "Optical Activity", "pages": [140, 142], "summary": "Biot found that solutions of some organic compounds rotate plane-polarized light (optical activity), measured with a polarimeter. Clockwise rotation is dextrorotatory (+), counterclockwise levorotatory (−). Observed rotation scales with concentration and pathlength, so specific rotation [α]D = α / (l × c) at the 589.6 nm sodium D line (l in dm, c in g/cm3) is a physical constant; enantiomers have equal and opposite values (±3.82 for lactic acid).", "learner_can_do": "Compute observed rotation or specific rotation from concentration and pathlength (e.g., cocaine, coniine)."}, "5.4": {"title": "Pasteur’s Discovery of Enantiomers", "pages": [142, 143], "summary": "In 1848 Pasteur crystallized sodium ammonium tartrate and hand-sorted two mirror-image crystal forms whose solutions rotated light equally in opposite directions. He proposed molecular asymmetry decades before the tetrahedral carbon. Enantiomers (optical isomers) share physical properties except the direction of optical rotation.", "learner_can_do": "Explain what Pasteur's crystal sorting showed about molecular handedness and which properties enantiomers share."}, "5.5": {"title": "Sequence Rules for Specifying Configuration", "pages": [143, 147], "summary": "Cahn–Ingold–Prelog rules rank groups on a chirality center: (1) by atomic number of the directly attached atom (heavier isotope higher); (2) if tied, compare the next atoms out until a difference; (3) multiple bonds count as duplicated single-bonded atoms. With the lowest-ranked group pointing away, a clockwise 1→2→3 path is R, counterclockwise is S. R/S has no simple relation to the sign of optical rotation ((S)-glyceraldehyde is (−), (S)-alanine is (+)); absolute configuration was settled by X-ray in 1951.", "learner_can_do": "Rank four substituents by CIP rules and assign R or S to a chirality center drawn in any orientation; draw a specified enantiomer such as (R)-2-chlorobutane."}, "5.6": {"title": "Diastereomers", "pages": [147, 150], "summary": "A molecule with n chirality centers has up to 2^n stereoisomers. Threonine (two centers) has four: two enantiomer pairs (2R,3R/2S,3S and 2R,3S/2S,3R). Stereoisomers that aren't mirror images are diastereomers—opposite at some centers, the same at others. Epimers are diastereomers differing at only one center (cholestanol and coprostanol at C5). Usually only one stereoisomer occurs in nature (2S,3R-threonine).", "learner_can_do": "List all stereoisomers of a compound with several chirality centers and label each pair as enantiomers, diastereomers, or epimers."}, "5.7": {"title": "Meso Compounds", "pages": [150, 152], "summary": "Meso compounds contain chirality centers but are achiral overall because of an internal symmetry plane. Tartaric acid has three stereoisomers: the (+) and (−) enantiomers and meso-tartaric acid (2R,3S = 2S,3R). The enantiomers share melting point, density, and solubility; the meso form is a diastereomer with different properties and zero rotation. cis-1,2-Dimethylcyclobutane is meso.", "learner_can_do": "Recognize a meso compound by finding its internal mirror plane and predict which compounds (e.g., 2,3-butanediol) have a meso form."}, "5.8": {"title": "Racemic Mixtures and the Resolution of Enantiomers", "pages": [152, 154], "summary": "A racemate (racemic mixture, ±) is a 50:50 mix of enantiomers and shows no optical rotation. Resolution separates enantiomers: reacting a racemic acid with an achiral amine gives a racemic salt (no help), but reacting it with a single enantiomer of a chiral amine (e.g., (R)-1-phenylethylamine) gives diastereomeric salts with different properties that can be separated, then acidified to recover each pure enantiomer.", "learner_can_do": "Predict the stereochemical relationship of products when a racemate reacts with an achiral or a single-enantiomer chiral reagent, and outline a resolution."}, "5.9": {"title": "A Review of Isomerism", "pages": [154, 155], "summary": "A map of isomerism: constitutional isomers differ in connectivity (skeletal, functional, positional), while stereoisomers share connectivity but differ in 3D arrangement (enantiomers and diastereomers, with cis–trans isomers a subclass of diastereomers).", "learner_can_do": "Classify any pair of isomers into the correct branch of the isomer family tree."}, "5.10": {"title": "Chirality at Nitrogen, Phosphorus, and Sulfur", "pages": [155, 156], "summary": "N, P, and S can also be chirality centers. Trivalent amines are chiral in principle (lone pair as fourth group) but rapidly invert like an umbrella, so enantiomers can't be isolated. Phosphines invert slowly and can be isolated as enantiomers; trivalent sulfonium salts are configurationally stable too, e.g., S-adenosylmethionine, the biological methyl donor, which is S at sulfur.", "learner_can_do": "Predict whether a chiral N, P, or S compound can be isolated as a single enantiomer, based on its inversion rate."}, "5.11": {"title": "Prochirality", "pages": [156, 158], "summary": "A prochiral molecule becomes chiral in one step. The two faces of a trigonal sp2 carbon are Re (clockwise ranking) or Si (counterclockwise); adding H to the Re or Si face of 2-butanone gives opposite 2-butanol enantiomers. An sp3 prochirality center has two identical groups labeled pro-R or pro-S by imagining one replaced with a higher-ranking isotope. Enzymes act stereospecifically at these sites (fumarate hydration on the Si face gives (S)-malate; alcohol dehydrogenase removes ethanol's pro-R hydrogen and adds to the Re face of NAD+).", "learner_can_do": "Label the Re and Si faces of a carbonyl or alkene carbon and identify pro-R and pro-S hydrogens on a CH2 group."}, "5.12": {"title": "Chirality in Nature and Chiral Environments", "pages": [159, 160], "summary": "Enantiomers have identical physical properties but often different biological effects, because biological receptors are chiral: only one enantiomer fits, like a hand in the matching glove (e.g., (S)-fluoxetine prevents migraine). A chiral environment also makes the two identical groups of a prochiral molecule distinguishable, which is how enzymes select pro-R vs. pro-S hydrogens, much as your hand makes one side of a symmetric mug the drinking side.", "learner_can_do": "Explain with a three-point-binding model why a chiral receptor distinguishes enantiomers and the two faces or groups of a prochiral substrate."}, "5.chemistry-matters": {"title": "Chemistry Matters—Chiral Drugs", "pages": [161, 162], "summary": "Drugs from natural sources are usually single enantiomers (penicillin V is 2S,5R,6R; its enantiomer is inactive), while synthetic chiral drugs are often sold as racemates. Only (S)-ibuprofen is active, and the R form slows its onset, which drives enantioselective synthesis.", "learner_can_do": null}, "5.key-terms": {"title": "Key Terms", "pages": [162, 162], "summary": "Glossary list of the 25 key terms introduced in Chapter 5.", "learner_can_do": null}, "5.summary": {"title": "Summary", "pages": [162, 163], "summary": "Chapter recap: chirality and symmetry planes, chirality centers, enantiomers and optical activity, CIP R/S assignment, diastereomers and epimers (up to 2^n stereoisomers), meso compounds, racemates and resolution, and prochirality (Re/Si, pro-R/pro-S).", "learner_can_do": null}, "5.problems": {"title": "Additional Problems", "pages": [163, 170], "summary": "Practice assigning R/S in drugs and biomolecules (pseudoephedrine, vitamin C, xylose, cephalexin, chloramphenicol), identifying meso forms, counting stereoisomers (ribose, 2,4-dibromo-3-chloropentane), labeling pro-R/pro-S and Re/Si in metabolic reactions, and explaining chirality without chirality centers (allenes).", "learner_can_do": null}, "6.why": {"title": "Why This Chapter?", "pages": [171, 172], "summary": "All reactions, in the lab or in living cells, follow the same rules; organic chemistry is unified by a few broad themes, so understanding why and how reactions occur minimizes memorization.", "learner_can_do": null}, "6.1": {"title": "Kinds of Organic Reactions", "pages": [172, 173], "summary": "Four general reaction types: additions (two reactants give one product, e.g., ethylene + HBr), eliminations (one reactant splits into two, often losing water or HBr), substitutions (two reactants exchange parts, e.g., ester hydrolysis), and rearrangements (one reactant reorganizes into an isomer, e.g., dihydroxyacetone phosphate to glyceraldehyde 3-phosphate).", "learner_can_do": "Classify a given reaction as an addition, elimination, substitution, or rearrangement."}, "6.2": {"title": "How Organic Reactions Occur: Mechanisms", "pages": [173, 173], "summary": "A reaction mechanism describes which bonds break and form, in what order, and how fast each step is. Bonds break heterolytically (both electrons to one fragment, full-headed curved arrow) or homolytically (one electron each, fishhook arrow), and form the same two ways. Polar reactions use unsymmetrical bond changes and are most common; radical reactions use symmetrical changes and involve species with an unpaired electron; pericyclic reactions are a third, rarer type.", "learner_can_do": "Distinguish heterolytic from homolytic bond cleavage and draw the matching arrow type."}, "6.3": {"title": "Polar Reactions", "pages": [174, 178], "summary": "Polar reactions happen because electron-rich sites attract electron-poor ones. Carbon bonded to more electronegative atoms is δ+, and bonded to metals is δ− (Table 6.1). Protonation by acid makes a carbon more electron-poor, and polarizability lets C–S and C–I bonds react as if polar. A nucleophile donates an electron pair (NH3, H2O, HO−, Cl−); an electrophile accepts one (H+ donors, alkyl halides, carbonyl compounds). Nucleophiles are Lewis bases and electrophiles are Lewis acids; neutral molecules can act as either.", "learner_can_do": "Identify the nucleophilic and electrophilic sites in a molecule or ion (e.g., NO2+, CN−, CH3NH2, BF3)."}, "6.4": {"title": "An Example of a Polar Reaction: Addition of HBr to Ethylene", "pages": [178, 181], "summary": "HBr adds to ethylene by electrophilic addition. The C=C π electrons are more numerous and more exposed than σ electrons, so alkenes are nucleophiles. In step 1 the π bond attacks H of HBr, forming C–H and Br− and leaving a carbocation (a carbon with six valence electrons and a positive charge). In step 2 Br− donates a pair to the carbocation, forming C–Br.", "learner_can_do": "Write the two-step mechanism for HX addition to an alkene with curved arrows and draw the carbocation intermediate (e.g., 2-methylpropene + HBr)."}, "6.5": {"title": "Using Curved Arrows in Polar Reaction Mechanisms", "pages": [181, 183], "summary": "Curved-arrow rules: (1) electrons flow from a nucleophilic source (lone pair or multiple bond) to an electrophilic sink; (2) a negative nucleophile becomes neutral, a neutral one becomes positive; (3) a positive electrophile becomes neutral, a neutral one becomes negative only if the charge lands on an electronegative atom; charge is conserved; (4) the octet rule holds, so if electrons move onto an atom with an octet, another pair must leave it.", "learner_can_do": "Add correct curved arrows to a polar reaction and predict products from a given arrow-pushing scheme."}, "6.6": {"title": "Radical Reactions", "pages": [183, 185], "summary": "Radicals have an odd number of valence electrons and are highly reactive. They react by abstracting an atom (radical substitution) or adding to a double bond (radical addition), each producing a new radical. Methane chlorination is a chain reaction: UV light splits Cl2, Cl· abstracts H from CH4, and ·CH3 reacts with Cl2 to regenerate Cl·. Prostaglandin biosynthesis starts with radical H-abstraction from arachidonic acid. Radical chlorination gives product mixtures when several kinds of C–H are present.", "learner_can_do": "Write the propagation steps of a radical chain reaction with fishhook arrows and list all monochlorination products of an alkane."}, "6.7": {"title": "Describing a Reaction: Equilibria, Rates, and Energy Changes", "pages": [185, 187], "summary": "The equilibrium constant Keq tells which side is favored (Keq > 10^3 means essentially complete). Keq relates to the standard free-energy change by ΔG° = −RT ln Keq; negative ΔG° is exergonic, positive is endergonic. ΔG = ΔH − TΔS: ΔH (heat of reaction) reflects bond strengths (exothermic if negative), and ΔS reflects randomness (positive for eliminations, negative for additions). Ethylene + HBr has Keq ≈ 7.1 × 10^7 and ΔG° = −44.8 kJ/mol. Equilibria say how much, not how fast.", "learner_can_do": "Interconvert Keq and ΔG°, and decide whether a reaction is exergonic/endergonic and exothermic/endothermic from ΔH, ΔS, and T."}, "6.8": {"title": "Describing a Reaction: Bond Dissociation Energies", "pages": [187, 189], "summary": "Bond dissociation energy (D) is the energy to break a bond homolytically into two radicals in the gas phase (CH3–H 439 kJ/mol; Table 6.3). Exothermic reactions are favored by weak bonds in reactants and strong bonds in products. 'High-energy' biomolecules like ATP simply have relatively weak bonds, so their reactions release more heat (ATP hydrolysis −30 kJ/mol vs. −9 kJ/mol for glycerol 3-phosphate).", "learner_can_do": "Estimate ΔH for a reaction from bond dissociation energies of bonds broken and formed."}, "6.9": {"title": "Describing a Reaction: Energy Diagrams and Transition States", "pages": [189, 191], "summary": "Energy diagrams plot energy against the reaction coordinate. The transition state is the highest-energy structure in a step, an unisolable activated complex with bonds partly broken and formed. Activation energy ΔG‡ (reactants to transition state) sets the rate; ΔG° (reactants to products) sets the equilibrium. Typical organic ΔG‡ values are 40–150 kJ/mol; below about 80 kJ/mol reactions run at room temperature. Ethylene + HBr's first step has ΔG‡ ≈ 140 kJ/mol and is endergonic.", "learner_can_do": "Label reactants, products, transition state, ΔG‡, and ΔG° on an energy diagram and compare reaction rates from ΔG‡ values."}, "6.10": {"title": "Describing a Reaction: Intermediates", "pages": [192, 194], "summary": "A reaction intermediate, like the carbocation in HBr addition, sits in an energy minimum between two transition states; it is more stable than its neighboring transition states but usually too unstable to isolate. Multistep diagrams join each step; the overall rate is set by the highest transition state relative to reactants, and overall ΔG° is reactants versus final products. Enzymes split biological reactions into many small steps with low barriers and small energy changes.", "learner_can_do": "Draw a multistep energy diagram, mark the intermediate, and identify which transition state controls the overall rate."}, "6.11": {"title": "A Comparison Between Biological Reactions and Laboratory Reactions", "pages": [194, 196], "summary": "Lab reactions run in organic solvents over wide temperature ranges with small reagents and little substrate specificity; biological reactions run in water at body temperature, are catalyzed by enzymes with substrate-binding active sites (e.g., hexokinase), and use complex coenzymes such as ATP and NADH, of which only a small part reacts. Biological equations abbreviate coenzymes with a curved arrow across the main arrow.", "learner_can_do": "Compare a laboratory reaction and its biological counterpart in solvent, temperature, catalyst, reagent, and specificity, and find the reactive part of a large coenzyme."}, "6.chemistry-matters": {"title": "Chemistry Matters—Where Do Drugs Come From?", "pages": [197, 198], "summary": "Most new drugs take their lead from natural products (about 67%), either unmodified or chemically modified. Approval takes about 10 years: preclinical testing, an IND application, phase I–III clinical trials with steep attrition (roughly 20% success), and an NDA review.", "learner_can_do": null}, "6.key-terms": {"title": "Key Terms", "pages": [198, 199], "summary": "Glossary list of the 27 key terms introduced in Chapter 6.", "learner_can_do": null}, "6.summary": {"title": "Summary", "pages": [199, 199], "summary": "Chapter recap: four reaction types, polar vs. radical mechanisms, nucleophiles and electrophiles, curved arrows, ΔG = ΔH − TΔS and Keq, bond dissociation energies, energy diagrams with transition states, activation energy, and intermediates.", "learner_can_do": null}, "6.problems": {"title": "Additional Problems", "pages": [199, 206], "summary": "Practice drawing and interpreting energy diagrams, calculating ΔG° from ΔH° and ΔS°, adding curved arrows to polar and biological reactions (α-terpineol biosynthesis), identifying nucleophiles and electrophiles, predicting radical chlorination products, and drawing carbocation intermediates.", "learner_can_do": null}, "7.why": {"title": "Why This Chapter?", "pages": [207, 208], "summary": "C=C bonds are in most organic and biological molecules (ethylene ripens fruit, α-pinene is turpentine, lycopene has 13 double bonds), so understanding alkene stereoisomerism and electrophilic addition is foundational.", "learner_can_do": null}, "7.1": {"title": "Industrial Preparation and Use of Alkenes", "pages": [208, 209], "summary": "Ethylene and propylene are the most important industrial organic chemicals (hundreds of millions of tons per year), feeding polyethylene, polypropylene, ethylene glycol, and more. They're made by steam cracking C2–C8 alkanes at up to 900 °C, a radical process that is endothermic but driven by a large positive entropy change at high temperature (TΔS° > ΔH°).", "learner_can_do": "Explain why steam cracking is favorable despite being endothermic, using ΔG° = ΔH° − TΔS°."}, "7.2": {"title": "Calculating the Degree of Unsaturation", "pages": [209, 211], "summary": "Each ring or π bond removes two hydrogens from the saturated formula CnH2n+2, so the degree of unsaturation (rings + multiple bonds) can be computed from a molecular formula: add halogens to hydrogens, ignore oxygens, and subtract nitrogens from hydrogens. C6H10 has two degrees: two double bonds, a ring plus a double bond, two rings, or a triple bond.", "learner_can_do": "Compute the degree of unsaturation from any formula containing C, H, X, O, and N, and propose structures that fit."}, "7.3": {"title": "Naming Alkenes", "pages": [211, 213], "summary": "Alkenes are named with -ene: find the longest chain containing the C=C, number from the end nearer the double bond (or nearer the first branch if tied), and give the first alkene carbon's locant; use -diene, -triene for several. Cycloalkenes put the double bond at C1–C2. Common names (ethylene, propylene, isobutylene, isoprene) and groups (methylene =CH2, vinyl, allyl) are accepted. Post-1993 IUPAC names put the locant before -ene (but-2-ene).", "learner_can_do": "Name alkenes and cycloalkenes by IUPAC rules and draw structures from names."}, "7.4": {"title": "Cis–Trans Isomerism in Alkenes", "pages": [213, 214], "summary": "Rotation about a C=C requires breaking the π bond (about 350 kJ/mol vs. 12 kJ/mol for ethane), so substituted alkenes form isolable cis–trans stereoisomers (cis- and trans-2-butene). Cis–trans isomerism requires each double-bond carbon to carry two different groups.", "learner_can_do": "Decide whether an alkene can exist as cis–trans isomers and draw and name each isomer."}, "7.5": {"title": "Alkene Stereochemistry and the E,Z Designation", "pages": [214, 217], "summary": "For tri- and tetrasubstituted alkenes, the E,Z system uses CIP sequence rules on each double-bond carbon separately: if the two higher-ranked groups are on the same side, the alkene is Z (zusammen); if opposite, E (entgegen).", "learner_can_do": "Rank the two groups on each alkene carbon by CIP rules and assign E or Z."}, "7.6": {"title": "Stability of Alkenes", "pages": [217, 219], "summary": "Trans alkenes are more stable than cis (trans-2-butene by 2.8 kJ/mol, 76:24 at equilibrium) because of steric strain between cis substituents. Heats of hydrogenation measure relative stability: more substituted alkenes release less heat (ethylene −136, tetrasubstituted −110 kJ/mol), so stability increases with substitution. Reasons: hyperconjugation between the π orbital and neighboring C–H σ bonds, and stronger sp2–sp3 bonds.", "learner_can_do": "Rank alkene isomers by stability using substitution and cis/trans geometry, and interpret heats of hydrogenation."}, "7.7": {"title": "Electrophilic Addition Reactions of Alkenes", "pages": [219, 222], "summary": "Alkenes react as nucleophiles in electrophilic addition: the π electrons attack H of HX to form a carbocation (slow step, larger ΔG‡), then the halide adds to the cation (fast step). The overall reaction is exergonic with two transition states and a carbocation intermediate. HCl, HBr, HI (from KI and H3PO4), and H2O (with acid catalyst) all add. Reactions can be written with reagents above the arrow, and biological reactions with abbreviated coenzymes.", "learner_can_do": "Draw the two-step mechanism and energy diagram for HX or acid-catalyzed H2O addition to an alkene."}, "7.8": {"title": "Orientation of Electrophilic Additions: Markovnikov’s Rule", "pages": [222, 225], "summary": "HX additions to unsymmetrical alkenes are regiospecific. Markovnikov's rule: H attaches to the carbon with fewer alkyl substituents and X to the carbon with more; restated, the more highly substituted carbocation forms as the intermediate. Equally substituted alkene carbons give mixtures. To plan a synthesis, work backward from the product to possible starting alkenes.", "learner_can_do": "Predict the major product of HX addition to an unsymmetrical alkene, and propose which alkenes could give a target alkyl halide."}, "7.9": {"title": "Carbocation Structure and Stability", "pages": [226, 228], "summary": "Carbocations are planar sp2 carbons with an empty p orbital. Stability order is tertiary > secondary > primary > methyl, shown by alkyl halide dissociation enthalpies. Alkyl groups stabilize the cation through inductive electron donation and through hyperconjugation of neighboring C–H σ bonds aligned with the empty p orbital.", "learner_can_do": "Rank carbocations by stability and identify which C–H bonds can hyperconjugate with the vacant p orbital."}, "7.10": {"title": "The Hammond Postulate", "pages": [228, 230], "summary": "The Hammond postulate links stability to rate: a transition state resembles the nearest stable species, so for an endergonic step it resembles the product, and for an exergonic step the reactant. Alkene protonation is endergonic, so its transition state resembles the carbocation, and whatever stabilizes the cation also lowers the barrier. That is why more stable carbocations form faster.", "learner_can_do": "Use the Hammond postulate to predict which of two alkenes forms a carbocation faster and whether a step's transition state looks like reactant or product."}, "7.11": {"title": "Evidence for the Mechanism of Electrophilic Additions: Carbocation Rearrangements", "pages": [230, 232], "summary": "Mechanisms can't be proven, only shown consistent with the facts. Whitmore found rearranged products in HX additions (3-methyl-1-butene gives 2-chloro-2-methylbutane), explained by carbocation intermediates that rearrange to more stable ions via a hydride shift (H with its electron pair) or an alkyl shift (e.g., methyl from 3,3-dimethyl-1-butene). Such shifts are important in steroid biosynthesis (cholesterol).", "learner_can_do": "Predict when a carbocation will rearrange and draw the hydride or alkyl shift that gives the more stable cation and the rearranged product."}, "7.chemistry-matters": {"title": "Chemistry Matters—Bioprospecting: Hunting for Natural Products", "pages": [233, 234], "summary": "Natural products are small secondary metabolites (over 300,000 estimated), such as alkaloids, antibiotics, and immunosuppressants like rapamycin from an Easter Island soil bacterium. Bioprospectors search ecosystems for new drug leads, racing habitat loss since less than 1% of organisms have been studied.", "learner_can_do": null}, "7.key-terms": {"title": "Key Terms", "pages": [234, 234], "summary": "Glossary list of the 15 key terms introduced in Chapter 7.", "learner_can_do": null}, "7.summary": {"title": "Summary", "pages": [234, 235], "summary": "Chapter recap: alkenes are unsaturated; cis–trans and E,Z stereoisomers; stability rises with substitution; electrophilic additions proceed via carbocations and follow Markovnikov's rule; the Hammond postulate links cation stability to rate; rearrangements by hydride and alkyl shifts support the mechanism.", "learner_can_do": null}, "7.problems": {"title": "Additional Problems", "pages": [235, 242], "summary": "Practice naming alkenes and assigning E/Z (ocimene, farnesene, tamoxifen), computing degrees of unsaturation (cholesterol, loratadine), ranking alkene and carbocation stability, drawing Markovnikov addition and rearrangement mechanisms, and following biosynthetic cyclizations (limonene, epi-aristolochene).", "learner_can_do": null}, "8.why": {"title": "Why This Chapter?", "pages": [243, 244], "summary": "With the background done, the book starts the systematic study of functional groups; the reactions must be learned, but the focus is on general patterns of reactivity.", "learner_can_do": null}, "8.1": {"title": "Preparing Alkenes: A Preview of Elimination Reactions", "pages": [244, 245], "summary": "Alkenes are prepared mainly by elimination, the reverse of addition: dehydrohalogenation of alkyl halides with strong base (KOH/ethanol) and dehydration of alcohols with strong acid (H2SO4/THF). Biological dehydrations usually need the –OH two carbons from a C=O (β-hydroxybutyryl ACP to trans-crotonyl ACP). Eliminations often give product mixtures.", "learner_can_do": "Predict the alkene products (including mixtures and E/Z isomers) from dehydrohalogenation or dehydration of a given substrate."}, "8.2": {"title": "Halogenation of Alkenes: Addition of X2", "pages": [245, 247], "summary": "Br2 and Cl2 add to alkenes to give 1,2-dihalides (1,2-dichloroethane for PVC is made this way). Addition to cycloalkenes gives only trans products, i.e., anti stereochemistry, explained by a cyclic bromonium (or chloronium) ion intermediate that blocks one face so Br− attacks from the opposite side. Olah observed stable bromonium ions. Marine haloperoxidases perform the same chemistry (halomon).", "learner_can_do": "Predict the stereochemistry of X2 addition to a cyclic or acyclic alkene and draw the halonium-ion mechanism."}, "8.3": {"title": "Halohydrins from Alkenes: Addition of HO-X", "pages": [247, 249], "summary": "With water present, the bromonium ion is intercepted by H2O instead of Br−, giving a 1,2-halo alcohol (halohydrin) with net HO–Br addition. N-Bromosuccinimide (NBS) in aqueous DMSO is a safe Br2 source. The OH goes to the more substituted carbon (Markovnikov) and the addition is anti. Aromatic rings don't react.", "learner_can_do": "Predict the regiochemistry and stereochemistry of halohydrin formation from an unsymmetrical alkene."}, "8.4": {"title": "Hydration of Alkenes: Addition of H2O by Oxymercuration", "pages": [249, 252], "summary": "Acid-catalyzed hydration (H2SO4) goes through a carbocation and is used industrially (ethanol from ethylene at 250 °C) but is harsh for the lab. Biological hydrations need an adjacent carbonyl (fumarate to malate). In the lab, oxymercuration–demercuration [Hg(OAc)2, H2O; then NaBH4] adds Hg2+ to form a mercurinium ion, water opens it, and NaBH4 replaces Hg with H, giving Markovnikov alcohols without rearrangement.", "learner_can_do": "Predict the alcohol from oxymercuration–demercuration of an alkene and identify which alkene gives a target Markovnikov alcohol."}, "8.5": {"title": "Hydration of Alkenes: Addition of H2O by Hydroboration", "pages": [252, 255], "summary": "Hydroboration–oxidation (BH3 in THF; then H2O2, OH−) gives non-Markovnikov, syn hydration. BH3 is a Lewis acid that adds its B–H across the double bond in one step, with no carbocation, B going to the less hindered carbon and H to the other from the same face; three alkenes add per BH3, and oxidation replaces each C–B with C–OH with retention. 1-Methylcyclopentene gives trans-2-methylcyclopentanol. It complements oxymercuration.", "learner_can_do": "Predict the regiochemistry and stereochemistry of hydroboration–oxidation and choose between the two hydration methods for a target alcohol."}, "8.6": {"title": "Reduction of Alkenes: Hydrogenation", "pages": [255, 258], "summary": "H2 with Pd/C or PtO2 (Adams' catalyst) reduces alkenes to alkanes. In organic chemistry, reduction means carbon gains electron density (bonds to H, or loses bonds to O/N/X). Hydrogenation is heterogeneous, happens on the catalyst surface, adds both H syn, and approaches from the less hindered face (α-pinene). Alkenes are reduced selectively over C=O, esters, nitriles, and aromatic rings. Partial hydrogenation of vegetable oils makes trans fats. Biological reductions use NADPH hydride addition next to a carbonyl, then protonation.", "learner_can_do": "Predict the stereochemistry of catalytic hydrogenation and which functional groups survive it."}, "8.7": {"title": "Oxidation of Alkenes: Epoxidation and Hydroxylation", "pages": [259, 261], "summary": "In organic chemistry, oxidation means carbon loses electron density. Peroxyacids (e.g., meta-chloroperoxybenzoic acid) transfer one O to an alkene in one syn step, giving an epoxide (oxirane). Halohydrins with base also form epoxides. Acid-catalyzed epoxide hydrolysis opens the ring anti to give trans-1,2-diols (glycols; ethylene glycol antifreeze). OsO4 hydroxylates directly with syn stereochemistry through a cyclic osmate, used catalytically with the co-oxidant NMO.", "learner_can_do": "Choose between epoxide hydrolysis (anti diol) and OsO4 (syn diol) to make a specific 1,2-diol stereoisomer."}, "8.8": {"title": "Oxidation of Alkenes: Cleavage to Carbonyl Compounds", "pages": [261, 263], "summary": "Strong oxidants cleave C=C. Ozone adds to give a molozonide that rearranges to an ozonide; reducing it with Zn/acetic acid gives two carbonyl compounds, each original alkene carbon now C=O (tetrasubstituted gives two ketones). KMnO4 in acid gives ketones, carboxylic acids (from C–H), or CO2 (from =CH2). Periodic acid cleaves 1,2-diols via a cyclic periodate; ring diols give one open-chain dicarbonyl.", "learner_can_do": "Predict ozonolysis or KMnO4 cleavage products and reconstruct the starting alkene from its cleavage fragments."}, "8.9": {"title": "Addition of Carbenes to Alkenes: Cyclopropane Synthesis", "pages": [263, 265], "summary": "Carbenes (R2C:) are neutral, divalent, six-electron carbons that act as electrophiles and add to alkenes in one step to make cyclopropanes. Dichlorocarbene forms from CHCl3 and KOH (deprotonation, then loss of Cl−); like a carbocation, it is sp2 with a vacant p orbital, plus a lone pair. The addition is stereospecific (cis alkene gives cis cyclopropane). The Simmons–Smith reaction (CH2I2, Zn–Cu) uses the carbenoid ICH2ZnI to make nonhalogenated cyclopropanes.", "learner_can_do": "Predict the stereospecific cyclopropane from carbene or Simmons–Smith addition to a cis or trans alkene."}, "8.10": {"title": "Radical Additions to Alkenes: Chain-Growth Polymers", "pages": [265, 268], "summary": "Polymers are built from repeating monomers. Chain-growth polymers like polyethylene (up to 200,000 units) form by radical chain reactions: initiation (benzoyl peroxide gives phenyl radicals that add to ethylene), propagation (radical adds to monomer after monomer), and termination (two radicals combine). Vinyl monomers polymerize with substituents on alternating carbons through the more substituted radical (polypropylene, polystyrene, PVC, Teflon, Plexiglas; Table 8.1).", "learner_can_do": "Draw a repeating segment of a polymer from its monomer, or identify the monomer(s) of a polymer segment."}, "8.11": {"title": "Biological Additions of Radicals to Alkenes", "pages": [269, 270], "summary": "Radical reactions are hard to control in the lab, but enzymes hold one substrate in place, so biological radical additions are common and controlled. Prostaglandin H2 biosynthesis from arachidonic acid runs H-abstraction, two radical additions to O2, and two radical additions to C=C bonds, all catalyzed by one enzyme.", "learner_can_do": "Follow a multistep biological radical pathway, identifying abstraction steps and radical additions to O2 and to C=C."}, "8.12": {"title": "Reaction Stereochemistry: Addition of H2O to an Achiral Alkene", "pages": [270, 271], "summary": "When achiral reactants create a new chirality center, the product is racemic: water adds to the planar, achiral carbocation from 1-butene equally from top and bottom through mirror-image transition states, giving (R)- and (S)-2-butanol 50:50. Optical activity can't come from nowhere. Enzymes, by holding a prochiral substrate in a chiral environment, give single enantiomers (aconitase adds water to the Re face of cis-aconitate).", "learner_can_do": "Predict whether a reaction product will be racemic, and explain how an enzyme can make one enantiomer from an achiral substrate."}, "8.13": {"title": "Reaction Stereochemistry: Addition of H2O to a Chiral Alkene", "pages": [272, 272], "summary": "A chiral reactant creating a new chirality center gives unequal amounts of diastereomers. Hydrating (R)-4-methyl-1-hexene keeps C4 as R and forms C2 through a chiral carbocation whose faces differ sterically, so (2R,4R) and (2S,4R)-4-methyl-2-hexanol form in unequal amounts and the mixture is optically active.", "learner_can_do": "Predict the stereoisomeric products and optical activity when a chiral (or racemic) alkene undergoes addition that makes a new chirality center."}, "8.chemistry-matters": {"title": "Chemistry Matters—Terpenes: Naturally Occurring Alkenes", "pages": [273, 274], "summary": "Essential oils are mostly terpenoids (over 60,000 known); hydrocarbon terpenoids are terpenes and contain double bonds (myrcene, α-pinene, humulene). By the isoprene rule they're built from head-to-tail 5-carbon isoprene units (monoterpenes C10, sesquiterpenes C15, diterpenes C20). Nature actually uses isopentenyl and dimethylallyl diphosphate; lanosterol is the steroid precursor.", "learner_can_do": null}, "8.key-terms": {"title": "Key Terms", "pages": [274, 274], "summary": "Glossary list of the 20 key terms introduced in Chapter 8.", "learner_can_do": null}, "8.summary": {"title": "Summary", "pages": [275, 275], "summary": "Chapter recap: eliminations make alkenes; HX, X2, HOX, oxymercuration, hydroboration, hydrogenation, epoxidation, OsO4, ozonolysis, KMnO4, HIO4, carbene, and Simmons–Smith reactions, each with characteristic regio- and stereochemistry; radical chain polymerization; and stereochemical outcomes of forming new chirality centers. The chapter ends with a Summary of Reactions table.", "learner_can_do": null}, "8.summary-of-reactions": {"title": "Summary of Reactions", "pages": [275, 277], "summary": "A reference list of alkene reactions with their regiochemistry and stereochemistry: HX (Markovnikov), X2 (anti), halohydrin (Markovnikov, anti), oxymercuration (Markovnikov), hydroboration (non-Markovnikov, syn), hydrogenation (syn), epoxidation (syn), OsO4 (syn), carbene additions, epoxide hydrolysis (anti), oxidative cleavage with O3 or KMnO4, and diol cleavage with HIO4.", "learner_can_do": null}, "8.problems": {"title": "Additional Problems", "pages": [277, 286], "summary": "Practice predicting products with full regio- and stereochemistry, choosing reagents for transformations, deducing alkene structures from ozonolysis/KMnO4 fragments and H2 uptake (α-terpinene, housefly pheromone), drawing polymer segments (Plexiglas, Saran), and proposing mechanisms for marine-algae halogenations.", "learner_can_do": null}, "9.why": {"title": "Why This Chapter?", "pages": [287, 288], "summary": "Alkynes are less common than alkenes; their real importance here is as a vehicle for learning organic synthesis, the planned construction of complex molecules. Acetylene is used for welding and acrylic polymers, and polyynes and carbyne are research topics.", "learner_can_do": null}, "9.1": {"title": "Naming Alkynes", "pages": [288, 288], "summary": "Alkynes use the suffix -yne, numbered from the end nearer the triple bond. Multiple triple bonds give diynes, triynes; compounds with both give enynes, numbered from the end nearer the first multiple bond, with double bonds getting lower numbers when there's a choice. Alkynyl substituents exist too.", "learner_can_do": "Name alkynes and enynes and draw the isomeric alkynes of a formula (e.g., the seven C6H10 alkynes)."}, "9.2": {"title": "Preparation of Alkynes: Elimination Reactions of Dihalides", "pages": [289, 289], "summary": "Excess strong base (KOH or NaNH2) removes two HX from a vicinal (1,2-) dihalide to give an alkyne, via a vinylic halide intermediate; vinylic halides alone also give alkynes. Combined with X2 addition, this converts an alkene into an alkyne (e.g., diphenylethylene to diphenylacetylene).", "learner_can_do": "Plan an alkene-to-alkyne conversion through halogenation and double dehydrohalogenation."}, "9.3": {"title": "Reactions of Alkynes: Addition of HX and X2", "pages": [289, 291], "summary": "Acetylene is linear (180°) with a 120 pm, ~965 kJ/mol C≡C made of one sp–sp σ and two p–p π bonds. Electrophiles add much as to alkenes: one equivalent of HX gives a vinylic halide, two give a geminal dihalide (1-hexyne + 2 HBr gives 2,2-dibromohexane), with Markovnikov regiochemistry and usually trans addition; X2 also adds trans. Vinylic carbocations (sp) form less readily than alkyl ones, so alkyne mechanisms are often more complex.", "learner_can_do": "Predict products of one or two equivalents of HX or X2 adding to an alkyne."}, "9.4": {"title": "Hydration of Alkynes", "pages": [291, 295], "summary": "HgSO4-catalyzed hydration (aqueous H2SO4) follows Markovnikov regiochemistry and gives an enol that immediately tautomerizes to a ketone (keto–enol tautomerism; tautomers interconvert by moving a hydrogen). Terminal alkynes give methyl ketones; unsymmetrical internal alkynes give mixtures. Hydroboration–oxidation of internal alkynes gives ketones; terminal alkynes need a bulky borane (disiamylborane) to stop double addition and give aldehydes, complementary to mercury hydration.", "learner_can_do": "Choose mercury(II) hydration or hydroboration–oxidation to turn a terminal alkyne into a methyl ketone or an aldehyde, and draw the enol-to-carbonyl tautomerization."}, "9.5": {"title": "Reduction of Alkynes", "pages": [295, 297], "summary": "H2 over Pd/C reduces alkynes completely to alkanes through an alkene. The deactivated Lindlar catalyst (Pd on CaCO3 with lead acetate and quinoline) stops at the alkene and adds H2 syn, giving cis alkenes (used in vitamin A synthesis). Lithium or sodium in liquid ammonia gives trans alkenes by a radical-anion mechanism: electron, proton, electron, proton, with the trans vinylic anion favored.", "learner_can_do": "Pick reagents to reduce an alkyne to an alkane, a cis alkene, or a trans alkene."}, "9.6": {"title": "Oxidative Cleavage of Alkynes", "pages": [297, 298], "summary": "Ozone or KMnO4 cleaves alkynes, giving carboxylic acids from internal alkynes and CO2 from a terminal carbon; yields are often low and the reaction is mainly of note for completeness.", "learner_can_do": "Predict alkyne oxidative cleavage products and deduce an alkyne from them."}, "9.7": {"title": "Alkyne Acidity: Formation of Acetylide Anions", "pages": [298, 299], "summary": "Terminal alkynes are relatively acidic: acetylene pKa 25 vs. ethylene 44 and methane 60 (Table 9.1). Amide ion (NH2−, conjugate base of NH3, pKa 35) deprotonates them to acetylide anions. The acetylide's lone pair is in an sp orbital (50% s character), held closer to the nucleus and more stabilized than sp2 (33%) or sp3 (25%) anions.", "learner_can_do": "Use pKa values to choose a base strong enough to deprotonate a terminal alkyne (or other weak acid), and explain the s-character trend."}, "9.8": {"title": "Alkylation of Acetylide Anions", "pages": [299, 301], "summary": "Acetylide anions are strong nucleophiles that displace halide from alkyl halides, forming a new C–C bond (alkylation), e.g., acetylide + CH3Br gives propyne; hex-1-yne + NaNH2 then 1-bromobutane gives dec-5-yne. Acetylene can be alkylated to terminal alkynes and again to internal alkynes. Only primary bromides and iodides work; secondary and tertiary halides undergo elimination instead.", "learner_can_do": "Choose the terminal alkyne and primary alkyl halide that build a target internal alkyne, avoiding secondary/tertiary halides."}, "9.9": {"title": "An Introduction to Organic Synthesis", "pages": [301, 304], "summary": "Planning a synthesis requires knowing each reaction's uses and limits and making each step change only what's intended. The key strategy is retrosynthetic: start at the product and ask what its immediate precursor was, stepping back to the starting material. Worked examples: cis-2-hexene from 1-pentyne (alkylate with CH3I, then Lindlar); 2-bromopentane from acetylene (alkylate, Lindlar, Markovnikov HBr); 5-methyl-1-hexanol (alkylate, Lindlar, hydroboration–oxidation).", "learner_can_do": "Design a short multistep synthesis of a target from given starting materials by working backward one step at a time."}, "9.chemistry-matters": {"title": "Chemistry Matters—The Art of Organic Synthesis", "pages": [305, 306], "summary": "Woodward and Eschenmoser's total synthesis of vitamin B12 (1973) took 100+ researchers over a decade. Complex syntheses are done for the challenge, to make scarce compounds like Taxol, and because failures lead to new chemistry; the B12 work led to understanding pericyclic reactions.", "learner_can_do": null}, "9.key-terms": {"title": "Key Terms", "pages": [306, 306], "summary": "Glossary list of the 7 key terms introduced in Chapter 9.", "learner_can_do": null}, "9.summary": {"title": "Summary", "pages": [306, 306], "summary": "Chapter recap: alkyne structure and preparation (double elimination, acetylide alkylation), electrophilic additions, hydration to ketones/aldehydes via enols, reductions to alkanes or cis/trans alkenes, acetylide acidity, and retrosynthetic planning. Includes a Summary of Reactions table.", "learner_can_do": null}, "9.summary-of-reactions": {"title": "Summary of Reactions", "pages": [307, 308], "summary": "A reference list: alkyne preparation by dehydrohalogenation of vicinal dihalides and acetylide alkylation; reactions with HX and X2; Hg2+-catalyzed hydration and hydroboration–oxidation; catalytic hydrogenation (Pd or Lindlar) and Li/NH3 reduction; conversion to acetylide anions.", "learner_can_do": null}, "9.problems": {"title": "Additional Problems", "pages": [308, 316], "summary": "Practice naming alkynes and enynes, predicting products with many reagents, drawing tautomerization and dissolving-metal mechanisms, deducing structures from H2 uptake and cleavage products (erythrogenic acid), and planning multistep syntheses from acetylene and small alkyl halides (muscalure, deuterium labeling, cis/trans inversion).", "learner_can_do": null}, "10.why": {"title": "Why This Chapter?", "pages": [317, 318], "summary": "Alkyl halides are rare in terrestrial biochemistry, but their substitution and elimination reactions are simple models for many biological reactions. More than 5000 organohalides occur naturally (marine organisms, kelp, volcanoes), and others are solvents, anesthetics, refrigerants, pesticides, and sweeteners (sucralose).", "learner_can_do": null}, "10.1": {"title": "Names and Structures of Alkyl Halides", "pages": [318, 320], "summary": "Haloalkanes are named with the halogen as a substituent: the longest chain (containing any multiple bond) is the parent, numbered from the end nearer the first substituent of any kind; different halogens are listed alphabetically, and ties go to alphabetical precedence. Common names like methyl iodide exist. Down the halogen group, C–X bonds get longer and weaker (CH3F 139 pm/460 kJ/mol to CH3I 214 pm/239 kJ/mol). C–X is polar, so the carbon is an electrophile.", "learner_can_do": "Name alkyl halides and draw them from names, and rank C–X bonds by length and strength."}, "10.2": {"title": "Preparing Alkyl Halides from Alkanes: Radical Halogenation", "pages": [320, 322], "summary": "Radical halogenation (Cl2 or Br2 with UV light) proceeds by initiation, two propagation steps, and termination, but gives mixtures: methane chlorinates to CH3Cl through CCl4, and butane gives 1- and 2-chlorobutane 30:70. Per hydrogen, secondary C–H reacts 3.5× and tertiary 5× faster than primary toward chlorination, matching weaker bond dissociation energies (3° 400 < 2° 410 < 1° 421 kJ/mol) and more stable radicals.", "learner_can_do": "List all monohalogenation products of an alkane and estimate their percentages from the number and type of hydrogens and their relative reactivities."}, "10.3": {"title": "Preparing Alkyl Halides from Alkenes: Allylic Bromination", "pages": [322, 323], "summary": "N-Bromosuccinimide (NBS) with light substitutes Br for H at the allylic position (next to a C=C), e.g., cyclohexene to 3-bromocyclohexene. It's a radical chain: Br· abstracts an allylic H, HBr reacts with NBS to make Br2, and Br2 brominates the allylic radical. Allylic C–H bonds are weak (about 370 kJ/mol), so allylic radicals are about 40 kJ/mol more stable than comparable alkyl radicals.", "learner_can_do": "Identify allylic positions and predict NBS bromination products."}, "10.4": {"title": "Stability of the Allyl Radical: Resonance Revisited", "pages": [323, 326], "summary": "The allyl radical is sp2 and electronically symmetric, so its unpaired electron is delocalized over both end carbons (two resonance forms; spin density shared equally), making it extra stable. As a result, allylic bromination of an unsymmetrical alkene can give mixtures (1-octene gives 3-bromo-1-octene and 1-bromo-2-octene, favoring reaction at the less hindered end). Allylic bromides can be dehydrohalogenated to dienes.", "learner_can_do": "Draw resonance forms of allylic radicals and predict all allylic bromination products, including those from the radical's other end."}, "10.5": {"title": "Preparing Alkyl Halides from Alcohols", "pages": [326, 327], "summary": "Alcohols are the most general source of alkyl halides. HCl, HBr, or HI works well for tertiary alcohols (fast, even with HX gas in cold ether) but slowly for primary and secondary. Primary and secondary alcohols are better converted with SOCl2 (chlorides) or PBr3 (bromides) under mild, less acidic conditions that avoid rearrangements and spare other groups. Alkyl fluorides come from (CH3CH2)2NSF3 or HF in pyridine.", "learner_can_do": "Choose the right reagent (HX, SOCl2, PBr3, HF–pyridine) to convert a given alcohol into a target alkyl halide."}, "10.6": {"title": "Reactions of Alkyl Halides: Grignard Reagents", "pages": [327, 328], "summary": "Alkyl, vinylic, and aryl halides (Cl, Br, I) react with Mg in ether or THF to give Grignard reagents, RMgX—organometallic compounds with a polarized C–Mg bond that makes carbon nucleophilic and strongly basic. A Grignard is formally a carbanion salt of a very weak carbon acid (pKa 44–60), so water destroys it (R–MgX + H2O gives R–H).", "learner_can_do": "Form a Grignard reagent from an alkyl halide and predict when it will be protonated by an acidic compound (e.g., water, acetylene, NH3), including deuterium labeling with D2O."}, "10.7": {"title": "Organometallic Coupling Reactions", "pages": [328, 330], "summary": "Alkyl halides plus lithium give alkyllithiums (RLi); with CuI they form Gilman reagents (R2CuLi), which couple with alkyl, vinylic, and aryl chlorides, bromides, and iodides to form new C–C bonds (e.g., lithium dimethylcopper + 1-iododecane gives undecane; commercial muscalure synthesis). The Suzuki–Miyaura reaction couples aryl or vinyl boronic acids with aryl or vinyl halides using base and a catalytic palladium cycle, making biaryls such as the drug valsartan.", "learner_can_do": "Choose a Gilman or Suzuki–Miyaura coupling and the two partners needed to build a target C–C bond."}, "10.8": {"title": "Oxidation and Reduction in Organic Chemistry", "pages": [330, 332], "summary": "Organic oxidation is loss of electron density at carbon (forming C–O, C–N, C–X bonds or breaking C–H); reduction is the reverse. Methane chlorination is an oxidation; converting an alkyl halide to an alkane through a Grignard is a reduction; HBr addition to an alkene is neither. Compounds with the same number of carbons can be ranked by (C–O + C–N + C–X bonds) minus C–H bonds, from alkanes (lowest) to CO2 (highest).", "learner_can_do": "Rank compounds by oxidation level and classify a reaction as oxidation, reduction, or neither."}, "10.chemistry-matters": {"title": "Chemistry Matters—Naturally Occurring Organohalides", "pages": [333, 334], "summary": "Thought to be industrial pollutants in 1980, organohalides are now known to occur naturally in over 5000 forms (chloromethane, halomon, vancomycin), often in huge amounts from kelp, fires, volcanoes, termites, and acorn worms. Organisms use them for defense, and the human immune system halogenates pathogens.", "learner_can_do": null}, "10.key-terms": {"title": "Key Terms", "pages": [334, 334], "summary": "Glossary list of the 8 key terms introduced in Chapter 10.", "learner_can_do": null}, "10.summary": {"title": "Summary", "pages": [334, 334], "summary": "Chapter recap: naming alkyl halides; radical halogenation and its selectivity; allylic bromination with NBS through resonance-stabilized allyl radicals; alkyl halides from alcohols; Grignard, organolithium, and Gilman reagents; coupling reactions; and oxidation/reduction levels. Includes a Summary of Reactions table.", "learner_can_do": null}, "10.summary-of-reactions": {"title": "Summary of Reactions", "pages": [334, 335], "summary": "A reference list: alkyl halides from alkenes by NBS allylic bromination and from alcohols with HX, SOCl2, PBr3, or HF–pyridine; formation of Grignard and Gilman reagents; diorganocopper coupling and palladium-catalyzed Suzuki–Miyaura coupling.", "learner_can_do": null}, "10.problems": {"title": "Additional Problems", "pages": [335, 340], "summary": "Practice naming alkyl halides, predicting radical and NBS bromination products and percentages, planning syntheses from cyclopentene, spotting flawed syntheses (Grignards from bromo alcohols), ranking radical stabilities and oxidation levels, and designing Suzuki–Miyaura couplings.", "learner_can_do": null}, "11.why": {"title": "Why This Chapter?", "pages": [341, 342], "summary": "Nucleophilic substitution and base-induced elimination are among the most common and versatile reactions in the lab and in biology. Alkyl halides are electrophiles, so a nucleophile/base either substitutes for X or eliminates HX to make an alkene.", "learner_can_do": null}, "11.1": {"title": "The Discovery of Nucleophilic Substitution Reactions", "pages": [342, 344], "summary": "Walden (1896) interconverted (+)- and (−)-malic acid through substitution steps, proving some steps invert configuration. Later studies with tosylates (which behave like halides) located the inversion in the substitution step itself: nucleophilic substitution of primary and secondary alkyl halides or tosylates always proceeds with inversion. Tosylate formation and ester cleavage don't break the C–O bond at the chirality center, so they keep configuration.", "learner_can_do": "Predict the product configuration of a substitution on a primary or secondary chiral halide assuming inversion, and locate the inverting step in a reaction cycle."}, "11.2": {"title": "The SN2 Reaction", "pages": [344, 346], "summary": "Kinetics show CH3Br + HO− has rate = k[RX][Nu] (second-order). Hughes and Ingold's SN2 mechanism (substitution, nucleophilic, bimolecular) is a single step: the nucleophile attacks from 180° opposite the leaving group, passing through a transition state with partial Nu–C and C–X bonds and three planar substituents, inverting configuration like an umbrella in the wind ((S)-2-bromobutane + HO− gives (R)-2-butanol).", "learner_can_do": "Write the SN2 rate law and draw the backside-attack mechanism and inverted product."}, "11.3": {"title": "Characteristics of the SN2 Reaction", "pages": [346, 352], "summary": "SN2 rate depends on ΔG‡. Substrate: steric hindrance slows attack, so methyl > primary > secondary >> tertiary (no SN2); neopentyl is very slow, and vinylic/aryl halides don't react. Nucleophile: rates span 10^5 (Table 11.1); nucleophilicity parallels basicity for the same atom, increases down a group (HS− > HO−, I− > Br− > Cl−), and anions beat neutrals. Leaving group: weak bases leave best (tosylate, I−, Br−, Cl−); F−, HO−, RO−, H2N− don't, so alcohols must be activated (tosylates, SOCl2, PBr3), though strained epoxides open. Solvent: protic solvents cage and slow nucleophiles; polar aprotic solvents (CH3CN, DMF, DMSO, HMPA) speed SN2 enormously.", "learner_can_do": "Rank SN2 reaction rates by substrate, nucleophile, leaving group, and solvent, and convert a poor leaving group (–OH) into a good one."}, "11.4": {"title": "The SN1 Reaction", "pages": [352, 356], "summary": "Tertiary halides react with water a million times faster than CH3Br, with rate = k[RX] only (first-order). The SN1 mechanism (unimolecular): slow, rate-limiting dissociation to a planar carbocation, then fast capture by the nucleophile. Because the cation is achiral, an enantiopure substrate gives mostly racemic product, usually with a small excess of inversion because the departing anion briefly shields one face as an ion pair (Winstein).", "learner_can_do": "Write the SN1 rate law, identify the rate-limiting step, and predict the stereochemistry (racemization with slight inversion) of an SN1 product."}, "11.5": {"title": "Characteristics of the SN1 Reaction", "pages": [356, 360], "summary": "By the Hammond postulate, whatever stabilizes the carbocation speeds SN1. Substrate: 3° > 2° and resonance-stabilized allylic and benzylic cations (a primary allylic/benzylic cation is about as stable as a secondary alkyl one). Leaving group: same order as SN2; under acid, protonated alcohols lose neutral water, which is why HX converts tertiary alcohols to halides. Nucleophile: no effect on rate (neutral ones work fine) but should be nonbasic to avoid elimination. Solvent: polar protic solvents stabilize the cation and transition state (water is 10^5 faster than ethanol).", "learner_can_do": "Rank substrates by SN1 reactivity and decide whether a given substitution is SN1 or SN2 from substrate, leaving group, nucleophile, and solvent."}, "11.6": {"title": "Biological Substitution Reactions", "pages": [360, 362], "summary": "Biological substitutions usually use organodiphosphates, with diphosphate (PPi), aided by Mg2+, as the biological equivalent of a halide leaving group. Geraniol biosynthesis involves two SN1 reactions of allylic diphosphates (dimethylallyl and geranyl). Biological methylations are SN2 reactions with S-adenosylmethionine (SAM) as a biological CH3Cl, e.g., norepinephrine to epinephrine.", "learner_can_do": "Identify the leaving group and SN1 vs. SN2 character of a biological substitution such as terpene coupling or SAM methylation."}, "11.7": {"title": "Elimination Reactions: Zaitsev’s Rule", "pages": [362, 364], "summary": "A nucleophile/base can instead remove a neighboring H and eliminate HX. Eliminations usually give mixtures; Zaitsev's rule says the more highly substituted (more stable) alkene predominates. Three mechanisms differ in timing: E1 (C–X breaks first, carbocation), E2 (C–H and C–X break together), and E1cB (C–H breaks first, carbanion), the last dominant in biology.", "learner_can_do": "List all possible alkene products from an elimination and identify the Zaitsev major product."}, "11.8": {"title": "The E2 Reaction and the Deuterium Isotope Effect", "pages": [364, 367], "summary": "E2 (bimolecular) occurs with strong bases (HO−, RO−) in one step with rate = k[RX][Base]. A deuterium isotope effect (C–H breaks 7.11× faster than C–D) shows C–H breaks in the rate-limiting step. E2 requires periplanar geometry (H, two C's, and X in one plane), strongly preferring anti periplanar (staggered) over syn periplanar (eclipsed), so stereochemistry is specific: meso-1,2-dibromo-1,2-diphenylethane gives only the E alkene.", "learner_can_do": "Draw the anti-periplanar conformation (Newman projection) of an E2 substrate and predict the E/Z geometry of the alkene formed."}, "11.9": {"title": "The E2 Reaction and Cyclohexane Conformation", "pages": [367, 369], "summary": "In cyclohexanes, anti periplanar means the H and leaving group must both be axial (trans-diaxial), and this overrides Zaitsev's rule. Neomenthyl chloride (axial Cl) eliminates 200× faster than menthyl chloride and gives Zaitsev 3-menthene; menthyl chloride must ring-flip so all groups are axial and gives non-Zaitsev 2-menthene. Conformation controls the chemistry.", "learner_can_do": "Predict E2 rate and product in substituted cyclohexanes by finding trans-diaxial H/leaving-group pairs in each chair."}, "11.10": {"title": "The E1 and E1cB Reactions", "pages": [369, 370], "summary": "E1 (unimolecular) shares SN1's rate-limiting carbocation formation, then loses a proton; SN1 and E1 compete under protic, nonbasic conditions (2-chloro-2-methylpropane in 80% ethanol gives 64:36 alcohol:alkene). E1 shows first-order kinetics, no deuterium isotope effect, no geometric requirement, and gives Zaitsev products (menthyl chloride gives mainly 3-menthene under E1). E1cB removes the proton first to form a carbanion, then expels the leaving group; it's favored for poor leaving groups like –OH two carbons from a carbonyl, which acidifies the adjacent H.", "learner_can_do": "Distinguish E1, E2, and E1cB by kinetics, isotope effects, and stereochemical requirements, and predict E1 product mixtures."}, "11.11": {"title": "Biological Elimination Reactions", "pages": [370, 371], "summary": "All three eliminations occur biologically, but E1cB is especially common, typically dehydrating 3-hydroxy carbonyl compounds to unsaturated carbonyl compounds (3-hydroxybutyryl thioester to crotonyl thioester in fat biosynthesis), with an enzyme histidine as the base and simultaneous protonation of the leaving –OH.", "learner_can_do": "Recognize an E1cB dehydration in a biological pathway and identify the acidic H and leaving group."}, "11.12": {"title": "A Summary of Reactivity: SN1, SN2, E1, E1cB, and E2", "pages": [371, 372], "summary": "Rules of thumb: primary halides give SN2 with good nucleophiles, E2 with strong hindered bases, E1cB if the leaving group is β to a carbonyl. Secondary halides give SN2 with weakly basic nucleophiles in polar aprotic solvents, E2 with strong bases, and (if allylic/benzylic) SN1/E1 with weak nucleophiles in protic solvents. Tertiary halides give E2 with bases and SN1+E1 under neutral conditions (ethanol or water).", "learner_can_do": "Classify any reaction as SN1, SN2, E1, E1cB, or E2 from its conditions and predict the product."}, "11.chemistry-matters": {"title": "Chemistry Matters—Green Chemistry", "pages": [373, 374], "summary": "Green chemistry designs products and processes to reduce waste and hazards, guided by 12 principles (prevent waste, maximize atom economy, safer reagents and solvents, energy efficiency, renewable feedstocks, catalysis, degradability, real-time monitoring, accident prevention). A three-step catalytic ibuprofen process cuts waste by about 99%.", "learner_can_do": null}, "11.key-terms": {"title": "Key Terms", "pages": [374, 374], "summary": "Glossary list of the 23 key terms introduced in Chapter 11.", "learner_can_do": null}, "11.summary": {"title": "Summary", "pages": [374, 375], "summary": "Chapter recap: SN2 (backside attack, inversion, second-order, steric control), SN1 (carbocation, racemization, first-order, cation stability), biological substitutions with diphosphate and SAM, Zaitsev's rule, E2 (anti periplanar, isotope effect, trans-diaxial), E1, E1cB, and a reactivity summary by substrate type. Includes a Summary of Reactions table.", "learner_can_do": null}, "11.summary-of-reactions": {"title": "Summary of Reactions", "pages": [375, 375], "summary": "A reference list: SN1 reactions of tertiary, allylic, and benzylic halides; SN2 reactions of primary and simple secondary halides; and E1, E1cB, and E2 eliminations.", "learner_can_do": null}, "11.problems": {"title": "Additional Problems", "pages": [375, 384], "summary": "Practice predicting SN1/SN2/E1/E2/E1cB outcomes with stereochemistry, ranking nucleophiles, substrates, and solvents, analyzing rate-law changes, explaining Walden cycles, isotope effects, trans-diaxial eliminations (hexachlorocyclohexane isomers, menthyl chlorides), biological mechanisms (urea cycle, methionine methylation), and the Hofmann elimination.", "learner_can_do": null}, "12.why": {"title": "Why This Chapter?", "pages": [385, 386], "summary": "Determining structures of new molecules is central to chemistry. Four techniques are covered across chapters: MS (size and formula), IR (functional groups), UV (conjugated π systems), and NMR (carbon–hydrogen framework).", "learner_can_do": null}, "12.1": {"title": "Mass Spectrometry of Small Molecules: Magnetic-Sector Instruments", "pages": [386, 388], "summary": "Mass spectrometers have an ionization source, a mass analyzer, and a detector. In electron-impact magnetic-sector instruments, ~70 eV electrons knock out an electron to make a cation radical, which often fragments; a magnetic field sorts charged fragments by m/z (usually z = 1). Quadrupole analyzers pass only one m/z at a time. Spectra plot relative abundance vs. m/z; the tallest peak is the base peak and the unfragmented ion is the molecular ion (parent peak, M+). Propane shows M+ = 44 and base peak 29.", "learner_can_do": "Identify the molecular ion and base peak in a mass spectrum and explain how ions are formed and sorted."}, "12.2": {"title": "Interpreting Mass Spectra", "pages": [388, 391], "summary": "MS gives molecular weight (hexane 86, 1-hexene 84, 1-hexyne 82), and high-resolution (double-focusing) instruments give exact masses to ~0.0005 amu that distinguish formulas (C5H12 72.0939 vs. C4H8O 72.0575). Some compounds (2,2-dimethylpropane) show no M+. Small M+1 peaks arise from 13C (1.10%) and 2H. Spectra act as fingerprints, and fragments keep the charge on the more stable cation (tert-butyl, m/z 57). Hexane shows losses of CH3, C2H5, C3H7, C4H9 (m/z 71, 57, 43, 29); methylcyclohexane and ethylcyclopentane are told apart by loss of 15 vs. 29.", "learner_can_do": "Propose molecular formulas from M+ or exact mass, and explain major fragment peaks as losses of alkyl radicals."}, "12.3": {"title": "Mass Spectrometry of Some Common Functional Groups", "pages": [391, 396], "summary": "Functional-group fragmentations: alcohols undergo α cleavage (C–C next to OH breaks, giving an oxygen-stabilized cation) and dehydration (loss of 18). The nitrogen rule: an odd number of nitrogens gives an odd M+. Amines undergo α cleavage (triethylamine base peak 86). Chlorine gives M and M+2 in a 3:1 ratio and bromine nearly 1:1. Ketones and aldehydes show α cleavage to acyl cations and the McLafferty rearrangement (γ-H transfers to O, loss of a neutral alkene), as in butyrophenone (m/z 105 and 120).", "learner_can_do": "Predict the m/z values of α-cleavage, dehydration, and McLafferty fragments, use the nitrogen rule, and recognize Cl/Br isotope patterns."}, "12.4": {"title": "Mass Spectrometry in Biological Chemistry: Time-of-Flight (TOF) Instruments", "pages": [396, 397], "summary": "Biological samples use soft ionization—electrospray ionization (ESI) or matrix-assisted laser desorption ionization (MALDI)—to make protonated ions (M + Hn)n+ with little fragmentation, analyzed by time-of-flight (TOF): ions get the same kinetic energy, so lighter ones fly faster down a drift tube. TOF handles proteins up to ~100 kDa with 3 ppm accuracy (lysozyme 14,306.7578 Da).", "learner_can_do": "Explain why soft ionization and TOF are used for biomolecules and how flight time relates to mass."}, "12.5": {"title": "Spectroscopy and the Electromagnetic Spectrum", "p
