of the page, a dashed bond receding behind it, and a solid wedge projecting toward the viewer.", "section": "1.4"}, {"file": "book_contents/figures/ch01/fig-1.8.png", "label": "Figure 1.8", "caption": "FIGURE 1.8 The cylindrical symmetry of the H–H σ bond in an H2 molecule. The intersection of a plane cutting through the σ bond is a circle.", "desc": "A pink, elongated H–H bonding region surrounds two hydrogen nuclei, with a vertical plane cutting through it to show a circular cross-section. The drawing illustrates the cylindrical symmetry of the σ bond in an H₂ molecule.", "section": "1.5"}, {"file": "book_contents/figures/ch01/fig-1.9.png", "label": "Figure 1.9", "caption": "FIGURE 1.9 Relative energy levels of two H atoms and the H2 molecule. The H2 molecule has 436 kJ/mol (104 kcal/mol) less energy than the two separate H atoms, so 436 kJ/mol of energy is released when the H–H bond forms. ", "desc": "An energy diagram places two separate hydrogen atoms above an H₂ molecule, with electron arrows on their respective energy levels. The 436 kJ/mol difference is marked as energy released when the bond forms and absorbed when it breaks.", "section": "1.5"}]}, {"id": "2", "title": "Polar Covalent Bonds; Acids and Bases", "pages": [37, 70], "summary": "Explains why molecules react by looking at how electrons are distributed: electronegativity makes bonds polar, polar bonds and lone pairs make molecules polar, formal charges track electron ownership, resonance spreads π and lone-pair electrons over several atoms, and acid–base behavior (Brønsted–Lowry and Lewis) follows from where electrons sit. Curved arrows are introduced as the notation for electron flow.", "learner_can_do": "Predict bond and molecular polarity, assign formal charges, draw valid resonance forms with curved arrows, and use pKa values to predict which way an acid–base reaction goes.", "game_hook": "Electrons are a visible currency that flows along curved arrows; the player moves electron pairs to stabilize charge, pass protons from stronger to weaker acids, and spread charge by resonance.", "figure_count": 139, "figures": [{"file": "book_contents/figures/ch02/fig-2.2.png", "label": "Figure 2.2", "caption": "FIGURE 2.2 The continuum in bonding from covalent to ionic is a result of an unequal distribution of bonding electrons between atoms. The symbol δ (lowercase Greek letter delta) means partial charge, either partial posit", "desc": "Three electron-cloud drawings compare a covalent X–X bond with evenly shared electrons, a polar covalent X–Y bond with δ+ on X and δ− on Y, and separated X+ and Y− ions. An arrow labeled “Ionic character” increases from left to right, showing the continuum from covalent to ionic bonding.", "section": "2.1"}, {"file": "book_contents/figures/ch02/fig-2.3.png", "label": "Figure 2.3", "caption": "FIGURE 2.3 Electronegativity values and trends. Electronegativity generally increases from left to right across the periodic table and decreases from top to bottom. The values are on an arbitrary scale, with F = 4.0 and ", "desc": "A color-coded periodic table lists electronegativity values for elements, ranging from Cs at 0.7 to F at 4.0. The colors illustrate the general increase from left to right and decrease from top to bottom.", "section": "2.1"}, {"file": "book_contents/figures/ch02/fig-2.4.png", "label": "Figure 2.4", "caption": "FIGURE 2.4 Polar covalent bonds. (a) Methanol, CH3OH, has a polar covalent C–O bond, and (b) methyllithium, CH3Li, has a polar covalent C–Li bond. The computer-generated representations, called electrostatic potential ma", "desc": "Two panels compare methanol’s C–O bond and methyllithium’s C–Li bond using ball-and-stick models, colored electrostatic potential maps, and structures marked with partial charges. Methanol shows δ− on oxygen and δ+ on carbon (electronegativity difference 1.0); methyllithium shows δ− on carbon and δ+ on lithium (difference 1.5).", "section": "2.1"}, {"file": "book_contents/figures/ch02/fig-2.5.png", "label": "Figure 2.5", "caption": "FIGURE 2.5 Electrostatic potential maps of the conjugate bases of (a) methanol, (b) acetic acid, and (c) acetone. The electronegative oxygen atoms stabilize the negative charge in all three.", "desc": "Three side-by-side electrostatic potential maps show the conjugate bases of methanol, acetic acid, and acetone, with their structural formulas underneath. Red regions around the oxygen atoms indicate substantial negative charge.", "section": "2.10"}, {"file": "book_contents/figures/ch02/fig-2.6.png", "label": "Figure 2.6", "caption": "FIGURE 2.6 The reaction of boron trifluoride, a Lewis acid, with dimethyl ether, a Lewis base. The Lewis acid accepts a pair of electrons, and the Lewis base donates a pair of nonbonding electrons. Note how the movement ", "desc": "Electrostatic potential models and structural drawings show boron trifluoride reacting with dimethyl ether to form an acid–base complex. A curved arrow shows an oxygen lone pair moving toward boron; in the product map, boron is redder and oxygen bluer.", "section": "2.11"}, {"file": "book_contents/figures/ch02/fig-2.7.png", "label": "Figure 2.7", "caption": "FIGURE 2.7 Dipole–dipole forces cause polar molecules (a) to attract one another when they orient with unlike charges together, but (b) to repel one another when they orient with like charges together.", "desc": "Two panels depict polar molecules as pink-to-blue ovals marked δ− and δ+. In (a), they line up with opposite partial charges adjacent, illustrating attraction; in (b), their orientations place like charges near one another, illustrating repulsion.", "section": "2.12"}, {"file": "book_contents/figures/ch02/fig-2.8.png", "label": "Figure 2.8", "caption": "FIGURE 2.8 Attractive dispersion forces in nonpolar molecules are caused by temporary dipoles, as shown in these models of pentane, C5H12.", "desc": "Four space-filling models of pentane are arranged side by side, each with blue δ+ labels on the left and pink δ− labels on the right. The aligned temporary dipoles illustrate attractive dispersion forces between nonpolar molecules.", "section": "2.12"}]}, {"id": "3", "title": "Organic Compounds: Alkanes and Their Stereochemistry", "pages": [71, 104], "summary": "Introduces functional groups, the reactive units that sort 195 million compounds into a few dozen predictable families, then uses alkanes to teach isomerism, alkyl groups, IUPAC naming, physical properties, and the first look at 3D shape: rotation about C–C single bonds and the energy cost of eclipsed and gauche conformations.", "learner_can_do": "Identify functional groups in a molecule, draw and name constitutional isomers and branched alkanes by IUPAC rules, and draw Newman projections to rank alkane conformations by strain energy.", "game_hook": "Players name molecules by tracing the longest chain through a branching maze, and twist C–C bonds on a Newman-projection dial to find energy valleys (staggered, anti) and avoid peaks (eclipsed).", "figure_count": 122, "figures": [{"file": "book_contents/figures/ch03/fig-3.2.png", "label": "Figure 3.2", "caption": "FIGURE 3.2 The reactions of ethylene and menthene with bromine. In both molecules, the carbon–carbon double-bond functional group has a similar polarity pattern, so both molecules react with Br2 in the same way. The size", "desc": "Side-by-side reactions show ethylene and the larger ring molecule menthene each reacting with Br₂: bromine adds across the highlighted carbon–carbon double bond, leaving one Br on each formerly double-bonded carbon. Molecular surface models and arrows emphasize that the same functional group reacts similarly in both molecules.", "section": "3.1"}, {"file": "book_contents/figures/ch03/fig-3.3.png", "label": "Figure 3.3", "caption": "FIGURE 3.3 Some representations of butane, C4H10. The molecule is the same regardless of how it’s drawn. These structures imply only that butane has a continuous chain of four carbon atoms; they do not imply any specific", "desc": "The figure shows five representations of butane: two structures with every carbon and hydrogen shown, and three condensed formulas. They illustrate the same continuous four-carbon chain drawn in different ways, without specifying its geometry.", "section": "3.2"}, {"file": "book_contents/figures/ch03/fig-3.4.png", "label": "Figure 3.4", "caption": "FIGURE 3.4 Alkyl groups generated from straight-chain alkanes.", "desc": "Ball-and-stick models and condensed formulas compare propane with propyl and isopropyl, and butane and isobutane with four butyl groups. Pink zigzag marks show the attachment points of the alkyl groups.", "section": "3.3"}, {"file": "book_contents/figures/ch03/fig-3.5.png", "label": "Figure 3.5", "caption": "FIGURE 3.5 A plot of melting and boiling points versus number of carbon atoms for the C1–C14 straight-chain alkanes. There is a regular increase with molecular size.", "desc": "A bar chart plots melting points (blue) and boiling points (magenta) against the number of carbon atoms from 1 to 14 for straight-chain alkanes. Both temperatures generally rise as the carbon count increases, with boiling points higher than melting points throughout.", "section": "3.5"}, {"file": "book_contents/figures/ch03/fig-3.6.png", "label": "Figure 3.6", "caption": "FIGURE 3.6 Rotation occurs around the carbon–carbon single bond in ethane because of σ bond cylindrical symmetry.", "desc": "Structural drawings and ball-and-stick models show ethane before and after rotation around its carbon–carbon single bond. A “Rotate” arrow and curved arrows indicate that the hydrogen atoms change their relative positions.", "section": "3.6"}, {"file": "book_contents/figures/ch03/fig-3.7.png", "label": "Figure 3.7", "caption": "FIGURE 3.7 A sawhorse representation and a Newman projection of ethane. The sawhorse representation views the molecule from an oblique angle, while the Newman projection views the molecule end-on. Note that the molecular", "desc": "Side-by-side ball-and-stick models and drawings show ethane as an oblique sawhorse representation and an end-on Newman projection. In the Newman projection, the front carbon and its three green hydrogens appear in front of the back carbon and its three red hydrogens.", "section": "3.6"}, {"file": "book_contents/figures/ch03/fig-3.8.png", "label": "Figure 3.8", "caption": "FIGURE 3.8 A graph of potential energy versus bond rotation in ethane. The staggered conformations are 12 kJ/mol lower in energy than the eclipsed conformations.", "desc": "A graph of ethane’s potential energy versus bond rotation shows repeating peaks at eclipsed conformations and valleys at staggered conformations, with Newman projections beneath the curve. A vertical arrow marks the eclipsed conformations as 12 kJ/mol higher in energy.", "section": "3.6"}, {"file": "book_contents/figures/ch03/fig-3.9.png", "label": "Figure 3.9", "caption": "FIGURE 3.9 Newman projections of propane showing staggered and eclipsed conformations. The staggered conformer is lower in energy by 14 kJ/mol.", "desc": "Newman projections and ball-and-stick models show staggered propane becoming eclipsed propane when the rear carbon rotates 60°. The eclipsed view marks one 6.0 kJ/mol CH₃–H interaction and two 4.0 kJ/mol H–H interactions; the caption says the staggered conformer is lower in energy by 14 kJ/mol.", "section": "3.7"}]}, {"id": "4", "title": "Organic Compounds: Cycloalkanes and Their Stereochemistry", "pages": [105, 134], "summary": "Rings restrict rotation, which creates cis–trans stereoisomers and ring strain. The chapter measures strain from heats of combustion, explains why only cyclohexane is strain-free (the chair conformation), and develops conformational analysis: axial vs. equatorial positions, ring-flips, 1,3-diaxial interactions, and how to pick the more stable chair for substituted and fused rings.", "learner_can_do": "Name substituted cycloalkanes with cis/trans prefixes, draw both chair conformations of a substituted cyclohexane, label each group axial or equatorial, and use 1,3-diaxial strain values to decide which chair is favored and by how much.", "game_hook": "A cyclohexane chair the player can ring-flip; every flip swaps axial and equatorial seats, and bulky groups take a strain penalty when forced into axial seats, so the player must seat substituents to minimize strain.", "figure_count": 92, "figures": [{"file": "book_contents/figures/ch04/fig-4.2.png", "label": "Figure 4.2", "caption": "FIGURE 4.2 Bond rotation in ethane and cyclopropane. (a) Rotation occurs around the carbon–carbon bond in ethane, but (b) no rotation is possible around the carbon–carbon bonds in cyclopropane without breaking open the r", "desc": "Panel (a) shows ethane as a structural drawing and ball-and-stick models, with a curved arrow and “Rotate” arrow showing rotation around its carbon–carbon bond. Panel (b) shows cyclopropane as a three-carbon ring and a ball-and-stick model, illustrating that its ring bonds cannot rotate without opening the ring.", "section": "4.2"}, {"file": "book_contents/figures/ch04/fig-4.3.png", "label": "Figure 4.3", "caption": "FIGURE 4.3 There are two different 1,2-dimethylcyclopropane isomers, one with the methyl groups on the same face of the ring (cis) and the other with the methyl groups on opposite faces of the ring (trans). The two isome", "desc": "Side-by-side structural drawings and ball-and-stick models show cis-1,2-dimethylcyclopropane with both methyl groups on the same face of the ring and trans-1,2-dimethylcyclopropane with them on opposite faces. The comparison illustrates two distinct isomers that do not interconvert.", "section": "4.2"}, {"file": "book_contents/figures/ch04/fig-4.4.png", "label": "Figure 4.4", "caption": "FIGURE 4.4 Cycloalkane strain energies, as calculated by taking the difference between cycloalkane heat of combustion per CH2 and acyclic alkane heat of combustion per CH2, and multiplying by the number of CH2 units in a", "desc": "A bar chart plots cycloalkane strain energy against ring size from 3 to 14, with energy scales in kJ/mol and kcal/mol. Three- and four-membered rings have the highest bars, while ring sizes 6 and 14 are marked at zero.", "section": "4.3"}, {"file": "book_contents/figures/ch04/fig-4.5.png", "label": "Figure 4.5", "caption": "FIGURE 4.5 The structure of cyclopropane, showing the eclipsing of neighboring C−H bonds that gives rise to torsional strain. Part (b) is a Newman projection along a C−C bond.", "desc": "Part (a) shows space-filling and ball-and-stick models of cyclopropane. Part (b) shows a Newman projection along a C–C bond, with neighboring C–H bonds marked as eclipsed to illustrate torsional strain.", "section": "4.4"}, {"file": "book_contents/figures/ch04/fig-4.6.png", "label": "Figure 4.6", "caption": "FIGURE 4.6 The conformation of cyclobutane. Part (c) is a Newman projection along a C−C bond, showing that neighboring C−H bonds are", "desc": "Three views of cyclobutane show a ball-and-stick model, a slightly bent four-carbon ring with a marked viewing direction, and a Newman projection along a C–C bond. The projection shows neighboring C–H bonds that are “not quite eclipsed.”", "section": "4.4"}, {"file": "book_contents/figures/ch04/fig-4.7.png", "label": "Figure 4.7", "caption": "FIGURE 4.7 The conformation of cyclopentane. Carbons 1, 2, 3, and 4 are nearly coplanar, but carbon 5 is out of the plane. Part (c) is a Newman projection along the C1–C2 bond, showing that neighboring C−H bonds are near", "desc": "Three views show cyclopentane as a ball-and-stick model, a numbered puckered ring with carbon 5 bent out of the plane, and a Newman projection looking along the C1–C2 bond. The projection shows neighboring C–H bonds nearly staggered.", "section": "4.4"}, {"file": "book_contents/figures/ch04/fig-4.8.png", "label": "Figure 4.8", "caption": "FIGURE 4.8 The strain-free chair conformation of cyclohexane. All C−C−C bond angles are 111.5°, close to the ideal 109° tetrahedral angle, and all neighboring C−H bonds are staggered.", "desc": "Three views of cyclohexane in its chair conformation show a ball-and-stick model, a numbered bond drawing with colored hydrogen labels and observer sightlines, and an end-on projection. The figure illustrates the chair's near-tetrahedral C–C–C angles and staggered neighboring C–H bonds.", "section": "4.5"}, {"file": "book_contents/figures/ch04/fig-4.9.png", "label": "Figure 4.9", "caption": "FIGURE 4.9 Axial and equatorial positions in chair cyclohexane. The six axial hydrogens are parallel to the ring axis, and the six equatorial hydrogens are in a band around the ring equator.", "desc": "A ball-and-stick model and a line drawing show chair cyclohexane with six axial hydrogens oriented parallel to the ring axis and six equatorial hydrogens arranged around the ring equator. Pink marks the axial positions and blue marks the equatorial positions.", "section": "4.6"}]}, {"id": "5", "title": "Stereochemistry at Tetrahedral Centers", "pages": [135, 170], "summary": "Molecular handedness: a tetrahedral carbon with four different groups makes a molecule chiral, giving non-superimposable mirror-image enantiomers that differ only in how they rotate plane-polarized light and in how they interact with other chiral things such as enzymes. The chapter develops R/S naming by the Cahn–Ingold–Prelog rules, diastereomers, meso compounds, racemates and their resolution, a map of all isomer types, and prochirality (Re/Si faces, pro-R/pro-S groups).", "learner_can_do": "Find chirality centers, assign R or S by CIP ranking, classify pairs of stereoisomers as enantiomers, diastereomers, or identical (meso), and identify Re/Si faces and pro-R/pro-S hydrogens.", "game_hook": "Mirror-world puzzles: the player rotates 3D molecules trying to superimpose them on their reflections, ranks groups by CIP priority to read the steering-wheel direction (R/S), and fits the correct-handed key into a chiral enzyme lock.", "figure_count": 144, "figures": [{"file": "book_contents/figures/ch05/fig-5.2.png", "label": "Figure 5.2", "caption": "FIGURE 5.2 Tetrahedral carbon atoms and their mirror images. Molecules of the type CH3X and CH2XY are identical to their mirror images, but a molecule of the type CHXYZ is not. A CHXYZ molecule is related to its mirror i", "desc": "Three rows show generic tetrahedral carbon structures, their colored ball-and-stick models, and reflections in a mirror. The CH₃X and CH₂XY arrangements match their mirror images, while the CHXYZ arrangement does not.", "section": "5.1"}, {"file": "book_contents/figures/ch05/fig-5.3.png", "label": "Figure 5.3", "caption": "FIGURE 5.3 Attempts at superimposing the mirror-image forms of lactic acid. (a) When the −H and −OH substituents match up, the −CO2H and −CH3 substituents don’t; (b) when −CO2H and −CH3 match up, −H and −OH don’t. Regard", "desc": "Two pairs of wedge-and-dash drawings show attempts to superimpose mirror-image forms of lactic acid. Arrows mark the substituents that remain mismatched: CH3 and CO2H in (a), and H and OH in (b).", "section": "5.1"}, {"file": "book_contents/figures/ch05/fig-5.4.png", "label": "Figure 5.4", "caption": "FIGURE 5.4 The meaning of symmetry plane. (a) An object like the coffee mug has a symmetry plane cutting through it so that right and left halves are mirror images. (b) An object like a hand has no symmetry plane; the ri", "desc": "Two panels compare a coffee mug and an upright hand against blue-tinted planes, each with a blue line running through the object. The mug’s halves mirror one another across the plane, while the hand’s halves do not, illustrating the presence or absence of a symmetry plane.", "section": "5.2"}, {"file": "book_contents/figures/ch05/fig-5.5.png", "label": "Figure 5.5", "caption": "FIGURE 5.5 The achiral propanoic acid molecule versus the chiral lactic acid molecule. Propanoic acid has a plane of symmetry that makes one side of the molecule a mirror image of the other. Lactic acid has no such symme", "desc": "Side-by-side molecular models and structural formulas compare propanoic acid, labeled achiral with a symmetry plane, and lactic acid, labeled chiral with a dashed line marked “Not a symmetry plane.” The figure illustrates how a symmetry plane distinguishes the two molecules.", "section": "5.2"}, {"file": "book_contents/figures/ch05/fig-5.6.png", "label": "Figure 5.6", "caption": "FIGURE 5.6 Schematic representation of a polarimeter. Plane-polarized light passes through a solution of optically active molecules, which rotate the plane of polarization.", "desc": "A schematic polarimeter shows light from a bulb passing through a polarizer, a sample tube containing organic molecules, and an analyzer before reaching an observer. Red arrows and an angle α illustrate the rotation of the light’s plane of polarization through the sample.", "section": "5.3"}, {"file": "book_contents/figures/ch05/fig-5.7.png", "label": "Figure 5.7", "caption": "FIGURE 5.7 Drawings of sodium ammonium tartrate crystals taken from Pasteur’s original sketches. One of the crystals is dextrorotatory", "desc": "Two blue crystal drawings are mirror images, with slanted faces on opposite sides and dashed lines showing hidden edges. Beside them is a structural formula labeled sodium ammonium tartrate; the caption states that one crystal is dextrorotatory.", "section": "5.4"}, {"file": "book_contents/figures/ch05/fig-5.8.png", "label": "Figure 5.8", "caption": "FIGURE 5.8 Assigning R and S configurations to chirality centers. When the molecule is oriented so that the lowest-ranked group (4) is toward the rear, the remaining three groups radiate toward the viewer like the spokes", "desc": "Two mirror-image generic tetrahedral centers have groups numbered 1–4; after reorientation with group 4 pointing away, pink arrows trace 1 → 2 → 3 clockwise for R and counterclockwise for S. Steering wheels on either side illustrate the corresponding right and left turns.", "section": "5.5"}, {"file": "book_contents/figures/ch05/fig-5.9.png", "label": "Figure 5.9", "caption": "FIGURE 5.9 Assigning configuration to (a) (R)-(−)-lactic acid and (b) (S)-(+)-lactic acid.", "desc": "Two mirror-image models and wedge–dash drawings of lactic acid flank a vertical mirror. Numbered OH, CO₂H, and CH₃ groups and curved arrows show a clockwise sequence for the labeled R configuration of (−)-lactic acid and a counterclockwise sequence for the S configuration of (+)-lactic acid.", "section": "5.5"}]}, {"id": "6", "title": "An Overview of Organic Reactions", "pages": [171, 206], "summary": "A framework for every reaction in the book: four reaction types (addition, elimination, substitution, rearrangement), two main mechanism types (polar, driven by nucleophile–electrophile attraction and drawn with full curved arrows; radical, with odd electrons and fishhook arrows), and the energy language for describing reactions—Keq and ΔG° for how far, ΔG‡ for how fast, bond dissociation energies, energy diagrams with transition states and intermediates—plus how enzyme-catalyzed biological reactions differ from lab reactions.", "learner_can_do": "Classify a reaction by type, draw curved-arrow mechanisms from nucleophile to electrophile that conserve charge and obey the octet rule, and read or sketch energy diagrams to judge whether a reaction is favorable and how fast it is.", "game_hook": "Reactions as journeys over an energy landscape: the player fires electron-pair arrows from nucleophilic sources to electrophilic sinks to move molecules through transition-state passes and intermediate valleys, needing enough activation energy to clear each pass.", "figure_count": 132, "figures": [{"file": "book_contents/figures/ch06/fig-6.2.png", "label": "Figure 6.2", "caption": "FIGURE 6.2 Some nucleophiles and electrophiles. Electrostatic potential maps identify the nucleophilic (negative) and electrophilic (positive) atoms.", "desc": "Seven molecular models and electrostatic potential maps are arranged in two rows: four electron-rich nucleophiles above and three electron-poor electrophiles below. Pink arrows mark the nucleophilic atoms, while blue arrows mark electrophilic sites; the lower structures also show partial charges.", "section": "6.3"}, {"file": "book_contents/figures/ch06/fig-6.3.png", "label": "Figure 6.3", "caption": "FIGURE 6.3 A comparison of carbon–carbon single and double bonds. A double bond is both more accessible to approaching reactants than a single bond and more electron-rich (more nucleophilic). An electrostatic potential m", "desc": "The figure compares ethane’s carbon–carbon σ bond on the left with ethylene’s carbon–carbon π bond on the right, using molecular surfaces above and bond-electron drawings below. The labels show the σ bond as stronger with less accessible bonding electrons and the π bond as weaker with more accessible electrons; an arrow points to the double-bond region on ethylene’s electrostatic potential map.", "section": "6.4"}, {"file": "book_contents/figures/ch06/fig-6.4.png", "label": "Figure 6.4", "caption": "FIGURE 6.4 MECHANISM The electrophilic addition reaction of ethylene and HBr. The reaction takes place in two steps, both of which involve electrophile–nucleophile interactions.", "desc": "A two-step mechanism shows ethylene’s double bond attacking the hydrogen of HBr as the H–Br bond breaks, producing a carbocation and bromide ion. A curved arrow then shows bromide attacking the positively charged carbon to form bromoethane; a colored orbital illustrates the vacant orbital on the carbocation.", "section": "6.4"}, {"file": "book_contents/figures/ch06/fig-6.5.png", "label": "Figure 6.5", "caption": "FIGURE 6.5 An energy diagram for the first step in the reaction of ethylene with HBr. The energy difference between reactants and the transition state, ΔG ‡ , defines the reaction rate. The energy difference between reac", "desc": "An energy-versus-reaction-progress diagram shows ethylene and HBr rising to a transition-state peak, then falling to a higher-energy carbocation product, CH₃CH₂⁺ + Br⁻. Vertical arrows mark the activation energy (ΔG‡) and the reactant-to-product energy difference (ΔG°).", "section": "6.9"}, {"file": "book_contents/figures/ch06/fig-6.6.png", "label": "Figure 6.6", "caption": "FIGURE 6.6 A hypothetical transition-state structure for the first step of the reaction of ethylene with HBr. The π bond and H−Br bond are just beginning to break, and the C−H bond is just beginning to form.", "desc": "The figure shows a hypothetical transition-state arrangement for ethylene reacting with HBr, with colored orbital lobes around the carbon atoms. Dashed lines depict the ethylene π bond and H–Br bond beginning to break while a C–H bond begins to form.", "section": "6.9"}, {"file": "book_contents/figures/ch06/fig-6.7.png", "label": "Figure 6.7", "caption": "FIGURE 6.7 Some hypothetical energy diagrams: (a) a fast exergonic reaction (low ΔG ‡ , negative ΔG°); (b) a slow exergonic reaction (high , ΔG ‡ , negative ΔG°); (c) a fast endergonic reaction (small ΔG ‡ , small positi", "desc": "Four energy-versus-reaction-progress diagrams compare low and high activation barriers (ΔG‡) with products at lower or higher energy than reactants (negative or positive ΔG°). Panels (a) and (b) show fast and slow exergonic reactions; (c) and (d) show fast and slow endergonic reactions.", "section": "6.9"}, {"file": "book_contents/figures/ch06/fig-6.8.png", "label": "Figure 6.8", "caption": "FIGURE 6.8 An energy diagram for the reaction of ethylene with HBr. Two separate steps are involved, each with its own activation energy (ΔG ‡ ) and free-energy change (ΔG°). The overall ΔG ‡ for the complete reaction is", "desc": "A reaction-energy curve for H₂C=CH₂ + HBr forming CH₃CH₂Br rises through two transition states separated by a carbocation intermediate, then falls to products below the reactants. Arrows mark the activation energies for both steps and the overall free-energy change.", "section": "6.10"}, {"file": "book_contents/figures/ch06/fig-6.9.png", "label": "Figure 6.9", "caption": "FIGURE 6.9 Energy diagrams for a typical, enzyme-catalyzed biological reaction and an uncatalyzed laboratory reaction. The biological reaction involves many steps, each of which has a relatively small activation energy a", "desc": "An energy diagram compares a high, single-peaked uncatalyzed pathway with a lower, multi-peaked enzyme-catalyzed pathway. Both begin and end at the same energy levels, with energy on the vertical axis and reaction progress on the horizontal axis.", "section": "6.10"}]}, {"id": "7", "title": "Alkenes: Structure and Reactivity", "pages": [207, 242], "summary": "Alkenes: how they are made industrially, how to count rings and π bonds from a formula (degree of unsaturation), how to name them and specify double-bond geometry (cis/trans and E/Z), why more substituted and trans alkenes are more stable, and their signature reaction—electrophilic addition of HX through carbocation intermediates. Markovnikov's rule follows from carbocation stability (3° > 2° > 1° > methyl) via the Hammond postulate, and carbocation rearrangements (hydride and alkyl shifts) are key evidence for the mechanism.", "learner_can_do": "Calculate degree of unsaturation, name alkenes with E/Z, rank alkene and carbocation stabilities, and predict the Markovnikov product of HX addition, including any hydride or alkyl shift.", "game_hook": "HX addition as a branching path: the player chooses which alkene carbon the proton lands on, sees the resulting carbocation's stability bar, and can trigger hydride or methyl shifts to slide the positive charge to a more substituted carbon before the halide arrives.", "figure_count": 166, "figures": [{"file": "book_contents/figures/ch07/fig-7.2.png", "label": "Figure 7.2", "caption": "FIGURE 7.2 Compounds derived industrially from ethylene and propylene.", "desc": "Two branching diagrams show ethylene (ethene) and propylene (propene) pointing to labeled structural formulas of industrially derived compounds, including polymers. The figure illustrates the range of products made from these two alkenes.", "section": "7.1"}, {"file": "book_contents/figures/ch07/fig-7.3.png", "label": "Figure 7.3", "caption": "FIGURE 7.3 The π bond must break for rotation to take place around a carbon–carbon double bond.", "desc": "Two orbital diagrams show p orbitals on adjacent carbons aligned in parallel to form a π bond, then perpendicular after one carbon rotates 90°, breaking the π bond.", "section": "7.4"}, {"file": "book_contents/figures/ch07/fig-7.4.png", "label": "Figure 7.4", "caption": "FIGURE 7.4 Cis and trans isomers of 2-butene. The cis isomer has the two methyl groups on the same side of the double bond, and the trans isomer has methyl groups on opposite sides.", "desc": "Side-by-side structural drawings and ball-and-stick models show cis-2-Butene with its two methyl groups on the same side of the C=C bond and trans-2-Butene with them on opposite sides. The comparison illustrates cis–trans isomerism in alkenes.", "section": "7.4"}, {"file": "book_contents/figures/ch07/fig-7.5.png", "label": "Figure 7.5", "caption": "FIGURE 7.5 The requirement for cis–trans isomerism in alkenes. Compounds that have one of their carbons bonded to two identical groups can’t exist as cis–trans isomers. Only when both carbons are bonded to two different ", "desc": "Two pairs of generic C=C structures compare switching A and B on one carbon. When the other carbon bears two D groups, the drawings are identical (=); when it bears D and E, they are not identical (≠) and are cis–trans isomers.", "section": "7.4"}, {"file": "book_contents/figures/ch07/fig-7.6.png", "label": "Figure 7.6", "caption": "FIGURE 7.6 Energy diagrams for hydrogenation of cis- and trans-2-butene. The cis isomer is higher in energy than the trans isomer by about 2.8 kJ/mol and therefore releases more energy when hydrogenated.", "desc": "An energy-versus-reaction-progress diagram shows the green cis-2-butene curve starting above the pink trans-2-butene curve; both descend to the same butane product level. The marked energy differences show that the higher-energy cis isomer releases more energy on hydrogenation.", "section": "7.6"}, {"file": "book_contents/figures/ch07/fig-7.7.png", "label": "Figure 7.7", "caption": "FIGURE 7.7 Hyperconjugation is a stabilizing interaction between the ═ π orbital and adjacent C−H σ bonds on substituents. The", "desc": "Two views of propene show colored orbital lobes around the C=C bond and its adjacent methyl group. The figure illustrates overlap between the alkene’s π orbital and neighboring C–H bonds, labeled as a stabilizing hyperconjugation interaction.", "section": "7.6"}, {"file": "book_contents/figures/ch07/fig-7.8.png", "label": "Figure 7.8", "caption": "FIGURE 7.8 MECHANISM Mechanism of the electrophilic addition of HBr to 2-methylpropene. The reaction occurs in two steps, protonation and bromide addition, and involves a carbocation intermediate.", "desc": "A two-step mechanism shows 2-methylpropene reacting with HBr: arrows indicate protonation of the double bond to form a carbocation intermediate and bromide ion, followed by bromide attack to form 2-bromo-2-methylpropane. The intermediate is drawn with a positive charge and a vacant p orbital.", "section": "7.7"}, {"file": "book_contents/figures/ch07/fig-7.9.png", "label": "Figure 7.9", "caption": "FIGURE 7.9 Energy diagram for the two-step electrophilic addition of HBr to 2-methylpropene. The first step is slower than the second step.", "desc": "An energy-versus-reaction-progress curve shows 2-methylpropene and HBr forming a carbocation intermediate, then a brominated product. Two peaks mark the transition states; the first activation-energy barrier is larger than the second.", "section": "7.7"}]}, {"id": "8", "title": "Alkenes: Reactions and Synthesis", "pages": [243, 286], "summary": "The alkene reaction toolkit. Alkenes are made by eliminations (dehydrohalogenation, dehydration) and undergo many additions, each with its own regiochemistry and stereochemistry: X2 (anti, via halonium ion), HOX halohydrins (Markovnikov, anti), oxymercuration (Markovnikov hydration), hydroboration (non-Markovnikov, syn), catalytic hydrogenation (syn), epoxidation and OsO4 hydroxylation (syn), epoxide hydrolysis (anti), oxidative cleavage (O3, KMnO4, HIO4), carbene cyclopropanation, and radical chain-growth polymerization. The chapter closes on the stereochemistry of new chirality centers: achiral reactants give racemates, chiral reactants give unequal diastereomers.", "learner_can_do": "Choose the reagent that converts an alkene into a target product with the right regiochemistry (Markovnikov vs. non-Markovnikov) and stereochemistry (syn vs. anti), and work backward from products (including ozonolysis fragments) to the starting alkene.", "game_hook": "A reagent spell-book: each alkene reagent is a card with a visible signature (which carbon gets which group, same face vs. opposite faces); the player sequences cards to synthesize target molecules, and wrong-face or wrong-carbon additions produce the wrong stereoisomer.", "figure_count": 180, "figures": [{"file": "book_contents/figures/ch08/fig-8.2.png", "label": "Figure 8.2", "caption": "FIGURE 8.2 Some useful alkene reactions.", "desc": "A central generic alkene is surrounded by arrows pointing to structures labeled halohydrin, alcohol, alkane, 1,2-diol, carbonyl compound, cyclopropane, epoxide, halide, and 1,2-dihalide. The diagram illustrates different products obtainable from an alkene.", "section": "8.why"}, {"file": "book_contents/figures/ch08/fig-8.3.png", "label": "Figure 8.3", "caption": "FIGURE 8.3 MECHANISM Bromohydrin formation by reaction of an alkene with Br2 in the presence of water. Water acts as a nucleophile in step 2 to react with the intermediate bromonium ion.", "desc": "A three-step mechanism shows an alkene reacting with Br₂ to form a bromonium ion, water opening the ring, and loss of a proton to give 3-bromo-2-butanol and H₃O⁺. Curved arrows mark electron movement, and wedges and dashes show the product’s spatial arrangement.", "section": "8.3"}, {"file": "book_contents/figures/ch08/fig-8.4a.png", "label": "Figure 8.4", "caption": "FIGURE 8.4 MECHANISM Mechanism of the acid-catalyzed hydration of an alkene to yield an alcohol. Protonation of the alkene gives a carbocation intermediate, which reacts with water. The initial product is then deprotonat", "desc": "A three-step mechanism shows 2-methylpropene reacting with hydronium to form a carbocation, water adding to give a protonated alcohol, and deprotonation yielding 2-methyl-2-propanol while regenerating hydronium. Curved arrows trace electron movement, and a colored orbital marks the carbocation.", "section": "8.4"}, {"file": "book_contents/figures/ch08/fig-8.4b.png", "label": "Figure 8.4", "caption": "FIGURE 8.4 MECHANISM Mechanism of the acid-catalyzed hydration of an alkene to yield an alcohol. Protonation of the alkene gives a carbocation intermediate, which reacts with water. The initial product is then deprotonat", "desc": "The figure shows ethylene reacting with water to form ethanol, with H₃PO₄ listed as a catalyst and 250 °C below the arrow. It illustrates hydration of an alkene to an alcohol.", "section": "8.4"}, {"file": "book_contents/figures/ch08/fig-8.5.png", "label": "Figure 8.5", "caption": "FIGURE 8.5 Mechanism of the oxymercuration of an alkene to yield an alcohol. (1) Electrophilic addition of Hg2+ gives a mercurinium ion, which (2) reacts with water as in halohydrin formation. Loss of a proton gives an o", "desc": "A three-step scheme shows 1-methylcyclopentene reacting with Hg(OAc)₂ to form a bridged mercurinium ion, followed by H₂O to form an organomercury compound and NaBH₄ to give 1-methylcyclopentanol (92% yield). The OH group appears on the methyl-substituted carbon, illustrating the depicted regiochemistry.", "section": "8.4"}, {"file": "book_contents/figures/ch08/fig-8.6.png", "label": "Figure 8.6", "caption": "FIGURE 8.6 Mechanism of alkene hydroboration. The reaction occurs in a single step in which the C−H and C−B bonds form at the same time and on the same face of the double bond. The lower energy, more rapidly formed trans", "desc": "The scheme shows BH₃ adding to 1-methylcyclopentene through two alternative bracketed transition states; the crowded pathway is marked “Not formed.” The favored pathway places boron on the less crowded carbon, and a subsequent arrow labeled H₂O₂, OH⁻ leads to trans-2-methylcyclopentanol.", "section": "8.5"}, {"file": "book_contents/figures/ch08/fig-8.7.png", "label": "Figure 8.7", "caption": "FIGURE 8.7 MECHANISM Mechanism of alkene hydrogenation. The reaction takes place with syn stereochemistry on the surface of insoluble catalyst particles.", "desc": "A four-step ball-and-stick mechanism shows hydrogen and an alkene binding to a metal catalyst surface, followed by transfer of the two hydrogen atoms and release of the alkane. Both hydrogens are added from the same face of the alkene, illustrating syn hydrogenation.", "section": "8.6"}, {"file": "book_contents/figures/ch08/fig-8.8.png", "label": "Figure 8.8", "caption": "FIGURE 8.8 Catalytic hydrogenation of polyunsaturated fats leads primarily to saturated products, along with a small amount of isomerized trans fats.", "desc": "A generic vegetable-oil structure is shown alongside a fatty-acid chain with two cis double bonds. An arrow labeled “2 H₂, Pd/C” leads to a saturated chain, while a bracketed alternative shows a chain retaining one trans double bond.", "section": "8.6"}]}, {"id": "9", "title": "Alkynes: An Introduction to Organic Synthesis", "pages": [287, 316], "summary": "Alkynes (C≡C, sp carbons, linear) are prepared by double elimination of HX from vicinal dihalides and by alkylation of acetylide anions. They undergo alkene-like electrophilic additions (HX, X2), hydration to ketones via enol tautomers (Hg2+ for Markovnikov methyl ketones, disiamylborane hydroboration for aldehydes), reduction (Pd to alkanes, Lindlar to cis alkenes, Li/NH3 to trans alkenes), and oxidative cleavage. Terminal alkynes are unusually acidic (pKa 25) because of 50% s character. The chapter uses these reactions to introduce retrosynthetic planning of multistep syntheses.", "learner_can_do": "Predict products of alkyne reactions, choose Lindlar vs. Li/NH3 for cis vs. trans alkenes, build carbon chains by acetylide alkylation with primary halides, and plan a multistep synthesis by working backward from the target.", "game_hook": "A retrosynthesis map: the player starts at the target molecule and walks backward one known reaction at a time to reach the allowed starting materials, chaining acetylide alkylations to grow carbon chains and choosing the right reduction to set cis or trans geometry.", "figure_count": 137, "figures": [{"file": "book_contents/figures/ch09/fig-9.2.png", "label": "Figure 9.2", "caption": "FIGURE 9.2 The structure of acetylene, . The bond angles are 180°, and the electrostatic potential map shows that the π bonds create a negative belt around the molecule.", "desc": "Two views of linear acetylene are shown: a ball-and-stick model with a carbon–carbon triple bond and an electrostatic potential map surrounding the molecule. Arrows labeled “π bond” point to the colored region around the molecule, illustrating the negative belt created by its π bonds.", "section": "9.3"}, {"file": "book_contents/figures/ch09/fig-9.3.png", "label": "Figure 9.3", "caption": "FIGURE 9.3 The structure of a secondary vinylic carbocation. The cationic carbon atom is sp-hybridized and has a vacant p orbital perpendicular to the plane of the π bond orbitals. Only one R group is attached to the pos", "desc": "An electrostatic potential map and orbital drawing show a generic secondary vinylic carbocation, with a π bond and a vacant p orbital on its positively charged carbon. A second orbital drawing contrasts it with a secondary alkyl carbocation.", "section": "9.3"}, {"file": "book_contents/figures/ch09/fig-9.4.png", "label": "Figure 9.4", "caption": "FIGURE 9.4 MECHANISM Mechanism of the mercury(II)-catalyzed hydration of an alkyne to yield a ketone. The reaction occurs through initial formation of an intermediate enol, which tautomerizes to the ketone.", "desc": "A five-step mechanism shows a generic terminal alkyne reacting with mercury(II) and water to form a mercury-containing intermediate, then an enol, which tautomerizes to a ketone. Numbered arrows and curved electron-flow arrows accompany each step.", "section": "9.4"}, {"file": "book_contents/figures/ch09/fig-9.5.png", "label": "Figure 9.5", "caption": "FIGURE 9.5 MECHANISM Mechanism of the lithium/ammonia reduction of an alkyne to produce a trans alkene.", "desc": "A four-step mechanism shows lithium transferring electrons to a generic R–C≡C–R′ alkyne, with ammonia supplying protons between the electron transfers. The diagrams trace an anion radical, a vinylic radical, and a vinylic anion to a trans alkene, with curved arrows marking proton transfers.", "section": "9.5"}, {"file": "book_contents/figures/ch09/fig-9.6.png", "label": "Figure 9.6", "caption": "FIGURE 9.6 A comparison of alkyl, vinylic, and acetylide anions. The acetylide anion, with sp hybridization, has more s character and is more stable. Electrostatic potential maps show that placing the negative charge clo", "desc": "Three labeled anions—alkyl, vinylic, and acetylide—are shown with structural drawings and electrostatic potential models, alongside sp³, sp², and sp hybridization and 25%, 33%, and 50% s character, respectively. A right-pointing stability arrow illustrates increasing stability toward the acetylide anion as the negative charge lies closer to the carbon nucleus.", "section": "9.7"}, {"file": "book_contents/figures/ch09/fig-9.7a.png", "label": "Figure 9.7", "caption": "FIGURE 9.7 MECHANISM A mechanism for the alkylation reaction of acetylide anion with bromomethane to give propyne.", "desc": "The mechanism shows the acetylide anion attacking bromomethane as the C–C bond forms and the C–Br bond breaks through a transition state, yielding propyne and NaBr. It illustrates alkylation by simultaneous bond formation and bond cleavage.", "section": "9.8"}, {"file": "book_contents/figures/ch09/fig-9.7b.png", "label": "Figure 9.7", "caption": "FIGURE 9.7 MECHANISM A mechanism for the alkylation reaction of acetylide anion with bromomethane to give propyne.", "desc": "A reaction scheme shows 1-hexyne treated first with NaNH₂ in NH₃, then with CH₃CH₂CH₂CH₂Br, to give 5-decyne (76%). It illustrates formation of a longer internal alkyne from a terminal alkyne.", "section": "9.8"}, {"file": "book_contents/figures/ch09/fig-9.7c.png", "label": "Figure 9.7", "caption": "FIGURE 9.7 MECHANISM A mechanism for the alkylation reaction of acetylide anion with bromomethane to give propyne.", "desc": "Two reaction sequences show acetylene treated with NaNH₂ to form an acetylide anion, then reacted with a generic alkyl bromide to give a terminal alkyne. A second sequence shows that terminal alkyne undergoing the same two steps to give an internal alkyne.", "section": "9.8"}]}, {"id": "10", "title": "Organohalides", "pages": [317, 340], "summary": "Organohalides: naming haloalkanes, the polar and electrophilic C–X bond, and ways to make alkyl halides—radical halogenation of alkanes (mixtures, selectivity from radical stability), allylic bromination with NBS (via resonance-stabilized allyl radicals), and conversion of alcohols (HX for tertiary; SOCl2, PBr3, HF–pyridine for primary/secondary). Alkyl halides become carbon nucleophiles as Grignard reagents and organolithiums, and form C–C bonds in Gilman (R2CuLi) and Suzuki–Miyaura couplings. The chapter defines organic oxidation and reduction by counting bonds to heteroatoms versus hydrogen.", "learner_can_do": "Name alkyl halides, predict radical and allylic halogenation products and ratios, choose reagents to turn alcohols into alkyl halides, use organometallic couplings to join carbon fragments, and rank compounds by oxidation level.", "game_hook": "A radical-hunt arena where Br· and Cl· radicals pick off the weakest C–H bonds first (allylic > 3° > 2° > 1°), and an organometallic forge that flips electrophilic C–X carbons into nucleophilic C–Mg or C–Cu carbons that can bond to other fragments.", "figure_count": 119, "figures": [{"file": "book_contents/figures/ch10/fig-10.2.png", "label": "Figure 10.2", "caption": "FIGURE 10.2 Mechanism of the radical chlorination of methane. Three kinds of steps are required in radical substitution reactions: initiation, propagation, and termination. The propagation steps are a repeating cycle, wi", "desc": "The diagram shows methane reacting with chlorine under light: initiation produces chlorine radicals, two repeating propagation steps form hydrogen chloride and chloromethane, and termination steps combine radicals. An overall reaction is shown beneath the mechanism.", "section": "10.2"}, {"file": "book_contents/figures/ch10/fig-10.3.png", "label": "Figure 10.3", "caption": "FIGURE 10.3 Mechanism of allylic bromination of an alkene with NBS. The process is a radical chain reaction in which (1) a Br· radical abstracts an allylic hydrogen atom of the alkene and gives an allylic radical plus HB", "desc": "The mechanism shows a Br· radical abstracting an allylic hydrogen from cyclohexene to form an allylic radical and HBr; HBr reacts with NBS to form Br₂, which brominates the allylic radical and regenerates Br·. The numbered steps and dashed pink arrows illustrate the radical chain process.", "section": "10.3"}, {"file": "book_contents/figures/ch10/fig-10.4.png", "label": "Figure 10.4", "caption": "FIGURE 10.4 An orbital view of the allyl radical. The p orbital on the central carbon can overlap equally well with a p orbital on either neighboring carbon, giving rise to two equivalent resonance structures.", "desc": "An orbital diagram and molecular model show p orbitals overlapping across the three carbons of the allyl radical. At right, two equivalent resonance structures place the double bond and radical on opposite ends of the chain.", "section": "10.4"}, {"file": "book_contents/figures/ch10/fig-10.5.png", "label": "Figure 10.5", "caption": "FIGURE 10.5 The spin density surface of the allyl radical locates the position of the unpaired electron and shows that it is equally shared between the two terminal carbons.", "desc": "A ball-and-stick model of the allyl radical is surrounded by a multicolored spin-density surface. Two arrows point to matching regions around the terminal carbons, illustrating that they share the unpaired electron equally.", "section": "10.4"}, {"file": "book_contents/figures/ch10/fig-10.6.png", "label": "Figure 10.6", "caption": "FIGURE 10.6 Mechanism of the Suzuki–Miyaura coupling reaction of an aromatic boronic acid with an aromatic halide to give a biaryl. The reaction takes place by (1) reaction of the aromatic halide, ArX, with the catalyst ", "desc": "A three-step circular mechanism shows an aromatic halide (Ar–X) reacting with a palladium catalyst, then an aromatic boronic acid (Ar′–B(OH)₂), to form a diarylpalladium intermediate that releases a biaryl product (Ar–Ar′) and regenerates the catalyst. The diagram also shows ligand L and X–B(OH)₂ leaving during the cycle.", "section": "10.7"}, {"file": "book_contents/figures/ch10/fig-10.7.png", "label": "Figure 10.7", "caption": "FIGURE 10.7 Oxidation levels of some common compounds.", "desc": "Rows of molecular formulas are arranged from left to right above an arrow running from “Low oxidation level” to “High oxidation level.” The arrangement illustrates the relative oxidation levels of several common carbon compounds.", "section": "10.8"}]}, {"id": "11", "title": "Reactions of Alkyl Halides: Nucleophilic Substitutions and Eliminations", "pages": [341, 384], "summary": "The two great competing reactions of alkyl halides with nucleophiles/bases: substitution and elimination. SN2 is one-step backside attack with inversion and second-order kinetics, fastest for methyl/primary substrates, strong nucleophiles, good leaving groups, and polar aprotic solvents. SN1 goes through a carbocation (first-order, mostly racemization), favored by tertiary/allylic/benzylic substrates and polar protic solvents. Eliminations follow Zaitsev's rule and occur as E2 (one step, anti periplanar, deuterium isotope effect, trans-diaxial in cyclohexanes), E1 (carbocation, competes with SN1), or E1cB (carbanion next to a carbonyl, common in biology). Biological versions use diphosphate leaving groups and SAM methylations.", "learner_can_do": "Given a substrate, nucleophile/base, leaving group, and solvent, predict whether SN1, SN2, E1, E2, or E1cB dominates and draw the product with correct stereochemistry (inversion, racemization, Zaitsev or anti-periplanar alkene).", "game_hook": "A reaction-arena strategy game: the player tunes four dials (substrate bulk, nucleophile/base strength, leaving group, solvent) and watches the substrate take one of five mechanistic paths—backside SN2 umbrella flip, carbocation SN1/E1, concerted anti-periplanar E2, or carbanion E1cB—with the product's stereochemistry as the score.", "figure_count": 155, "figures": [{"file": "book_contents/figures/ch11/fig-11.2.png", "label": "Figure 11.2", "caption": "FIGURE 11.2 Walden’s cycle of reactions interconverting (+)- and (–)-malic acids.", "desc": "The cycle shows (+)-malic acid converted to (+)-chlorosuccinic acid with PCl₅ in ether, then to (–)-malic acid with Ag₂O and H₂O; the reverse sequence connects (–)-malic acid and (–)-chlorosuccinic acid. It illustrates interconversion of the two malic-acid forms through chlorosuccinic acid.", "section": "11.1"}, {"file": "book_contents/figures/ch11/fig-11.3.png", "label": "Figure 11.3", "caption": "FIGURE 11.3 A Walden cycle interconverting (+) and (–) enantiomers of 1-phenyl-2-propanol. Chirality centers are marked by asterisks, and the bonds broken in each reaction are indicated by red wavy lines. The inversion o", "desc": "A three-step Walden cycle interconverts (+)- and (−)-1-phenyl-2-propanol through tosylate and acetate derivatives, with rotation values shown beside the structures. The chirality center is marked with an asterisk, and step 2 shows acetate replacing tosylate with inversion at that center.", "section": "11.1"}, {"file": "book_contents/figures/ch11/fig-11.4.png", "label": "Figure 11.4", "caption": "FIGURE 11.4 MECHANISM The mechanism of the SN2 reaction. The reaction takes place in a single step when the incoming nucleophile approaches from a direction 180° away from the leaving halide ion, thereby inverting the st", "desc": "A two-stage drawing shows hydroxide attacking (S)-2-bromobutane opposite the bromine, passing through a transition state with partial C–OH and C–Br bonds. Bromide then departs to give (R)-2-butanol, illustrating inversion of stereochemistry in an SN2 reaction.", "section": "11.2"}, {"file": "book_contents/figures/ch11/fig-11.5.png", "label": "Figure 11.5", "caption": "FIGURE 11.5 The transition state of an SN2 reaction has a planar arrangement of the carbon atom and the remaining three groups. Electrostatic potential maps show that negative charge is delocalized in the transition stat", "desc": "Three stages of a generic SN2 substitution are shown as electrostatic-potential models and structural sketches: a tetrahedral carbon bonded to X reacts with Nu⁻, passes through a planar, bracketed transition state, and forms a tetrahedral carbon bonded to Nu as X⁻ departs. The transition state shows partial negative charge at both Nu and X.", "section": "11.2"}, {"file": "book_contents/figures/ch11/fig-11.6.png", "label": "Figure 11.6", "caption": "FIGURE 11.6 The effects of changes in reactant and transition-state energy levels on reaction rate. (a) A higher reactant energy level (red curve) corresponds to a faster reaction (smaller ∆G‡). (b) A higher transition-s", "desc": "Two energy-versus-reaction-progress diagrams compare black and pink reaction curves. In (a), the pink curve starts at higher reactant energy and has a smaller activation-energy barrier; in (b), it has a higher transition-state peak and a larger barrier.", "section": "11.3"}, {"file": "book_contents/figures/ch11/fig-11.7.png", "label": "Figure 11.7", "caption": "FIGURE 11.7 Steric hindrance to the SN2 reaction. As the models indicate, the carbon atom in (a) bromomethane is readily accessible, resulting in a fast SN2 reaction. The carbon atoms in (b) bromoethane (primary), (c) 2-", "desc": "Four alkyl bromides are shown as structural formulas and space-filling models, with arrows indicating approach toward the carbon bonded to bromine. From (a) to (d), increasing crowding around that carbon illustrates progressively greater steric hindrance and slower SN2 reactions.", "section": "11.3"}, {"file": "book_contents/figures/ch11/fig-11.8.png", "label": "Figure 11.8", "caption": "FIGURE 11.8 Energy diagrams showing the effects of (a) substrate, (b) nucleophile, (c) leaving group, and (d) solvent on SN2 reaction rates. Substrate and leaving group effects are felt primarily in the transition state.", "desc": "Four paired energy diagrams compare SN2 reaction profiles for hindered versus unhindered substrates, good versus poor nucleophiles, good versus poor leaving groups, and polar aprotic versus protic solvents. They illustrate how each factor changes the activation barrier, with substrate and leaving-group effects shown mainly near the peak and nucleophile and solvent effects mainly at the starting energy level.", "section": "11.3"}, {"file": "book_contents/figures/ch11/fig-11.9.png", "label": "Figure 11.9", "caption": "FIGURE 11.9 MECHANISM The mechanism of the SN1 reaction of 2-bromo-2-methylpropane with H2O involves three steps. Step 1—the spontaneous, unimolecular dissociation of the alkyl bromide to yield a carbocation—is rate-limi", "desc": "A three-step SN1 mechanism shows 2-bromo-2-methylpropane slowly losing bromide to form a carbocation, followed by fast attack by water and loss of a proton to give an alcohol and H₃O⁺. Curved arrows trace bond breaking, water attack, and proton transfer; the first step is marked rate-limiting.", "section": "11.4"}]}, {"id": "12", "title": "Structure Determination: Mass Spectrometry and Infrared Spectroscopy", "pages": [385, 418], "summary": "How chemists determine structure. Mass spectrometry ionizes molecules (electron impact, or soft ESI/MALDI for biomolecules), sorts ions by m/z, and gives molecular weight, exact formulas (high resolution), isotope patterns (Cl 3:1, Br 1:1 at M and M+2), the nitrogen rule, and fragmentation clues (α cleavage, dehydration, McLafferty rearrangement). Infrared spectroscopy measures which vibrational frequencies a molecule absorbs; characteristic bands (O–H, N–H, C–H, C≡C, C=O, C=C, fingerprint region) identify functional groups.", "learner_can_do": "Read a mass spectrum to find M+, the base peak, likely formula, halogen isotope patterns, and fragment losses, and read an IR spectrum to identify which functional groups are present (and absent).", "game_hook": "A detective lab: the player fires a mystery molecule through a mass spectrometer to get its weight and fragment 'debris', then shines IR light to see which bond-springs ring, and must name the culprit structure consistent with all the evidence.", "figure_count": 90, "figures": [{"file": "book_contents/figures/ch12/fig-12.2.png", "label": "Figure 12.2", "caption": "FIGURE 12.2 Representation of an electron-ionization, magnetic-sector mass spectrometer. Molecules are ionized by collision with high\u0002 energy electrons, causing some of the molecules to fragment. Passage of the charged f", "desc": "A schematic shows a sample entering an ionization chamber, where a heated filament produces an electron beam that ionizes and fragments molecules; the ions pass through slits and a magnetic sector that deflects them according to m/z before reaching a detector and LCD display. It illustrates how an electron-ionization magnetic-sector mass spectrometer sorts charged fragments by mass-to-charge ratio.", "section": "12.1"}, {"file": "book_contents/figures/ch12/fig-12.3.png", "label": "Figure 12.3", "caption": "FIGURE 12.3 Representation of a quadrupole mass analyzer. Only ions of a certain m/z will reach the detector; other ions will collide with the rods.", "desc": "A quadrupole mass analyzer is shown with an ion beam entering from the ionization chamber and passing between four charged rods. Ions with the correct m/z pass through to the detector, while ions with an incorrect m/z collide with the rods and cannot reach it.", "section": "12.1"}, {"file": "book_contents/figures/ch12/fig-12.4.png", "label": "Figure 12.4", "caption": "FIGURE 12.4 Mass spectrum of propane (C3H8; MW = 44).", "desc": "A mass spectrum of propane plots relative abundance (%) against m/z, with the tallest peak at m/z = 29 and another labeled peak at m/z = 44. It illustrates the distribution of ion abundances by mass-to-charge ratio.", "section": "12.1"}, {"file": "book_contents/figures/ch12/fig-12.5.png", "label": "Figure 12.5", "caption": "FIGURE 12.5 Mass spectrum of 2,2-dimethylpropane (C5H12; MW = 72). No molecular ion is observed when electron-impact ionization is + used. What do you think is the formula and structure of the M+ peak at m/z = 57?", "desc": "A mass spectrum of 2,2-dimethylpropane plots relative abundance against m/z, with labeled peaks at m/z 29, 41, and 57; the peak at m/z 57 is the tallest, while no molecular-ion peak is observed. The figure illustrates fragmentation under electron-impact ionization and asks the reader to infer the m/z 57 ion’s formula and structure.", "section": "12.2"}, {"file": "book_contents/figures/ch12/fig-12.6.png", "label": "Figure 12.6", "caption": "FIGURE 12.6 Mass spectrum of hexane (C6H14; MW = 86). The base peak is at m/z = 57, and numerous other ions are present.", "desc": "The mass spectrum of hexane shows relative abundance versus m/z, with a base peak at m/z 57 and prominent peaks at 43, 29, and the molecular ion at 86. It illustrates the mixture of fragment ions formed when hexane’s similar carbon–carbon bonds break.", "section": "12.2"}, {"file": "book_contents/figures/ch12/fig-12.7.png", "label": "Figure 12.7", "caption": "FIGURE 12.7 Fragmentation of hexane in a mass spectrometer.", "desc": "The diagram shows hexane ionized to a molecular ion, which fragments along several pathways into smaller positive ions. The fragments are listed with their m/z values and relative abundances, with m/z 57 marked as the base peak.", "section": "12.2"}, {"file": "book_contents/figures/ch12/fig-12.8.png", "label": "Figure 12.8", "caption": "FIGURE 12.8 Mass spectra of unlabeled samples A and B for Worked Example 12.1.", "desc": "Two stacked mass spectra compare unlabeled Sample A and Sample B, plotting relative abundance (%) against m/z with distinct peaks in each spectrum. The figure illustrates using mass-spectrum peak patterns to distinguish the two samples.", "section": "12.2"}, {"file": "book_contents/figures/ch12/fig-12.9a.png", "label": "Figure 12.9", "caption": "FIGURE 12.9 Mass spectra for Problem 12-2.", "desc": "A mass spectrum plots relative abundance (%) against m/z, with prominent peaks near m/z 41, 69, and 84 and smaller peaks elsewhere. It is panel (a) of the paired spectra used in the problem to distinguish 2-methyl-2-pentene from 2-hexene.", "section": "12.2"}]}], "sections": {"1.why": {"title": "Why This Chapter?", "pages": [7, 9], "summary": "Organic chemistry is the study of carbon compounds; every living thing, medicine, and food is made of them. Historically 'organic' meant substances from living organisms, but by the mid-1800s it was clear the only distinguishing feature is carbon, which as a group 4A element shares four valence electrons and bonds to itself to make chains and rings.", "learner_can_do": "Explain why carbon, alone among the elements, forms such an immense diversity of compounds."}, "1.1": {"title": "Atomic Structure: The Nucleus", "pages": [9, 9], "summary": "An atom is a tiny dense positive nucleus (protons and neutrons) surrounded by electrons at about 10^-10 m. Atomic number Z counts protons; mass number A counts protons plus neutrons; isotopes share Z but differ in A, and atomic weight is the abundance-weighted average mass in u (Da).", "learner_can_do": "Given Z and A, state the numbers of protons, neutrons, and electrons, and tell whether two atoms are isotopes."}, "1.2": {"title": "Atomic Structure: Orbitals", "pages": [9, 11], "summary": "Electrons are described by wave functions (orbitals), regions where an electron spends 90–95% of its time. s orbitals are spherical, p orbitals are dumbbells with two lobes of opposite algebraic sign separated by a node, and d orbitals are mostly cloverleaf-shaped. Orbitals are grouped into shells of increasing size and energy holding 2, 8, and 18 electrons.", "learner_can_do": "Recognize s, p, and d orbital shapes, identify nodes and lobe signs on a p orbital, and state how many electrons each shell holds."}, "1.3": {"title": "Atomic Structure: Electron Configurations", "pages": [11, 12], "summary": "Ground-state electron configurations follow three rules: fill lowest-energy orbitals first (Aufbau, with 4s between 3p and 3d), at most two electrons per orbital with opposite spins (Pauli), and spread electrons with parallel spins across equal-energy orbitals before pairing (Hund).", "learner_can_do": "Write the ground-state electron configuration and orbital-box diagram for an element such as O, N, S, or P."}, "1.4": {"title": "Development of Chemical Bonding Theory", "pages": [12, 15], "summary": "Kekulé and Couper proposed tetravalent carbon that bonds into chains (and Kekulé, rings); van't Hoff and Le Bel added the tetrahedral 3D arrangement, drawn with solid, wedged, and dashed bonds. Atoms bond to reach a noble-gas octet: ionic bonds by electron transfer, covalent bonds by sharing. The number of bonds an atom forms equals the electrons it needs (H 1, C 4, N 3, O 2, halogens 1); leftover valence electrons are lone pairs. Lewis (electron-dot) and Kekulé (line-bond) structures represent molecules.", "learner_can_do": "Predict how many bonds an atom forms from its group, draw electron-dot and line-bond structures (e.g., CH3Cl, PH3), and draw a tetrahedral carbon with wedge/dash bonds."}, "1.5": {"title": "Describing Chemical Bonds: Valence Bond Theory", "pages": [15, 17], "summary": "In valence bond theory, a covalent bond forms when singly occupied orbitals on two atoms overlap and the paired electrons are attracted to both nuclei. Head-on overlap gives cylindrically symmetric sigma (σ) bonds. Forming H–H releases 436 kJ/mol (the bond strength); the bond length (74 pm for H2) is the internuclear distance at the energy minimum, balancing attraction against nuclear repulsion.", "learner_can_do": "Read an energy-versus-internuclear-distance curve to identify bond length and bond strength, and explain why bond making releases energy."}, "1.6": {"title": "sp3 Hybrid Orbitals and the Structure of Methane", "pages": [17, 18], "summary": "Methane's four identical tetrahedral C–H bonds are explained by Pauling's hybridization: one 2s and three 2p orbitals mix into four equivalent, unsymmetrical sp3 hybrids pointing to the corners of a tetrahedron. Their large lobe overlaps strongly, giving C–H bonds of 439 kJ/mol and 109 pm with 109.5° bond angles.", "learner_can_do": "Explain why methane has four equivalent bonds and state the tetrahedral bond angle of an sp3 carbon."}, "1.7": {"title": "sp3 Hybrid Orbitals and the Structure of Ethane", "pages": [18, 19], "summary": "Ethane forms by head-on σ overlap of an sp3 hybrid from each carbon (C–C 153 pm, 377 kJ/mol), with the remaining sp3 hybrids bonding hydrogens; all angles are near 109.5°. The same sp3 bonding lets carbon build chains and rings.", "learner_can_do": "Draw a line-bond structure for a simple alkane (propane, hexane from a model), predict each bond angle, and describe the overall shape."}, "1.8": {"title": "sp2 Hybrid Orbitals and the Structure of Ethylene", "pages": [19, 21], "summary": "A carbon double bond uses sp2 hybridization: one 2s plus two 2p orbitals give three planar sp2 hybrids at 120°, leaving one p orbital perpendicular. Two sp2 carbons form an sp2–sp2 σ bond plus a sideways p–p pi (π) bond. Ethylene is planar, with a shorter and stronger C=C (134 pm, 728 kJ/mol) than ethane's C–C, but less than twice as strong because π overlap is weaker. Carbonyl carbons such as in formaldehyde are also sp2.", "learner_can_do": "Identify sp2 atoms in a molecule (alkenes, C=O), predict 120° angles, and explain the σ + π makeup of a double bond."}, "1.9": {"title": "sp Hybrid Orbitals and the Structure of Acetylene", "pages": [21, 22], "summary": "A carbon triple bond uses sp hybridization: 2s plus one 2p gives two sp hybrids 180° apart and two perpendicular p orbitals. Acetylene has one sp–sp σ bond and two π bonds, is linear, and has the shortest, strongest C–C bond (120 pm, about 965 kJ/mol). Table 1.2 compares bond lengths and strengths across sp3, sp2, and sp carbons.", "learner_can_do": "Assign sp hybridization to triply bonded carbons and rank C–C bonds by length and strength across single, double, and triple bonds."}, "1.10": {"title": "Hybridization of Nitrogen, Oxygen, Phosphorus, and Sulfur", "pages": [22, 24], "summary": "Hybridization also describes N, O, P, and S. Nitrogen in methylamine and oxygen in methanol are roughly sp3 (angles near 109.5°), with lone pairs occupying hybrid orbitals. Third-row phosphorus and sulfur can exceed an octet; organophosphates (e.g., methyl phosphate) have sp3 phosphorus, and thiols and sulfides have approximately sp3 sulfur.", "learner_can_do": "Identify the lone pairs on N, O, P, and S atoms in a molecule and predict the geometry around each."}, "1.11": {"title": "Describing Chemical Bonds: Molecular Orbital Theory", "pages": [24, 25], "summary": "Molecular orbital theory combines atomic orbitals into molecular orbitals that belong to the whole molecule. Additive combination gives a lower-energy bonding MO concentrated between nuclei; subtractive combination gives a higher-energy antibonding MO with a node between nuclei. In H2 and in ethylene's π bond only the bonding MO is filled.", "learner_can_do": "Sketch bonding and antibonding MOs for H2 or a C=C π bond, identify the node, and say which is occupied."}, "1.12": {"title": "Drawing Chemical Structures", "pages": [25, 27], "summary": "Condensed structures omit C–H and C–C single bonds (CH3CH2CH3, (CH3)2CH...). Skeletal structures go further: carbons sit at line ends and vertices, hydrogens on carbon are implied by carbon's valence of four, and heteroatoms are shown explicitly. Reading a skeletal structure means counting hydrogens at each vertex to get the molecular formula.", "learner_can_do": "Convert between line-bond, condensed, and skeletal structures, and read a skeletal structure (e.g., carvone) to count hydrogens on each carbon and give the molecular formula."}, "1.chemistry-matters": {"title": "Chemistry Matters—Organic Foods: Risk versus Benefit", "pages": [28, 29], "summary": "All foods are 'organic' mixtures of molecules; risk from chemicals like the herbicide atrazine is weighed against benefits. Toxicity is estimated by LD50, the dose per kg lethal to half of test animals (lower is more toxic), but LD50 says nothing about long-term risks.", "learner_can_do": "Interpret LD50 values to rank substances by acute toxicity and state what LD50 does not measure."}, "1.key-terms": {"title": "Key Terms", "pages": [29, 29], "summary": "Glossary list of the 35 key terms introduced in Chapter 1.", "learner_can_do": null}, "1.summary": {"title": "Summary", "pages": [29, 30], "summary": "Chapter recap: atoms and orbitals, electron configurations, VB vs. MO descriptions of covalent bonds, σ vs. π bonds, sp3/sp2/sp hybridization with tetrahedral/planar/linear geometry, and condensed and skeletal drawings.", "learner_can_do": null}, "1.problems": {"title": "Additional Problems", "pages": [30, 36], "summary": "Practice converting ball-and-stick models (citric acid, acetaminophen, aspartame) to skeletal structures, writing electron configurations, drawing Lewis and line-bond structures, assigning hybridization and bond angles (including allene, CO2, caffeine, carbocations, carbanions, carbenes), and drawing isomers for formulas such as C4H10 and C2H6O.", "learner_can_do": null}, "2.why": {"title": "Why This Chapter?", "pages": [37, 38], "summary": "Understanding organic chemistry means knowing why and how reactions happen at the molecular level; bond polarity, acid–base behavior, and hydrogen bonding are the foundation for later reactions.", "learner_can_do": null}, "2.1": {"title": "Polar Covalent Bonds and Electronegativity", "pages": [38, 40], "summary": "Most bonds are between ionic and covalent: polar covalent bonds share electrons unequally because of electronegativity (EN; F 4.0, O 3.5, N 3.0, C 2.5, H 2.1, Cs 0.7). EN differences under 0.5 are nonpolar, 0.5–2 polar, over 2 largely ionic. Partial charges are shown with δ+/δ− and crossed arrows, and electrostatic potential maps color electron-rich regions red and electron-poor blue. The inductive effect is electron shifting in σ bonds caused by nearby electronegative atoms (or electropositive metals).", "learner_can_do": "Use electronegativity values to predict the direction of polarity of a bond (e.g., C–O, C–Li, C–Mg) and rank bonds from least to most polar."}, "2.2": {"title": "Polar Covalent Bonds and Dipole Moments", "pages": [40, 42], "summary": "A molecule's polarity is the vector sum of its bond polarities and lone-pair contributions, measured as the dipole moment μ = Q × r in debyes. Molecules with electronegative atoms and lone pairs (H2O, CH3OH, NH3) have large dipoles; symmetric molecules (CO2, CH4, ethane, benzene) have zero because contributions cancel. Polar substances tend to dissolve in polar solvents like water.", "learner_can_do": "Draw a molecule in 3D and decide whether it has a net dipole moment, and in which direction, from its symmetry, bond polarities, and lone pairs."}, "2.3": {"title": "Formal Charges", "pages": [42, 44], "summary": "Formal charge is electron bookkeeping: valence electrons of the free atom minus electrons the bonded atom 'owns' (half the bonding electrons plus all nonbonding electrons). Atoms with unusual bond counts carry formal charges, e.g., S+ and O− in dimethyl sulfoxide. Table 2.2 summarizes common cases (C with 3 bonds can be 0, +1, or −1; N with 4 bonds is +1; O with 3 bonds is +1 and with 1 bond is −1).", "learner_can_do": "Calculate the formal charge on any non-hydrogen atom in a structure (e.g., the four oxygens of methyl phosphate dianion)."}, "2.4": {"title": "Resonance", "pages": [44, 45], "summary": "Some species, like acetate ion and benzene, can't be drawn with one line-bond structure. Acetate's two C–O bonds are identical (127 pm), so the real structure is a resonance hybrid of two resonance forms that differ only in where π and nonbonding electrons are placed. The molecule doesn't flip between forms; the limitation is in the drawing.", "learner_can_do": "Recognize when a species needs resonance forms and explain why the hybrid, not any single form, is the real structure."}, "2.5": {"title": "Rules for Resonance Forms", "pages": [45, 46], "summary": "Five rules for resonance: (1) individual forms are imaginary and the hybrid is real; (2) forms differ only in placement of π or nonbonding electrons, with atoms and hybridization fixed, and curved arrows show electron (not atom) movement; (3) forms need not be equivalent, and the hybrid resembles the more stable one (e.g., negative charge on O in the acetone anion); (4) every form must obey normal valence and octet rules; (5) the hybrid is more stable than any single form, and more forms mean more stability.", "learner_can_do": "Judge whether a proposed structure is a valid resonance form, and decide which of two nonequivalent forms contributes more."}, "2.6": {"title": "Drawing Resonance Forms", "pages": [46, 48], "summary": "Any three-atom grouping X=Y–Z* with a p orbital on each atom (Z having a vacant orbital, a radical electron, or a lone pair) has two resonance forms made by swapping the multiple bond and the asterisk end to end. Recognizing these groupings generates all resonance forms systematically, e.g., three for the 2,4-pentanedione anion, the carbonate ion, and the pentadienyl radical.", "learner_can_do": "Generate all resonance forms of an ion or radical (carbonate, nitrate, allyl cation, benzoate) by finding allylic three-atom groupings and pushing electrons with curved arrows."}, "2.7": {"title": "Acids and Bases: The Brønsted–Lowry Definition", "pages": [48, 49], "summary": "A Brønsted–Lowry acid donates H+ and a base accepts it. Acid–base reactions are reversible; the acid becomes its conjugate base and the base becomes its conjugate acid (HCl + H2O gives Cl− + H3O+). Water can act as acid or base depending on its partner.", "learner_can_do": "Label the acid, base, conjugate acid, and conjugate base in a proton-transfer reaction."}, "2.8": {"title": "Acid and Base Strength", "pages": [49, 51], "summary": "Acid strength in water is given by the acidity constant Ka, usually expressed as pKa = −log Ka: lower pKa means stronger acid. Ka spans about 10^15 to 10^−60. Water's pKa is 15.74. A strong acid has a weak conjugate base and a weak acid has a strong conjugate base (Table 2.3 lists ethanol 16.00 through HCl −7.0).", "learner_can_do": "Rank acids by pKa and rank their conjugate bases in the opposite order."}, "2.9": {"title": "Predicting Acid–Base Reactions from pKa Values", "pages": [51, 53], "summary": "H+ always moves from the stronger acid to the stronger base, so an acid–base reaction goes toward the weaker acid and weaker base. Comparing pKa values predicts whether a reaction proceeds (hydroxide deprotonates acetic acid, but not acetylene, pKa 25). Ka is found from pKa by antilog.", "learner_can_do": "Use pKa values to predict whether a given proton transfer occurs significantly, and convert between Ka and pKa."}, "2.10": {"title": "Organic Acids and Organic Bases", "pages": [53, 55], "summary": "Organic acids have a positively polarized H, either on O (methanol, acetic acid, whose conjugate bases put charge on O, and for acetate also resonance) or on C next to C=O (acetone, whose anion is resonance-stabilized with charge on O). Carboxylic acids exist as carboxylates at cellular pH 7.3. Organic bases have a lone pair that can take H+, most often nitrogen (amines); some compounds act as both. Amino acids exist mainly as zwitterions.", "learner_can_do": "Identify the acidic hydrogens and basic sites in an organic molecule and explain the conjugate-base stabilization that makes it acidic."}, "2.11": {"title": "Acids and Bases: The Lewis Definition", "pages": [55, 58], "summary": "Lewis acids accept an electron pair and Lewis bases donate one, forming a shared covalent bond. Lewis acids have a vacant low-energy orbital or can donate H+ (H+, Mg2+, BF3, AlCl3, TiCl4, FeCl3, ZnCl2, SnCl4); Lewis bases have lone pairs (H2O, alcohols, ethers, amines, carbonyl compounds). A curved arrow from the base's lone pair to the acid shows electron flow. Multi-site bases like acetic acid protonate where the product is most stable (the C=O oxygen, resonance-stabilized).", "learner_can_do": "Draw curved arrows showing a Lewis base donating a lone pair to a Lewis acid (e.g., acetaldehyde with H+, dimethyl ether with BF3)."}, "2.12": {"title": "Noncovalent Interactions between Molecules", "pages": [58, 60], "summary": "Noncovalent (intermolecular, van der Waals) interactions include dipole–dipole forces between polar molecules (attractive when unlike ends meet), dispersion forces from fleeting temporary dipoles in all molecules, and hydrogen bonds between an H on O or N and a lone pair on another O or N. Hydrogen bonds keep water liquid, shape enzymes, and pair DNA strands. Hydrophilic substances (many –OH groups) dissolve in water; hydrophobic ones don't.", "learner_can_do": "Identify which intermolecular force dominates in a substance and predict relative boiling points and water solubility (e.g., vitamin C hydrophilic vs. vitamin A hydrophobic)."}, "2.chemistry-matters": {"title": "Chemistry Matters—Alkaloids: From Cocaine to Dental Anesthetics", "pages": [61, 62], "summary": "Alkaloids are naturally occurring basic amines; about half of today's drugs derive from natural amines (morphine, ephedrine, cocaine). The search for non-addictive analogs of cocaine led to the 'caine' anesthetics (procaine/Novocain, lidocaine, mepivacaine, bupivacaine, prilocaine), which share structural features with cocaine.", "learner_can_do": null}, "2.key-terms": {"title": "Key Terms", "pages": [62, 62], "summary": "Glossary list of the 24 key terms introduced in Chapter 2.", "learner_can_do": null}, "2.summary": {"title": "Summary", "pages": [62, 63], "summary": "Chapter recap: polar covalent bonds from electronegativity, dipole moments, formal charges, resonance hybrids, Brønsted–Lowry acids/bases with Ka and pKa, Lewis acids/bases, and noncovalent interactions including hydrogen bonding.", "learner_can_do": null}, "2.problems": {"title": "Additional Problems", "pages": [63, 70], "summary": "Practice with resonance in naphthalene and azides, dipole moments of cis/trans dichloroethylene and maleic vs. fumaric acid, curved-arrow acid–base mechanisms, formal charges, pKa/Ka/pH calculations, ranking acidities, and
